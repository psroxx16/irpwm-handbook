<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17212B">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IRPWM">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/ibm-plex-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/barlow-condensed-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<title>IRPWM Handbook</title>
<meta name="description" content="Interactive, plain-language handbook of the Indian Railways Permanent Way Manual (2024 reprint, corrected up to ACS-16)">
<style>
@font-face{font-family:"Barlow Condensed";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/barlow-condensed-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/barlow-condensed-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/barlow-condensed-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/ibm-plex-mono-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/ibm-plex-mono-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/ibm-plex-sans-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/ibm-plex-sans-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/ibm-plex-sans-latin-600-normal.woff2) format("woff2")}
/* Layout: sticky signage header · left chapter rail (drawer on phones) · reading column ~70ch · tools as a grid of instrument panels */
:root{
  --bg:#F2F4F0; --surface:#FFFFFF; --surface-2:#E8ECE6; --ink:#17212B; --muted:#55626C; --line:#D2D9D3;
  --accent:#0E5A6E; --accent-soft:#DCEBEF; --accent-ink:#FFFFFF;
  --signal:#F2C02E; --signal-ink:#1A1A12;
  --ok:#2F7D4A; --ok-soft:#E0F0E5; --warn:#9A5F0C; --warn-soft:#FBEFD9; --bad:#B3261E; --bad-soft:#F8E1DF;
  --steel:#6B7C8A; --accent2:#C08A1E; --concrete:#B9BDB6; --ballast:#8E8C84; --blanket:#C9B68E; --soil:#9C7A55;
  --head:#17212B; --head-ink:#F2F4F0;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:6px; --side:280px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1418; --surface:#151E24; --surface-2:#1C2830; --ink:#E4EAEE; --muted:#97A6B0; --line:#2A3740;
  --accent:#62B6CA; --accent-soft:#183540; --accent-ink:#0E1418;
  --ok:#62C285; --ok-soft:#173326; --warn:#E3AA4D; --warn-soft:#3A2B12; --bad:#F07068; --bad-soft:#3E1C1A;
  --steel:#8FA2B1; --concrete:#7E837C; --ballast:#6F6D66; --blanket:#9C8C66; --soil:#7D6246;
  --head:#0A0F12; --head-ink:#E4EAEE; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E1418; --surface:#151E24; --surface-2:#1C2830; --ink:#E4EAEE; --muted:#97A6B0; --line:#2A3740;
  --accent:#62B6CA; --accent-soft:#183540; --accent-ink:#0E1418;
  --ok:#62C285; --ok-soft:#173326; --warn:#E3AA4D; --warn-soft:#3A2B12; --bad:#F07068; --bad-soft:#3E1C1A;
  --steel:#8FA2B1; --concrete:#7E837C; --ballast:#6F6D66; --blanket:#9C8C66; --soil:#7D6246;
  --head:#0A0F12; --head-ink:#E4EAEE; color-scheme:dark }

*{box-sizing:border-box}
html{scroll-padding-top:84px}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.6;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--head)}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;letter-spacing:.01em;line-height:1.1;margin:0}
.mono{font-family:var(--f-mono)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--head);color:var(--head-ink);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;
  display:flex;align-items:center;gap:14px}
.top::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:6px;
  background:repeating-linear-gradient(90deg,var(--signal) 0 14px,var(--head) 14px 28px);opacity:.9}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;min-width:0}
.brand svg{flex:none}
.brand b{font-family:var(--f-display);font-size:24px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap}
.brand small{display:block;font-family:var(--f-mono);font-size:11px;opacity:.75;letter-spacing:.04em;white-space:nowrap}
.searchbox{flex:1;max-width:520px;margin-left:auto;position:relative}
.searchbox input{width:100%;font:inherit;font-size:15px;padding:9px 12px 9px 36px;border-radius:var(--r);border:1px solid #3a4650;background:#222d35;color:#EEF2F4}
.searchbox input::placeholder{color:#9aa7b0}
.searchbox svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.7}
.menu-btn{display:none;background:none;border:1px solid #3a4650;color:inherit;border-radius:var(--r);padding:7px 9px;cursor:pointer}
@media (max-width:900px){.menu-btn{display:block}.brand small{display:none}.brand b{font-size:20px}}
@media (max-width:560px){.brand b{display:none}}

/* shell */
.shell{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:64px;align-self:start;height:calc(100vh - 64px);overflow:auto;border-right:1px solid var(--line);
  padding:22px 14px 40px max(14px,env(safe-area-inset-left,0px));background:var(--surface)}
.side h4{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:18px 8px 6px}
.side a{display:flex;gap:10px;align-items:baseline;padding:6px 8px;border-radius:5px;text-decoration:none;color:var(--ink);font-size:14px;line-height:1.3}
.side a .n{font-family:var(--f-mono);font-size:12px;color:var(--muted);min-width:22px}
.side a:hover{background:var(--surface-2)}
.side a.on{background:var(--accent-soft);color:var(--ink);box-shadow:inset 3px 0 0 var(--accent)}
.side .prog{margin-left:auto;font-family:var(--f-mono);font-size:10px;color:var(--muted)}
main{min-width:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:34px 80px}
.wrap{max-width:860px;margin:0 auto}
.wide{max-width:1180px;margin:0 auto}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;z-index:45;top:calc(58px + env(safe-area-inset-top,0px));left:0;bottom:0;height:auto;width:min(86vw,320px);transform:translateX(-105%);transition:transform .2s ease;box-shadow:0 10px 40px rgba(0,0,0,.25)}
  body.nav-open .side{transform:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* sleeper divider */
.rails{height:14px;margin:28px 0;border-top:2px solid var(--steel);border-bottom:2px solid var(--steel);
  background:repeating-linear-gradient(90deg,transparent 0 16px,var(--concrete) 16px 26px);opacity:.75}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:34px;align-items:center}
.hero h1{font-size:clamp(38px,6vw,64px);font-weight:700;text-transform:uppercase;letter-spacing:.01em}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p.lead{font-size:18px;color:var(--muted);max-width:56ch;margin:14px 0 0}
.stamp{display:inline-flex;gap:8px;align-items:center;font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;
  border:1.5px solid var(--ink);padding:4px 9px;border-radius:3px;margin-bottom:16px}
.stamp i{width:9px;height:9px;background:var(--signal);display:inline-block;border:1px solid var(--ink)}
@media (max-width:760px){.hero{grid-template-columns:minmax(0,1fr)}}
.stats{display:flex;flex-wrap:wrap;gap:22px;margin-top:22px}
.stats div{min-width:90px}
.stats b{display:block;font-family:var(--f-display);font-size:34px;line-height:1}
.stats span{font-size:12.5px;color:var(--muted)}
.howto{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-top:8px}
.howto a{display:block;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);text-decoration:none;color:var(--ink)}
.howto a b{display:block;font-family:var(--f-display);font-size:20px;text-transform:uppercase;letter-spacing:.02em}
.howto a span{font-size:13.5px;color:var(--muted)}
.howto a:hover{border-color:var(--accent)}
.chgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:14px}
.chcard{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);text-decoration:none;color:var(--ink)}
.chcard:hover{border-color:var(--accent)}
.kmpost{font-family:var(--f-display);font-weight:700;font-size:22px;width:44px;height:52px;display:grid;place-items:center;
  background:var(--surface);color:var(--ink);border:2px solid var(--ink);border-radius:10px 10px 3px 3px;box-shadow:inset 0 -9px 0 var(--surface-2)}
.chcard b{display:block;font-size:15px;line-height:1.3}
.chcard span{display:block;font-size:12.5px;color:var(--muted);margin-top:3px}
.sec-h{display:flex;align-items:baseline;gap:12px;margin:40px 0 4px}
.sec-h h2{font-size:28px;text-transform:uppercase}
.sec-h small{color:var(--muted);font-size:13px}
.note{font-size:13px;color:var(--muted);border-left:3px solid var(--line);padding:6px 12px;margin-top:22px}

/* chapter */
.chhead{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:end;margin-bottom:18px}
.chhead .kmpost{width:74px;height:90px;font-size:40px}
@media (max-width:560px){.chhead{gap:12px;align-items:start}.chhead .kmpost{width:48px;height:58px;font-size:26px}.chhead h1{font-size:27px}}
.chhead .eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.chhead h1{font-size:clamp(30px,4.6vw,46px);text-transform:uppercase;font-weight:700}
.why{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--signal);padding:14px 18px;border-radius:var(--r);font-size:16px}
.toc{display:flex;flex-wrap:wrap;gap:6px;margin:18px 0 6px}
.toc a{font-size:13px;padding:4px 9px;border:1px solid var(--line);border-radius:999px;text-decoration:none;color:var(--ink);background:var(--surface)}
.toc a:hover{border-color:var(--accent)}
.toc a.done{background:var(--ok-soft);border-color:transparent}
article.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 22px 20px;margin-top:16px;min-width:0}
article.sec.flash{animation:flash 1.6s ease}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--signal)}100%{box-shadow:0 0 0 0 transparent}}
.sech{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:8px}
.para{font-family:var(--f-mono);font-size:11.5px;font-weight:500;background:var(--ink);color:var(--bg);padding:3px 8px;border-radius:3px;letter-spacing:.02em}
.sech h3{font-size:23px;flex:1 1 300px;font-weight:600}
.done-btn{margin-left:auto;font:inherit;font-size:12px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:3px 10px;cursor:pointer}
.done-btn[aria-pressed="true"]{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.sec p{margin:8px 0}
.sec ul,.sec ol{margin:8px 0;padding-left:22px}
.sec li{margin:4px 0}
.sec li::marker{color:var(--muted)}
.acs{font-family:var(--f-mono);font-size:10.5px;background:var(--signal);color:var(--signal-ink);padding:1px 6px;border-radius:3px;white-space:nowrap;vertical-align:1px}
.small{font-size:13px;color:var(--muted)}
.tip,.warn,.check{border-radius:var(--r);padding:11px 14px;margin:12px 0;font-size:14.5px}
.tip{background:var(--accent-soft)}
.warn{background:var(--bad-soft)}
.check{background:var(--ok-soft)}
.check ul{margin:6px 0 0}
.formula{font-family:var(--f-mono);font-size:15px;background:var(--surface-2);border-radius:var(--r);padding:10px 14px;margin:10px 0;overflow-x:auto;white-space:nowrap}
.tblwrap{overflow-x:auto;margin:10px 0;border:1px solid var(--line);border-radius:var(--r)}
table.t{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
table.t th,table.t td{padding:7px 10px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
table.t th{background:var(--surface-2);font-weight:600;font-size:13px}
table.t tr:last-child td{border-bottom:0}
details{margin:10px 0;border:1px solid var(--line);border-radius:var(--r);padding:0 12px}
details[open]{padding-bottom:8px}
summary{cursor:pointer;padding:9px 0;font-weight:600;font-size:14px}
.sw{display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:-1px;margin-right:4px}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:12px 0}
.flow span{border:1.5px solid var(--ink);padding:5px 10px;border-radius:4px;font-size:13px;font-weight:500;background:var(--surface)}
.flow i{font-style:normal;color:var(--muted)}
.layers{display:grid;gap:3px;margin:12px 0}
.layers div{padding:8px 12px;border-left:14px solid var(--c);background:var(--surface-2);border-radius:3px;font-size:14px}
.cards3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:12px 0}
.cards3 .card{padding:12px 14px;border-radius:var(--r);font-size:14px;border:1px solid var(--line);background:var(--surface-2)}
.cards3 .c-ok{background:var(--ok-soft)}.cards3 .c-warn{background:var(--warn-soft)}.cards3 .c-bad{background:var(--bad-soft)}
svg.diag{width:100%;max-width:720px;height:auto;display:block;margin:10px 0;color:var(--ink)}
svg.diag text{fill:var(--ink);font-family:var(--f-body)}
.facts{margin-top:30px}
.chnav{display:flex;justify-content:space-between;gap:12px;margin-top:30px;flex-wrap:wrap}
.chnav a{flex:1 1 220px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);text-decoration:none;color:var(--ink);background:var(--surface)}
.chnav a small{display:block;color:var(--muted);font-size:12px}
.chnav a.nx{text-align:right}
.btn{font:inherit;font-size:14px;font-weight:500;padding:8px 14px;border-radius:var(--r);border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer;text-decoration:none;display:inline-block}
.btn.ghost{background:var(--surface);color:var(--accent)}

/* search */
.res{display:grid;gap:10px;margin-top:16px}
.res a{display:block;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);text-decoration:none;color:var(--ink)}
.res a:hover{border-color:var(--accent)}
.res .meta{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.res b{display:block;font-size:15.5px;margin:2px 0}
.res p{margin:0;font-size:13.5px;color:var(--muted)}
mark{background:var(--signal);color:var(--signal-ink);padding:0 2px;border-radius:2px}

/* tools */
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,470px),1fr));gap:16px;margin-top:18px}
.tool{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.tool h3{font-size:22px;text-transform:uppercase;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.tool h3 .para{font-size:10.5px}
.tool > p{font-size:13.5px;color:var(--muted);margin:4px 0 10px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px 12px}
.fields label{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--muted);font-weight:500}
.fields input,.fields select,textarea.ta{font:inherit;font-size:14.5px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:7px 9px;width:100%;font-variant-numeric:tabular-nums}
textarea.ta{font-family:var(--f-mono);font-size:13px;min-height:62px;resize:vertical}
.out{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px;font-size:14px}
.out .big{font-family:var(--f-display);font-size:30px;line-height:1.1}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.kv div{background:var(--surface-2);border-radius:5px;padding:8px 10px}
.kv span{display:block;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.kv b{font-family:var(--f-mono);font-size:16px;font-weight:500}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.info{background:var(--accent-soft);color:var(--accent)}
.rows{display:grid;gap:6px;margin-top:6px}
.rows div{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:6px 10px;background:var(--surface-2);border-radius:5px;font-size:13.5px;flex-wrap:wrap}
.ladder{position:relative;margin:10px 0 4px;padding-left:4px}
.ladder .rung{display:grid;grid-template-columns:72px minmax(0,1fr);gap:10px;align-items:center;font-size:12.5px;padding:3px 0;border-top:1px solid var(--line)}
.ladder .rung b{font-family:var(--f-mono);font-weight:500;font-size:12.5px}
.ladder .rung.now{background:var(--signal);color:var(--signal-ink);border-radius:4px;padding-inline:6px;font-weight:600}
.ladder .rung.hot b{color:var(--bad)}.ladder .rung.cold b{color:var(--accent)}
.toolnav{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.toolnav a{font-size:12.5px;padding:4px 9px;border-radius:999px;border:1px solid var(--line);text-decoration:none;color:var(--ink);background:var(--surface)}

/* ref / glossary */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0}
.filters input{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink);flex:1 1 220px}
.chip{font:inherit;font-size:12.5px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.gl{display:grid;gap:8px}
.gl div{padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.gl b{font-size:15px}
.gl p{margin:3px 0 0;font-size:14px}
.gl small{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.abbr{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:6px}
.abbr div{display:grid;grid-template-columns:96px minmax(0,1fr);gap:8px;padding:6px 10px;background:var(--surface);border:1px solid var(--line);border-radius:5px;font-size:13.5px}
.abbr b{font-family:var(--f-mono);font-size:12.5px}

/* acs */

id:"c01", n:1, title:"Duties of Permanent Way Officials", short:"Who does what",
why:`Track is safe only when every person in the chain — from the Assistant Divisional Engineer down to the Track Maintainer — knows their job. This chapter is the "job description" of every P.Way official: what they must know, what they must inspect, how often, and what to do in an emergency.`,
sections:[
{id:"c01-chain", para:"Overview", title:"The P.Way chain of command (who reports to whom)", body:`
<p>Think of a railway division's track organisation like a school: the <b>ADEN</b> is the principal of a sub-division, the <b>SSE/P.Way (In-charge)</b> is the class teacher of a section, the <b>JE/SSE (Sectional)</b> handles a sub-section, and the <b>Gang Mate, Keyman and Track Maintainers</b> do the daily work on a gang length.</p>
<div class="flow"><span>DEN / Sr.DEN</span><i>→</i><span>ADEN (sub-division)</span><i>→</i><span>SSE/P.Way (In-charge)</span><i>→</i><span>JE/SSE/P.Way (Sectional)</span><i>→</i><span>JE/SSE (Other: gang/special works)</span><i>→</i><span>Gang Mate</span><i>→</i><span>Keyman · Patrolman · Gateman · Track Maintainer</span></div>
<p>Old names were renamed in the redrafted manual: <b>Gangman → Track Maintainer</b>; <b>PWS/PWM → JE (P.Way)</b>; <b>PWI → JE/SSE (P.Way) Sectional or SSE (P.Way) In-charge</b>.</p>
<div class="tip"><b>Remember:</b> every inspection by ADEN, SSE and JE is to be <b>entered in TMS</b> (Track Management System, Chapter 13). Paper registers have largely been withdrawn.</div>`},
{id:"c01-aden", para:"101–103", title:"ADEN — Assistant Divisional Engineer", body:`
<p><b>In simple words:</b> The ADEN is responsible for inspection, maintenance and safety of all way &amp; works (including bridges) in the sub-division, the quality and progress of new works, and keeping expenditure within budget.</p>
<p><b>Must know (Para 102):</b> Railways Act; G&amp;SR; IRSOD (BG); IRPWM; Indian Railways Standard Track Manual (Vol I &amp; II); Manuals for Flash Butt Welding, AT Welding, Glued Joints, Reconditioning of MM/CMS crossings &amp; SEJs, USFD testing; IRTMM; Small Track Machine Manual; Bridge Manual; Works Manual; Engineering Code — all with latest correction slips. Must also know the TMS modules.</p>
<p><b>Key duties (Para 103):</b></p>
<ul>
<li>Inspect as per <b>Table 1A</b>, record in TMS and get compliance.</li>
<li>Ensure remedial action on badly behaving LWR/CWR, and <b>issue a certificate every February</b> (before summer) to DEN/Sr.DEN that all LWR/CWR in the sub-division are behaving satisfactorily.</li>
<li>Monitor track machines (pre-block, block, post-block activities; lighting and fuel; clearing the section if a machine breaks down).</li>
<li>Prepare plans/estimates, execute works per tender, timely measurement &amp; bills; measure ballast or 100% check it.</li>
<li>Scrutinise TMS entries of SSE/JE and <b>cross-verify selected inspections in the field</b> — especially P&amp;C, LWR and LCs <span class="acs">ACS-10</span>.</li>
<li>Test-check USFD work at least once a month; inspect office &amp; stores of every SSE (In-charge) once a year.</li>
<li>Accompany higher officials carrying manuals, list of PSR/TSR, TMS data dump (TRC/OMS, fractures), registers, sanctioned works, inspection notes, Working Time Table.</li>
<li>Accompany TRC/OMS runs and get the noted spots rectified <span class="acs">ACS-3</span>.</li>
<li>Monitor "material under trial", train probationers, handle staff matters (discipline, records, selections, uniforms/safety shoes).</li>
<li><b>Emergencies:</b> rush to accident/breach site by quickest means, arranging men, material and ART equipment on the way.</li>
<li>Pre-monsoon / summer / winter preparedness; list of Railway Affecting Works (RAW) and vulnerable locations; joint RAW/RAT inspection with State authority before monsoon.</li>
<li>Inspect works of RVNL, RITES, DFCCIL, construction etc. for quality and safety of running trains.</li>
</ul>`},
{id:"c01-t1a", para:"Table 1A", title:"ADEN inspection schedule (Table 1A)", body:`
<table class="t"><tr><th>What</th><th>How often</th></tr>
<tr><td>Foot / Push-trolley inspection — routes &gt;110 km/h &amp; multiple-line routes</td><td>Entire section once in <b>4 months</b> (preferably under block; else mainly on foot)</td></tr>
<tr><td>Foot / Push-trolley — other routes</td><td>One block section per SSE(In-charge) every quarter on foot; entire section incl. loops &amp; yards once in <b>3 months</b> by push trolley</td></tr>
<tr><td>Fast train (engine / rear window)</td><td>Once a month, entire sub-division</td></tr>
<tr><td>Level crossings</td><td>All, once in 6 months</td></tr>
<tr><td>Curves</td><td>Based on TRC/OMS/footplate results &amp; JE/SSE inspections</td></tr>
<tr><td>Points &amp; Crossings</td><td>Once a year — all P&amp;C on passenger lines + 10% on other lines (main line on Annexure 4/3, others on 4/3A)</td></tr>
<tr><td>LWR / SEJ</td><td>All, once in 6 months (preferably hottest &amp; coldest months)</td></tr>
<tr><td>Track on bridges / channel sleepers</td><td>With annual bridge inspection / once a year</td></tr>
<tr><td>AT welding site</td><td>At least one welding team under each SSE(In-charge) per month</td></tr>
<tr><td>USFD test check</td><td>Monthly, minimum 2 hours during trolley inspection</td></tr>
<tr><td>Monsoon patrolling check</td><td>Once a month at night (when introduced)</td></tr>
<tr><td>Hot weather patrolling check</td><td>Once a month, daytime (12:00–16:00 preferred)</td></tr>
<tr><td>Night footplate</td><td>Once a month (preferably 00:00–04:00)</td></tr>
<tr><td>Bridges (incl. ROB/RUB)</td><td>Once a year after monsoon</td></tr>
<tr><td>Tunnels / Cuttings</td><td>Once a year before monsoon</td></tr>
<tr><td>RAW / RAT</td><td>Every year before monsoon, jointly with State authority</td></tr>
<tr><td>Private siding · Land verification · Drains/waterways · SSE office &amp; store</td><td>Once a year each (drains before monsoon)</td></tr>
<tr><td>Small track machines</td><td>Once in 6 months</td></tr>
<tr><td>Track machines</td><td>Fortnightly: TEXP, CSM, DTS, WST, UNIMAT, BCM, SBCM, PCCM, TLE, RGM, TRT. Once per deployment: MPT, BRM, UTV &amp; others</td></tr>
</table>
<p class="small">Notes: Ghat sections without road access (approved by PCE) follow "Other routes" frequency. On-foot inspectors must be accompanied by an extra trackman as look-out, carry PPE and an approaching-train warning system. Push trolleys are to be progressively replaced by <b>Rail-cum-Road Inspection Vehicles (RCRIV)</b>, used under block.</p>`},
{id:"c01-sse", para:"104–106", title:"SSE/P.Way (In-charge)", body:`
<p><b>In simple words:</b> The SSE (In-charge) is <i>directly</i> responsible for the safety of track in the section, all maintenance and relaying works, the P.Way store, land boundaries and compliance of inspection notes.</p>
<ul>
<li>Inspect per <b>Table 1B</b>, enter in TMS; watch track behaviour under passing trains; travel on footplate/rear brake van to locate bad running; remove trees that may foul track in storms.</li>
<li><b>LWR/CWR duties (106(2))</b>: arrange hot/cold weather patrolling and mobile watchmen; record rail temperatures and t<sub>d</sub>; check rail thermometers against a standard thermometer; impose speed restriction if rail temperature exceeds <b>t<sub>d</sub> + 20°C</b> during the consolidation period after maintenance; recoup ballast to standard profile <b>before summer</b>; keep a permanent record of each LWR.</li>
<li>Bridges: inspect track and approaches of all bridges (incl. footpath) once a year before monsoon; tunnels and cuttings before monsoon; clear drains.</li>
<li>Track machines: HSD oil, lighting, tamping tools, site protection and look-out men, stabling of machines, coordination with Traffic/OHE/S&amp;T.</li>
<li>Quality of <b>AT welding</b> is his direct responsibility. <b>Avoidable fractures</b> are also his responsibility — <i>except</i> where USFD testing found the rail/weld good within the 3 months before the fracture.</li>
<li>Store: security of material, timely indents, Imprest stock of rails, CMS crossings, switches, SEJs, glued joints at nominated locations, timely scrap disposal.</li>
<li>Carry to higher officials' inspections: gauge-cum-level, flange-way gauge, fishing cord, tape, 30 cm steel scale, tapered &amp; feeler gauge, magnifying glass &amp; mirror, versine equipment, inspection hammer, rail thermometer.</li>
<li>Accompany every TRC/OMS run; counsel Trackmen, Gatemen, Keymen, Patrolmen; send staff for medical exams; follow Payment of Wages Act, Workmen's Compensation Act, HOER.</li>
<li>Clear undergrowth in yards yearly (before seeds ripen); keep land free of encroachment; update all TMS data; cross-verify subordinates' P&amp;C, LWR and LC entries <span class="acs">ACS-10</span>.</li>
</ul>`},
{id:"c01-je", para:"107–109", title:"JE/SSE/P.Way (Sectional)", body:`
<p>Responsible for safe maintenance of the sub-section, special works (renewals, curve realignment, deep screening) and for preparing the <b>Keyman's date-wise schedule</b> (which km/TP to attend each day), then checking and initialling it during inspections.</p>
<ul>
<li>Same LWR duties as SSE (106(2)(a)).</li>
<li><b>When deputed on a track machine</b>, he is in charge of supervision: safe movement of the machine, tamping depth, squeeze pressure, tool wear, checking track parameters during work, ensuring track is free of infringements before clearing the block and allowing traffic at suitable speed restriction, issuing caution orders.</li>
<li>Observe movement of turnouts, SEJs, glued and fish-plated joints under traffic in yards.</li>
</ul>`},
{id:"c01-t1b", para:"Table 1B", title:"SSE (In-charge) & JE/SSE (Sectional) inspection schedule (Table 1B)", body:`
<table class="t"><tr><th>What</th><th>SSE (In-charge)</th><th>JE/SSE (Sectional)</th></tr>
<tr><td>Foot/Push trolley — routes &gt;110 km/h &amp; multiple lines</td><td>Entire section incl. loops &amp; yards once in <b>2 months</b></td><td>Entire section once a <b>fortnight</b> on foot</td></tr>
<tr><td>Foot/Push trolley — other routes</td><td>On foot once a year; push trolley once in 2 months</td><td>On foot once in 6 months; push trolley once a fortnight</td></tr>
<tr><td>Track parameters of loop &amp; yard lines (gauge, cross level, twist, versine)</td><td colspan=2>By JE/SSE (Sectional): passenger loop lines &amp; crossovers once in <b>3 months</b>; other lines once in <b>6 months</b> <span class="acs">ACS-3</span></td></tr>
<tr><td>Loco / brake van / rear window</td><td>Fortnightly</td><td>Monthly</td></tr>
<tr><td>Level crossings</td><td colspan=2>All LCs once a month by rotation (check gateman's rules knowledge, equipment, road approaches)</td></tr>
<tr><td>Curves</td><td>Based on TRC/OMS/FP</td><td>&gt;2°: once in 6 months (rotation with SSE); ≤2°: once a year</td></tr>
<tr><td>Points &amp; Crossings</td><td colspan=2>Passenger &amp; running lines: once in 3 months by rotation; other/yard lines: once in 6 months; one inspection a year on Annexure 4/3</td></tr>
<tr><td>LWR / SEJ</td><td colspan=2>Fortnightly in the 2 hottest &amp; 2 coldest months (declared by DEN); otherwise once in 2 months, by rotation</td></tr>
<tr><td>Channel sleepers on bridges</td><td colspan=2>Once in 6 months by rotation</td></tr>
<tr><td>AT welding site</td><td>Each welding team once a month</td><td>—</td></tr>
<tr><td>USFD test check</td><td>Monthly, min. 2 hrs</td><td>—</td></tr>
<tr><td>Night inspection / night footplate</td><td>Monthly / Monthly</td><td>— / Monthly</td></tr>
<tr><td>Monsoon patrolling check</td><td>Monthly</td><td>Fortnightly by train</td></tr>
<tr><td>Bridges · Tunnels · Cuttings</td><td>Bridges before monsoon; tunnels after monsoon; cuttings immediately after monsoon</td><td>Cuttings before monsoon</td></tr>
<tr><td>Private siding</td><td>Once in 6 months</td><td>Once in 3 months</td></tr>
<tr><td>Land boundary / encroachment</td><td>Yearly / quarterly</td><td>—</td></tr>
<tr><td>Drains &amp; waterways</td><td>Yearly before monsoon</td><td>Yearly in April</td></tr>
<tr><td>TRC/OMS run</td><td>Accompany every run</td><td>—</td></tr>
<tr><td>Small track machines</td><td>Quarterly</td><td>—</td></tr>
<tr><td>Washable apron / ballastless track</td><td colspan=2>Quarterly by rotation</td></tr>
<tr><td>Sand humps &amp; dead ends</td><td colspan=2>Monthly by rotation</td></tr>
<tr><td>Joint inspection with S&amp;T</td><td colspan=2>P&amp;C quarterly; insulated steel sleepers on bridges half-yearly</td></tr>
<tr><td>Track machines working in section</td><td colspan=2>During pre-block/block/post-block, not less than once a week</td></tr>
</table>
<p class="small">Every gang member's knowledge of safety rules is to be examined at least once in 2 months. Trespass locations and their protection measures are to be reviewed <span class="acs">ACS-10</span>.</p>`},
{id:"c01-other", para:"110–111, Table 1C", title:"JE/SSE/P.Way (other than Sectional / In-charge)", body:`
<p>Works as in-charge of assigned gang(s) or special works (e.g. relaying). Must stay with the gang <b>at least two days a week</b>, record inspections in a diary and do Gang Mate duties when in charge of gangs.</p>
<table class="t"><tr><th>Table 1C item</th><th>Frequency</th></tr>
<tr><td>Foot inspection — passenger running lines</td><td>Monthly (with Keyman); other lines quarterly</td></tr>
<tr><td>Gang inspection (attendance, work, tools, diary, safety counselling)</td><td>Weekly; daily gang work entry in TMS</td></tr>
<tr><td>Level crossings</td><td>Monthly</td></tr>
<tr><td>Curves</td><td>Once in 6 months</td></tr>
<tr><td>P&amp;C</td><td>Passenger lines monthly; others quarterly</td></tr>
<tr><td>Hot weather patrolling check</td><td>Fortnightly, on foot</td></tr>
<tr><td>SEJ (packing, fittings, oiling &amp; greasing)</td><td>Once in 15 days</td></tr>
</table>`},
{id:"c01-mate", para:"112–114", title:"Gang Mate", body:`
<p>The Gang Mate is the leader of the gang and keeps the line safe for trains. Urgent defects must be attended <b>without waiting for orders</b>.</p>
<p><b>Every Gang Mate, Keyman and Track Maintainer must know (Para 113):</b> "Safety First" rules, fixing and safety range of detonators, protecting the line in emergency, action on a parted train / hot axle, action when sabotage is suspected.</p>
<ul>
<li>Keeps muster and gang chart/diary; ensures safety equipment is in order.</li>
<li><b>Observe sleepers under the first and last trains</b> of working hours standing on the cess about one rail length apart; mark and pack loose sleepers. On double line always stand on the cess side, never between tracks.</li>
<li><b>If an approaching train cannot be seen from 600 m</b>, post a Flagman with hand signals (double line: towards approaching trains; single line: towards obstructed side, both sides if needed). Portable whistle boards may be fixed at least 600 m away.</li>
<li>Tools: never left on track when a train approaches; locked in toolbox after work; never taken home.</li>
<li>If line is unsafe: protect with "Proceed with Caution" or "Stop" signals (Para 806/812), report to SM and JE/SSE. In accidents, preserve broken fittings untouched until recorded.</li>
<li>Organise patrolling during abnormal rainfall even if patrolmen are on duty.</li>
<li>No work endangering trains except under JE/SSE's personal supervision — unless an emergency, then only after exhibiting engineering signals and posting flagmen.</li>
<li><b>Weekly inspection</b> of entire gang length — that day he does Keyman's duties and Keyman runs the gang.</li>
<li>Prevent trespass and theft; arrange relief for sick keyman/gateman/patrolman; on SM's request, depute 2 men for fog signals.</li>
</ul>
<div class="warn"><b>LWR duties of Gang Mate (114(17))</b>: work in LWR only with a valid <b>competency certificate</b>; order patrolling if rail temp likely to reach <b>t<sub>d</sub> + 20°C</b>; on a <b>danger of buckle</b>: rush to site, protect it, inspect 100 m either side, heap and compact ballast on shoulders up to rail head, <b>do NOT slew or align track</b>, note rail temperature, cover the sun-facing rail with ballast/leaves to cool it, and stay until JE/SSE arrives.</div>`},
{id:"c01-keyman", para:"115–116", title:"Keyman", body:`
<ul>
<li>Inspects the <b>entire beat once a day on foot</b>. Single line: go out on one rail, return along the other. Double line: go along UP, return along DN (or vice-versa).</li>
<li>In winter, roster is fixed so the round happens in <b>early morning</b> to catch night-time rail/weld fractures (timings notified by DEN).</li>
<li><b>Equipment:</b> 2 red flags, 1 green flag, <b>10 detonators</b>, keying hammer, alloy spanner D/E, tubular spanner, tapered gauge, tapered pin, Keyman diary, spare fittings, <b>30 mm rail closure</b>.</li>
<li>Looks for loose fish bolts, joggled fish plate bolts, SEJ and P&amp;C fittings, bridge fittings, broken/notched sleepers, broken plates or tie bars.</li>
<li>Keeps special watch on rails/welds <b>marked by the USFD team</b>.</li>
<li>Daily, thoroughly attends <b>one OHE mast / hectometre post length</b> on one line: every bolt and fitting checked and tightened, missing ERCs/liners recouped.</li>
<li>Issues caution to drivers using pre-printed paper slips (location &amp; speed), with acknowledgement.</li>
<li>LWR duties: <b>fortnightly greasing of SEJ</b> <span class="acs">ACS-12</span>; watch for sun kinks; sharp vigil on cold mornings for fractures; emergency repairs and reporting.</li>
<li>Watch height gauges for damage; report encroachments; hand over things found on line to SM; runs the gang once a week.</li>
<li>Keyman's book: special work, missing fittings, special locations, vital special fittings (joggled fishplates etc.) <span class="acs">ACS-3</span>.</li>
</ul>`},
{id:"c01-patrol", para:"117", title:"Patrolman, Stationary & Mobile Watchman", body:`
<p>In an emergency a patrolman's whole attention goes to <b>protecting the line and calling for help</b>; only then does he resume patrolling.</p>
<table class="t"><tr><th>Type</th><th>When</th><th>What to look for / do</th></tr>
<tr><td>Monsoon patrolman</td><td>Rainy season, per patrol chart</td><td>Subsidence, slips, erosion, fallen trees, bridges and approaches. Danger if flood crosses danger level, protection works damaged, water much higher on one side of bank, or waterway blocked. When safe: stand on the <b>left-hand cess facing the train</b>, show number plate with lamp, blow whistle. Get SM signature and exchange patrol books with neighbours.</td></tr>
<tr><td>Hot weather patrolman (LWR)</td><td>Hottest part of the day</td><td>Kinks, incipient buckles. On seeing a kink, examine <b>100 sleepers ahead and behind</b>. Walk out on one rail, back on the other (alternate UP/DN on double line).</td></tr>
<tr><td>Cold weather patrolman (LWR)</td><td>Coldest part of the night</td><td>Rail/weld fractures, SEJ gap beyond designed maximum, sheared bolts — suspend traffic and protect.</td></tr>
<tr><td>Mobile watchman</td><td>During consolidation after maintenance when rail temp exceeded t<sub>d</sub>+20°C</td><td>Does hot/cold weather patrol duties on that stretch till consolidation is over.</td></tr>
</table>`},
{id:"c01-gateman", para:"118–119", title:"Gateman and Track Maintainer", body:`
<ul>
<li>Gateman keeps gate keys on his person, stands <b>facing the track on the gate-lodge side</b> of the approaching train, and looks after tri-colour torch, banner flag, detonators and flags.</li>
<li><b>Obstruction at LC (day):</b> keep gate signals ON; plant a red banner flag <b>5 m from the end of check rails</b> on the line where a train is expected first, another at the obstruction on the other line; go with red hand signal, place <b>1 detonator at 600 m</b>, then <b>3 detonators 10 m apart at not less than 1200 m</b>; return picking up the intermediate detonator; repeat for the other line/direction; stay at obstruction to warn drivers <span class="acs">ACS-15</span>. At night use red lights. Inform Gang Mate, JE/SSE and SM.</li>
<li><b>Parted train:</b> never show a stop signal — attract driver and guard by shouting/gesturing.</li>
<li>Track Maintainers maintain track and relieve gatemen/keymen, patrol, load/unload material as directed.</li>
</ul>`}
],

CH.push({
id:"c02", n:2, title:"Track Structure and Components", short:"Rails, sleepers, ballast, formation",
why:`A railway track is a layered "sandwich": <b>rails</b> carry the wheels, <b>fastenings</b> hold rails to <b>sleepers</b>, sleepers spread the load into <b>ballast</b>, and ballast passes it to the <b>formation</b> (the earth bed). This chapter tells you which rail, sleeper, fastening, ballast depth and formation width to use for each class of line, how to recognise materials in the field, and how track is built on bridges and in tunnels.`,
sections:[
{id:"c02-layers", para:"Overview", title:"How the track 'sandwich' works", body:`
<div class="layers">
<div style="--c:var(--steel)"><b>Rail</b> — guides wheels, carries load (60 kg / 52 kg)</div>
<div style="--c:var(--accent2)"><b>Fastening</b> — ERC + GRSP + Liner + Insert hold rail to sleeper</div>
<div style="--c:var(--concrete)"><b>Sleeper</b> — PSC mono-block, keeps gauge, spreads load</div>
<div style="--c:var(--ballast)"><b>Ballast</b> — crushed stone; drainage, elasticity, holds sleepers in place</div>
<div style="--c:var(--blanket)"><b>Blanket</b> — granular layer between ballast and subgrade (where provided)</div>
<div style="--c:var(--soil)"><b>Formation / Subgrade</b> — the prepared earth bank or cutting</div>
</div>
<p>Load from a 25 t axle is spread layer by layer so that the soil underneath receives a pressure it can safely bear. If any layer fails (missing fitting, cracked sleeper, dirty ballast, weak soil), the track geometry deteriorates.</p>`},
{id:"c02-groups", para:"201–202", title:"Classification of BG lines & track for higher speeds", body:`
<table class="t"><tr><th>Group</th><th>Basis (future max. permissible speed)</th></tr>
<tr><td><b>A</b></td><td>Up to 160 km/h</td></tr>
<tr><td><b>B</b></td><td>Up to 130 km/h</td></tr>
<tr><td><b>C</b></td><td>Suburban sections of Mumbai, Delhi, Chennai, Kolkata</td></tr>
<tr><td><b>D</b></td><td>Up to 110 km/h ("D Special" or "E" anywhere in IRPWM is to be read as D)</td></tr></table>
<p><b>Track structure for passenger speeds above 110 km/h (Para 202):</b></p>
<table class="t"><tr><th>Item</th><th>&gt;110 up to 130 km/h</th><th>&gt;130 up to 160 km/h</th></tr>
<tr><td>Rail</td><td>60 kg, 90 UTS</td><td>60 kg, 90 UTS</td></tr>
<tr><td>Sleepers</td><td>PSC @ 1660/km</td><td>PSC @ 1660/km (wider &amp; heavier PSC during renewals)</td></tr>
<tr><td>Ballast cushion</td><td>300 mm total (150 clean)</td><td>350 mm total (150 clean)</td></tr>
<tr><td>Switch</td><td>Thick Web Switches on all turnouts</td><td>Thick Web Switches on all turnouts</td></tr>
<tr><td>Crossing</td><td>CMS</td><td>Weldable CMS</td></tr>
<tr><td>SEJ</td><td>Improved type</td><td>Improved type</td></tr>
<tr><td>Bridge sleepers</td><td colspan=2>H-Beam / Composite sleepers</td></tr>
<tr><td>Level crossings</td><td>Interlocked</td><td><b>No level crossing</b></td></tr>
<tr><td>Fencing</td><td colspan=2>All along the track</td></tr></table>
<div class="tip">Curves: max cant <b>185 mm</b> may be provided (subject to cant excess for slowest train). With 150 mm cant deficiency and 185 mm cant, a 1.3° curve allows 160 km/h and a 2.2° curve 130 km/h (for goods speed 65 km/h).</div>`},
{id:"c02-rails", para:"203–205", title:"Rails — sections, marking, quality & recommended use", body:`
<table class="t"><tr><th>Section</th><th>Area (cm²)</th><th>Mass (kg/m)</th></tr>
<tr><td>52 kg</td><td>66.15</td><td>51.89</td></tr>
<tr><td>60 kg (UIC 60)</td><td>76.86</td><td>60.34</td></tr>
<tr><td>60 E1 (new accurate profile for 60 kg)</td><td>76.70</td><td>60.21</td></tr></table>
<p>60 E1 differs from UIC 60 only slightly at the rail head top; flange, web and fishing planes are identical. Rails are made to <b>IRS-T-12</b>. Standard lengths: <b>13 m or 26 m</b>; longer rails of <b>65, 130 and 260 m</b> may be supplied.</p>
<p><b>Brand marks</b> (rolled in relief on the web): section, grade (e.g. "880"), manufacturer, month (Roman) and year (2 digits), steel-making process ("O" basic oxygen, "E" electric), rolling direction.</p>
<p><b>Prime quality rails</b> are Class A or B by end straightness:</p>
<table class="t"><tr><th>End straightness</th><th>Class A</th><th>Class B</th></tr>
<tr><td>Horizontal</td><td>0.5 mm on 2.0 m straight edge</td><td>0.7 mm on 1.5 m straight edge</td></tr>
<tr><td>Vertical up-sweep</td><td>0.4 mm on 2.0 m</td><td>0.5 mm on 1.5 m</td></tr>
<tr><td>Vertical down-sweep</td><td>Nil</td><td>Nil</td></tr></table>
<p><b>Industrial Use (IU) rails</b>: same chemistry and strength, only wider dimensional tolerances. Use only in industrial sidings at <b>max 50 km/h</b>. Identified by <b>blue paint on end face of flange and both sides of flange for 500 mm</b> and "IU" stamped in 15 mm letters on both end faces.</p>
<p><b>Recommended rail section (Para 205):</b></p>
<ul><li>Main line renewals, doubling, new lines, gauge conversion: <b>new 60 kg, min. 90 UTS</b>.</li>
<li>Passenger running loop lines: 60 kg. Other loops: 60/52 kg second-hand (SH); new rails with CTE's approval.</li>
<li>GC/new lines with &lt;5 GMT projected traffic: 60 kg SH may be used in main and passenger loops.</li>
<li>Sidings off DFC/feeder routes/25 t routes: 60 kg. Other sidings ≤50 km/h: 52 kg SH or 52 kg IU. Other sidings &gt;50 km/h: 60 kg <span class="acs">ACS-12</span>.</li></ul>`},
{id:"c02-colour", para:"204, Annex 2/1", title:"Colour code for new rails", body:`
<table class="t"><tr><th>Grade</th><th>Extra marking (besides length code)</th></tr>
<tr><td>GR 880</td><td>Only the common length-wise code; no paint on web</td></tr>
<tr><td>GR 1080 Head Hardened</td><td><span class="sw" style="background:#2563eb"></span>Blue on both sides of web, 500 mm from each end</td></tr>
<tr><td>GR 1080 Cr</td><td><span class="sw" style="background:#16a34a"></span>Green on both sides of web, 500 mm</td></tr>
<tr><td>Class 'A' rail</td><td>Grade code 1, 2 &amp; 3 and green paint on gauge/non-gauge face, 500 mm</td></tr>
<tr><td>Niobium 880 NB</td><td><span class="sw" style="background:#9333ea"></span>Purple on web</td></tr>
<tr><td>Vanadium 880 VN</td><td><span class="sw" style="background:#eab308"></span>Yellow on web</td></tr>
<tr><td>Copper-Molybdenum 880 CM</td><td><span class="sw" style="background:#fff;border:1px solid #888"></span>White on web</td></tr>
<tr><td>Nickel-Chromium-Copper 880 NC</td><td><span class="sw" style="background:#7c2d12"></span>Brown on web</td></tr>
<tr><td>IU</td><td><span class="sw" style="background:#2563eb"></span>Blue on end face of flange and both sides of flange, 500 mm</td></tr></table>
<p><b>Length code — paint on the end face (web region):</b> <span class="sw" style="background:#eab308"></span>Yellow = 13, 26, 130, 260 m · <span class="sw" style="background:#2563eb"></span>Blue = 12, 25, 129, 259 m · <span class="sw" style="background:#fff;border:1px solid #888"></span>White = 11, 24 m · <span class="sw" style="background:#16a34a"></span>Green = 10 m. <b>No paint on gauge/non-gauge face = Class B rail.</b></p>
<p class="small">This code is for new rails. For released (second-hand) rails see Para 722 (Chapter 7).</p>`},
{id:"c02-fish", para:"206", title:"Rail fastenings — fishplates", body:`
<ul><li><b>Fishplates</b> (IRS-T-1) join rail ends with fish bolts.</li>
<li><b>Joggled fishplates</b> (with clamps or far-end bolts) go over welded joints or fracture locations — the "joggle" bulge clears the weld collar.</li>
<li><b>Combination fishplates</b> join two different rail sections — a set of four, marked IR, OR, IL, OL. Use full rail lengths either side. <b>Welded combination rails</b> (two sections welded per standard drawing) are preferred over combination fishplates.</li></ul>`},
{id:"c02-sleepers", para:"207–209", title:"Sleepers and sleeper density", body:`
<p>Wooden, cast iron and steel trough sleepers are obsolete. <b>Mono-block Pre-stressed Concrete (PSC)</b> sleepers are standard — they give the longitudinal and lateral resistance LWR needs and their flat bottom suits machine tamping. Specs: <b>IRS T-39</b> (plain track), <b>IRS T-45</b> (turnouts). Composite sleepers are being introduced for girder bridges and P&amp;C.</p>
<ul><li>Drawing no., manufacturer code and year are engraved on the sleeper top end — don't obliterate them.</li>
<li><b>FTC</b> painted = Fit for Track Circuiting; <b>NFTC</b> = Not Fit (failed electrical resistance test).</li>
<li>In fish-plated/SWR track on concrete sleepers, keep spacing uniform even at joints; preferably use <b>1 m long fishplates</b>.</li>
<li>Prefer sleepers from fully automated plants for better tolerances.</li></ul>
<table class="t"><tr><th>Where</th><th>Minimum sleeper density (per km)</th></tr>
<tr><td>Main line renewals (CTR/TSR), doubling, GC, new lines; passenger running loops</td><td><b>1660</b></td></tr>
<tr><td>Other loops &amp; sidings up to 50 km/h</td><td><b>1540</b></td></tr>
<tr><td>Sidings above 50 km/h</td><td>1660</td></tr></table>
<p class="small">Higher density needs PCE's approval. 1660/km means sleeper spacing ≈ 600 mm (1000 ÷ 1660 = 0.602 m).</p>`},
{id:"c02-fastenings", para:"210, 210A, Annex 2/4", title:"Fastenings on PSC sleepers (ERC, GRSP, liners)", body:`
<ul><li><b>ERC (Elastic Rail Clip)</b> — silico-manganese spring steel (IRS-T-31). It presses the rail foot with a designed <b>toe load</b> when deflected by a designed amount.</li>
<li><b>GRSP (Grooved Rubber Sole Plate)</b> — rubber pad (IRS-T-47) under the rail; absorbs vibration, shock and noise.</li>
<li><b>Composite GRSP</b> — two layers: harder top, softer bottom. Place the face with the <b>manufacturer's initials facing UP (towards the rail)</b>. 6.2 mm and 10 mm types.</li>
<li><b>Nylon cord reinforced GRSP</b> (6 mm) — under crossings of turnouts.</li>
<li><b>Liners</b> — on both sides of rail foot to set the correct gauge and correct ERC deflection. <b>GFN (glass filled nylon)</b> liners in track circuited areas; <b>metal</b> liners elsewhere. Combination liners allow lighter rail on heavier-rail sleepers. <b>Cut liners</b> are used with ERC-J at fish-plated / glued joints.</li>
<li><b>Modern fastenings (210A)</b> — factory-fitted systems meeting category 'C' of EN 13481-1:2012 &amp; EN 13481-2:2022 may replace ERC fastenings in a phased manner.</li></ul>
<table class="t"><tr><th>ERC type</th><th>Drawing</th><th>Toe load (kg)</th><th>Toe deflection (mm)</th><th>Bar dia (mm)</th></tr>
<tr><td>ERC-J</td><td>RT-8258</td><td>650</td><td>8.5</td><td>20.64</td></tr>
<tr><td>Mk-III</td><td>RT-3701</td><td>850–1100</td><td>13.5</td><td>20.64</td></tr>
<tr><td>Mk-V</td><td>RT-5919</td><td>1200–1500</td><td>13.5</td><td>23/20.64</td></tr>
<tr><td>Anti-theft</td><td>RT-6254</td><td>850–1100</td><td>13.5</td><td>20.64</td></tr></table>
<details><summary>Liner colour bands (Annex 2/4(B)(d))</summary>
<table class="t"><tr><th>Rail on sleeper</th><th>Drawing</th><th>Type</th><th>Colour</th></tr>
<tr><td>52 on 52</td><td>RT-3738 / RT-3702</td><td>Metal / GFN</td><td>— / Pink</td></tr>
<tr><td>60 on 60</td><td>RT-3740 / RT-3706</td><td>Metal / GFN</td><td>— / White</td></tr>
<tr><td>52 on 60</td><td>RT-3741 GS, 3742 NGS</td><td>Metal</td><td>Yellow / Green</td></tr>
<tr><td>52 on 60</td><td>RT-3707 GS, 3708 NGS</td><td>GFN</td><td>Yellow / Light green</td></tr>
<tr><td>60 on 136RE</td><td>RT-8616 GS, 8617 NGS</td><td>Metal</td><td>Blue / Brown</td></tr>
<tr><td>60 on 136RE</td><td>RT-6938 GS, 6939 NGS</td><td>GFN</td><td>Light brown / Grey</td></tr>
<tr><td>136RE on 136RE</td><td>RT-8618 / RT-6937</td><td>Metal / GFN</td><td>— / Sky blue</td></tr></table>
<p class="small">GS = gauge side, NGS = non-gauge side. Cut liners: RT-4322 (52 kg), RT-4511 (60 kg).</p></details>
<details><summary>Common PSC sleeper drawings</summary>
<table class="t"><tr><td>T-2495</td><td>52 kg, 22.9 t axle load</td></tr><tr><td>T-2496</td><td>60/52 kg, 22.9 t</td></tr><tr><td>T-8527</td><td>60 kg/136RE, 25 t (wider)</td></tr><tr><td>RT-4183-86 / RT-8621-24 / RT-5738-40</td><td>Curve sleepers with check rail (60 kg / 25 t / 52 kg)</td></tr><tr><td>RT-4088-97 / RT-8672-80</td><td>Guard rail on bridge &amp; approaches</td></tr><tr><td>RT-4148/4148A, RT-8671</td><td>Level crossing</td></tr><tr><td>RT-4149, RT-6253</td><td>SEJ (RT-6253: 300 mm gap SEJ on bridge approaches)</td></tr><tr><td>RT-4865 / RT-4218</td><td>Fan-shaped 1 in 8½ / 1 in 12 turnout sets</td></tr><tr><td>RT-6068</td><td>Derailing switch</td></tr><tr><td>RT-4852 / RT-8326</td><td>Shallow (160 mm) sleeper / with guard rail</td></tr><tr><td>RT-8695 / RT-8757</td><td>Curves sharper than 5° with check rail inside &amp; guard outside</td></tr></table></details>`},
{id:"c02-ballast", para:"211–217", title:"Ballast — specification, depth, profile", body:`
<p>Crushed stone ballast to <b>IRS-GE-1 (June 2016)</b> with amendments on all lines including P&amp;C. <b>Ballastless track</b> may be used in tunnels, viaducts, station yards and deep cuttings (211A).</p>
<table class="t"><tr><th>Situation</th><th>Min. ballast cushion below sleeper bottom at rail seat</th></tr>
<tr><td>Track renewals (CTR &amp; TSR)</td><td><b>300 mm</b> (350 mm where possible)</td></tr>
<tr><td>Doubling, gauge conversion, new lines</td><td><b>350 mm</b></td></tr>
<tr><td>Renewal/new passenger running loops</td><td>300 mm</td></tr>
<tr><td>Other loop lines</td><td>250 mm</td></tr>
<tr><td>Sidings ≤50 km/h / &gt;50 km/h</td><td>300 mm / 350 mm</td></tr>
<tr><td>Clean cushion at all times (mechanised maintenance)</td><td><b>Not less than 150 mm</b></td></tr></table>
<ul><li>Full ballast section must be ensured for <b>six rail lengths</b> on either side of bridges, LCs and tunnels.</li>
<li>Cushion is made up during CTR, TSR or programmed deep screening.</li>
<li><b>Formation width (new works, excluding side drains):</b> single line <b>7850 mm</b>, double line <b>13160 mm</b> (straight). Extra on curves for ballast shoulder widening and IRSOD clearances. <b>Minimum cess 900 mm</b> everywhere — widen formation further if cant reduces it.</li>
<li>Cross slope <b>1 in 30</b> for new works (existing 1 in 40 need not be disturbed in doubling).</li></ul>
<table class="t"><tr><th>LWR single line (PRC)</th><th>Shoulder (B)</th><th>Extra on outside of curve (C)</th><th>Ballast/m straight</th><th>curved</th></tr>
<tr><td>250 mm cushion</td><td>350 mm</td><td>500 mm</td><td>2.030 m³</td><td>2.120 m³</td></tr>
<tr><td>300 mm</td><td>350</td><td>500</td><td>2.304</td><td>2.401</td></tr>
<tr><td>350 mm</td><td>350</td><td>500</td><td>2.585</td><td>2.690</td></tr></table>
<p class="small">Non-LWR track (Annex 2/2B): 250/300/350 mm cushion need 1.769/2.022/2.282 m³ per m (1.820/2.078/2.344 on curves &lt;600 m radius). Shoulder increases to 400 mm on outside of curves sharper than 600 m (fish-plated), 400/450 mm for SWR on curves flatter/sharper than 875 m, and 550 mm outside turn-in curves in passenger yards. Double line LWR: track centres 5300 mm.</p>
<p><b>Assessing ballast (213):</b> survey one rail length per km; for deep screening, dig full depth for 2–3 sleepers every 0.5–1 km. Add about <b>8%</b> to net quantity for procurement when measured in stacks/wagons. Ballast heaps must be clear of running dimensions and not between stock and tongue rails or over signal rods. Surplus ballast is stacked in heaps, not left scattered on slopes.</p>`},
{id:"c02-formation", para:"218–222", title:"Formation — weak and bad formation", body:`
<p><b>Weak formation</b> is identified if any of these is true: speed restriction due to formation; more than normal track attention needed; ballast penetration profile is <b>'W' shaped and deeper than 30 cm</b>.</p>
<p><b>4-step action plan:</b></p>
<ol><li>Correct formation width, cess level and side drains to profile.</li>
<li>Shallow screening (deep screening if needed).</li>
<li>No loose or missing fittings.</li>
<li>Increase ballast depth to 30 cm or even 35 cm.</li></ol>
<p>If trouble persists, it is a <b>suspect formation</b> → geotechnical investigation → may be classified as <b>bad formation</b> needing rehabilitation.</p>
<p><b>Typical problems:</b> uneven bank settlement, slope failures/slips, ballast penetration and mud pumping, swelling-shrinkage of expansive (black cotton) soils, cracks on cess.</p>
<p><b>Investigation:</b> history, bank height, slopes, drainage, 5 years of track attention (gang charts/TMS), ballast penetration profiles at every hectometre/OHE mast, undisturbed samples in 100 mm tubes, disturbed samples, bore holes at top, mid-slope and toe at 1.5–3 m intervals plus one set in stable bank. Tests: grain size, Atterberg limits (LL, PL, SL), natural moisture &amp; density, OMC &amp; MDD, shear strength, differential free swell, consolidation (where settlement).</p>
<table class="t"><tr><th>Problem</th><th>Typical remedy</th></tr>
<tr><td>High cess, fouled ballast</td><td>Lower cess, screen ballast</td></tr>
<tr><td>Mud pumping, fouling by fines</td><td>Drainage, blanket, non-woven geotextile</td></tr>
<tr><td>Ballast penetration &gt;30 cm, heaving</td><td>Blanket + geotextile below it</td></tr>
<tr><td>Expansive soil</td><td>Blanket (thinner with geogrid) + geotextile</td></tr>
<tr><td>Bank settlement / heaving beyond toe</td><td>Sub-bank, prefabricated vertical drains, stone columns</td></tr>
<tr><td>Creep of soil</td><td>Flatter slopes with sandwich construction</td></tr>
<tr><td>Slips after rain, longitudinal cracks</td><td>Flatter slopes / berms per stability analysis + drainage</td></tr>
<tr><td>Water-filled ballast pockets</td><td>Sand or boulder drains</td></tr>
<tr><td>Erosion</td><td>Repair, turfing, mats</td></tr>
<tr><td>Cut slope failure</td><td>Slope protection, side &amp; catch-water drains</td></tr></table>`},
{id:"c02-ij", para:"223–225", title:"Insulated joints, glued joints and SEJ", body:`
<ul><li><b>Insulated joint</b>: separates track circuits electrically — planed fishplates with channel insulation, ferrules/bushes on bolts, and an end post between rail ends. Lay as <b>square joints</b>; if staggered, stagger must not exceed the minimum vehicle wheelbase. Gap = end post thickness.</li>
<li><b>Glued insulated joints</b>: web-fitting fishplates glued with high-polymer adhesive and HTS bolts. Preferred in all new track circuiting. <b>G3L (6 bolts) for LWR/CWR</b>; <b>G3S (4 bolts) for SWR/fish-plated</b>. Joint number, month, year and maker embossed on rail head (both faces).</li>
<li><b>SEJ (Switch Expansion Joint)</b>: at each end of LWR/CWR to absorb movement of breathing lengths. Between 52 and 60 kg use a <b>combination SEJ</b> (RT-6782, 80 mm gap).</li></ul>
<table class="t"><tr><th>SEJ drawing</th><th>Rail</th><th>Max design gap</th></tr>
<tr><td>RT-4160 / RT-4165</td><td>52 / 60 kg</td><td>80 mm</td></tr>
<tr><td>RT-6914 / RT-6902</td><td>52 / 60 kg</td><td>80 mm (single gap)</td></tr>
<tr><td>RT-6930 / RT-6922</td><td>52 / 60 kg</td><td>65 mm (double gap)</td></tr></table>`},
{id:"c02-bridges", para:"226–229", title:"Track on bridges, guard rails and tunnels", body:`
<ul><li>Plate girders have no camber; open web girders ≥30.5 m have camber — lay track to follow it.</li>
<li>Avoid rail joints on openings &lt;6.1 m; otherwise preferred joint position is <b>1/3 span</b> from either end.</li>
<li><b>SWR on un-ballasted girder bridges</b>: up to 13.3 m opening if SWR symmetrical about bridge centre, up to 6.1 m if not; no fish-plated joint on girder or within 6 m of abutments; rail-free fastenings. 26 m rails with 1 m fishplates &amp; 6 bolts may be used on any length.</li>
<li><b>SWR on ballasted deck bridges with bearings</b>: any length, isolated from LWR by <b>30 m</b> of well-anchored PSC track each side; 26/39 m rails with 1 m fishplates &amp; 6 bolts. Without bearings: SWR on any length <span class="acs">ACS-9</span>.</li>
<li>Un-ballasted decks always have rail-free fastenings. Fish-plated track on girders is isolated from SWR by 2 well-anchored rail lengths or one 26 m rail; non-LWR bridge track isolated from LWR by 30 m of anchored SWR.</li>
<li><b>Steel channel / H-beam sleepers</b>: max spacing <b>600 mm</b> c/c (except at cross girders); clear gap between joint sleepers ≤200 mm; fabricated to <b>BS-45</b>, location-specific; insulated zero-toe-load fastenings on H-beam for LWR in track circuits; laying supervised by at least JE/P.Way; pull back creep first.</li></ul>
<p><b>Guard rails (228):</b> on all girder bridges, all major/important ballasted bridges, and minor bridges where derailment would be serious; on ROB/FOB tracks adjacent to a column within 8 m of track centre. Dispensable on inner rail of sharp-curve ballasted bridges ≤30 km/h with check-rail PSC sleepers.</p>
<table class="t"><tr><th>Guard rail dimension</th><th>Value</th></tr><tr><td>Clearance to running rail "a"</td><td>250 ± 50 mm</td></tr><tr><td>Length beyond ballast wall L1</td><td>1825 mm</td></tr><tr><td>Bent length to meet at centre L2</td><td>4875 mm</td></tr><tr><td>Guard rail top lower than running rail by</td><td>Not more than 25 mm</td></tr></table>
<table class="t"><tr><th>Tunnels — guard rail/derailment guard</th><th>Single track: approach</th><th>Double track: approach</th></tr>
<tr><td>&gt;110 km/h</td><td>200 m outside to 25 m inside</td><td>200 m outside</td></tr>
<tr><td>60–110 km/h</td><td>100 m outside to 25 m inside</td><td>100 m outside</td></tr>
<tr><td>≤60 km/h</td><td>None</td><td>25 m outside</td></tr></table>
<p class="small">Inside single-track tunnels: throughout ballastless track; on ballasted track for curves of radius ≤500 m incl. transitions and critical locations. Inside double-track tunnels: throughout (except check-railed locations). Guard rails for ballasted track; derailment guards for ballastless. Side pathways on all new girder bridges; chequered-plate walkways between guard rails (229).</p>`}
],
