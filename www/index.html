CH.push({
id:"c06", n:6, title:"Maintenance of Permanent Way", short:"Tamping, rails, joints, fastenings, yards, OHE areas",
why:`Track deteriorates every day under traffic, weather and time. This chapter is the day-to-day "how to look after track" guide: the annual maintenance calendar, the three-tier mechanised maintenance system, tamping, picking slacks, rail defects and fractures, joints, fastenings, bridges approaches, yards, deep screening, lifting/lowering, drainage, boards and records — plus the special safety rules for working in track-circuited and electrified areas.`,
sections:[
{id:"c06-calendar", para:"601–603", title:"Annual maintenance calendar & planning", body:`
<p>Track is to be maintained by the <b>mechanised system</b> (Para 604); only small jobs like picking slacks remain manual until full mechanisation. CTE issues the annual deployment programme for track renewal, rail grinding, deep screening and shoulder screening machines; Sr.DEN/Co plans other machines and reviews them against TRC results. Field engineers make two half-yearly programmes (<b>April–September</b> and <b>October–March</b>) <span class="acs">ACS-4</span>.</p>
<table class="t"><tr><th>Season</th><th>Work</th></tr>
<tr><td><b>Post-monsoon</b></td><td>Immediately: attend run-down lengths and CBML/UML spots from OMS/TRC/footplate across the whole beat. Then: picking slacks 1–2 days/week; remaining days systematic planned/condition-based maintenance end to end — through gauging, sleeper spacing/squaring, casual renewals, bridge/LC/P&amp;C/SEJ/glued joint attention, joint lubrication, weld collar painting, de-stressing, cold weather patrol.</td></tr>
<tr><td><b>Pre-monsoon</b></td><td>2–3 days/week: side &amp; catch-water drains, cess repairs, waterways, slacks. Rest: planned maintenance, shallow screening, de-stressing, hot weather patrol.</td></tr>
<tr><td><b>Monsoon</b></td><td>Slacks, condition-based attention, drains and waterways; extra gang patrolling in abnormally heavy rain.</td></tr></table>
<p><b>Rolling block programme</b> (GR 15.02(c), 2023 amendment) is used for planned maintenance and works. Each SSE (In-charge) prepares a perspective plan from TRC results and TMS exception reports, and monthly/weekly plans covering plain track, yards &amp; P&amp;C, curves, LCs, creep, deep screening, casual renewals, over-aged P&amp;C/SEJs/glued joints/welds, welding and de-stressing.</p>`},
{id:"c06-3tier", para:"604, 604A", title:"Three-tier mechanised maintenance system", body:`
<div class="cards3">
<div class="card"><b>Tier 1 — On-track Machines Unit (OMU)</b><br>Tampers (plain &amp; P&amp;C), shoulder cleaners, BCMs, ballast regulators, DTS, UTV. Systematic and intermediate tamping, shoulder cleaning, profiling, stabilisation, deep screening, material transport.</div>
<div class="card"><b>Tier 2 — Mobile Maintenance Gang (MMG)</b><br>One per SSE (In-charge), ~70–80 km single / 30–50 km double line, led by JE/SSE (MMG) on a Rail Borne Maintenance Vehicle. Fracture repairs incl. AT welding, SEJs, P&amp;C components, glued joints, rail cutting/drilling/chamfering, spot renewals and spot tamping. Equipment list: Annex 6/1.</div>
<div class="card"><b>Tier 3 — Sectional gangs</b><br>Manual through packing where machines can't go, overhauling, patrolling (keyman, hot/cold, monsoon), watching vulnerable spots, LC/bridge/turnout/SEJ attention, ERC greasing, joint lubrication, pad changes, cess &amp; drains, loops, creep/gap adjustment, pre- &amp; post-tamping work, toe load measurement, weld painting, tree trimming.</div></div>
<p><b>Modified Three-Tier System (604A)</b> — PCE may adopt on lines with &lt;10 GMT (case-to-case above). Each DEN gets a dedicated UTV; MMG gets a truck and pickup van and contract manpower; SSE (In-charge) inspects on foot <b>once in 6 months</b> with an SSE/JE (Spl) for special works <span class="acs">ACS-2</span>.</p>
<table class="t"><tr><th>Modified system unit</th><th>Jurisdiction (single / double line)</th><th>Foot inspection</th></tr>
<tr><td>Sectional SSE/JE</td><td>35–40 km / 17–20 km</td><td>Once in 3 months</td></tr>
<tr><td>Assistant SSE/JE (2–3 keyman beats)</td><td>17–20 km / 8–10 km</td><td>Once a fortnight</td></tr>
<tr><td>Keyman</td><td>6–8 km / 3–4 km</td><td>Daily</td></tr></table>
<p class="small">Sectional gang = Track Maintenance &amp; Monitoring Gang (TMMG) with multi-utility road vehicle + patrolmen, watchmen, boulder gangs, gatemen; supplemented by Zonal and Special P.Way contracts. Tables 1B/1C foot inspection schedules don't apply here.</p>`},
{id:"c06-tamping", para:"605", title:"Systematic tamping — before, during, after", body:`
<p>Planned on long continuous lengths based on TRC/OMS, history, GMT, formation and condition.</p>
<p><b>Pre-requisites:</b> at least <b>150 mm clean cushion</b>; enough ballast in shoulders and cribs; machine time in the working timetable (Operating Department shares responsibility).</p>
<p><b>Pre-tamping attention:</b> ballast where short, heap ballast in tamping zone, make up low cess, clean pumping joints, fix hogged joints, tighten all fittings, renew broken sleepers, square &amp; space sleepers, re-gauge, adjust creep/gaps, examine rails, survey bad curves, clear ballast off sleeper tops, remove/mark obstructions (signal rods, cables, LC check rails, joggled plates), mark transitions and slew/cant/lift values on every 2nd/3rd sleeper.</p>
<table class="t"><tr><th>Tamping setting</th><th>Value</th></tr>
<tr><td>Tamping depth (top of tine blade to bottom of sleeper, closed)</td><td><b>15–20 mm</b></td></tr>
<tr><td>Squeeze pressure — plain track / P&amp;C</td><td><b>110–120 / 125–135 kg/cm²</b></td></tr>
<tr><td>Squeeze time</td><td>0.8 – 1.2 s</td></tr>
<tr><td>Insertions</td><td>One; two if lift &gt;30 mm</td></tr>
<tr><td>Run-off ramp at day end</td><td><b>1 in 1000</b></td></tr></table>
<p><b>Post-tamping:</b> check cross level &amp; alignment, re-tighten fittings, replace broken items, dress and consolidate ballast.</p>`},
{id:"c06-slacks", para:"606–609A", title:"Picking slacks, through packing, overhauling", body:`
<p><b>Slacks</b> appear on yielding formation, high banks, cuttings, bridge/LC approaches, SEJs, P&amp;C, glued joints, bad curves, axle counters — wherever ballast or drainage is poor. Attend UML spots first, then CBML. Use <b>multi-purpose tampers (MPT)</b> and off-track tampers as regular practice; <b>each ADEN to have one MPT</b> progressively <span class="acs">ACS-2/3/4</span>. Crowbar/beater only as interim.</p>
<table class="t"><tr><th>Defect</th><th>Chalk mark</th><th>Where</th></tr>
<tr><td>Cross level</td><td>C-2</td><td>On sleeper inside gauge face</td></tr>
<tr><td>Loose packing</td><td>H or P</td><td>On sleeper outside gauge face</td></tr>
<tr><td>Gauge</td><td>G±</td><td>On sleeper inside gauge face</td></tr>
<tr><td>Unevenness</td><td>→ ←</td><td>Rail web, gauge side</td></tr>
<tr><td>Alignment</td><td>↓ →</td><td>Rail foot inside gauge</td></tr></table>
<p>Low joint: loosen fishplates, tap, pack, re-tighten; pack at least 3 sleepers each side. Long CBML lengths → on-track machine.</p>
<p><b>Manual through packing (607, Annex 6/9)</b> — normally not on concrete sleepers; 8 operations: (1) open the road — from sleeper end to 450 mm inside rail seat, 50 mm below packing level, without disturbing cores; (2) examine rails, sleepers, fastenings; (3) square sleepers (never hammer); (4) slew to alignment — Mate sights from 30–60 m (outer rail on curves), crowbars ≤30° from vertical or use jacks/TRALIS; (5) gauge — only after squaring, gauge at tightest position, don't force it; (6) pack — 4 men per sleeper back-to-back, avoid centre-binding, test with Canne-a-boule; (7) repack joint sleepers; (8) box and tidy with template and 6 mm hemp cords. Cross level checked at every joint and every 4th sleeper.</p>
<p><b>Observing sleepers under trains (608):</b> Mate and men on the cess one rail length apart; mark and pack loose sleepers immediately.</p>
<p><b>Systematic overhauling (609):</b> cycle of <b>3–5 years</b>, using SBCM for shoulders; crib ballast moved out for screening and back. Loop lines shallow screened <b>once in 7 years</b>. Manual: open crib 75–100 mm below sleeper bottom, never two adjacent cribs together, alternate rail-length panels; complete by end of March.</p>
<p><b>Pathways (609A):</b> pathways (platform connections, elephant crossings) opened and overhauled with each packing cycle, never later than <b>2 years</b>; galvanised fittings in contact, or wire-brushed and coal-tar painted <span class="acs">ACS-10</span>.</p>`},
{id:"c06-rails", para:"610–613", title:"Rails — handling, inspection, deterioration, corrosion, grinding", body:`
<ul><li>Load/unload on ramps of unserviceable rails or by crane; slings/tongs; rails rest evenly on foot. <b>Mark rails only with paint</b> — no chisel or punch marks. <b>Gas cutting and gas-cut holes are prohibited.</b></li>
<li>Stacks on level, drained ground; free rails supported at ≥4 points; welded panels on supports every <b>4 m</b>; one section and class per stack (RDSO CT-35).</li>
<li>Visual exam of rail ends with wire brush, magnifier and mirror during lubrication; on important girder bridges and approaches <b>twice a year</b>.</li>
<li><b>No rail untested by USFD may be laid</b> — not even temporarily (e.g. PQRS service rails). USFD by RDSO-trained JE/SSE.</li></ul>
<p><b>Causes of deterioration:</b> corrosion (acid gases in moisture — platform lines, saline sidings, hydrants, tunnels, coast, industrial belts); top-table wear; flattening of the inner rail of curves (overloading/under-equilibrium speed); gauge-face wear of outer rail; hogging (measured with 1 m straight edge centred on joint); end batter (height difference between end and 30 cm away); wheel burns; corrugation ("roaring rails"); head checks, spalling, shelling, squats.</p>
<p><b>Corrosion control (613(2)) <span class="acs">ACS-16</span>:</b></p>
<ul><li>PCE declares <b>corrosion-prone</b> areas (1–3 mm in 3 years at liner seat) and <b>severe corrosion-prone</b> (&gt;1 mm/year); CAO(C) for new lines.</li>
<li>In such areas measure vertical &amp; lateral corrosion yearly on every 100th sleeper (Annex 6/5, TMS).</li>
<li>Use zinc-flake-coated ERCs and galvanised liners; <b>R260NC corrosion-resistant rails</b> in severe areas.</li>
<li>Grease liner seats with graphite grease IS-408 Gr.0 and seal around liners <b>once a year</b> both faces <span class="acs">ACS-3</span>.</li>
<li>Shift liner bite locations (when corrosion &lt;1.5 mm) during de-stressing / pulling back. Keep flange/web free of muck; avoid train watering on run-through lines.</li></ul>
<p><b>Side wear:</b> lubricators per Para 424 or hand lubrication (never on rail top); spot-renew worn rails with matching serviceable rails, not new. <b>Rail grinding</b> removes burns, corrugation and flaws. RGM priority: (1) all 25 t routes; (2) CC+8 routes &gt;10 GMT; (3) CC+6 routes &gt;10 GMT.</p>`},
{id:"c06-closures", para:"614–616", title:"Rail closures, USFD defects, casual renewal", body:`
<ul><li><b>Permanent closure</b> on running lines: min <b>11 m</b> (5.5 m on sections up to 100 km/h). <b>Temporary closure</b>: min <b>4 m</b> with <b>30 km/h</b>.</li>
<li>In tunnels, major/important bridges, deep cuttings, high banks, junctions of different rails/sleepers, P&amp;C — and 500 m approaches of these — permanent closure must be ≥11 m; shorter existing closures to be welded on at least one side, with 30 km/h till done.</li>
<li>Closures separated by ≥ <b>39 m</b> on the same rail and ≥ <b>11 m</b> on opposite rails.</li>
<li>USFD-defective rails/welds: act per Paras 6.4 &amp; 8.14 of the USFD Manual (joggled plates / removal).</li>
<li>Casual renewal in block with serviceable rail, observing SWR/LWR precautions. Sr.DEN/DEN prescribes location-wise <b>Imprest of tested rails</b> (13, 9, 6 m etc.).</li></ul>`},
{id:"c06-failures", para:"617–618", title:"Rail failures and fractures", body:`
<p>Every rail failure (running lines, P&amp;C, any age) is entered in TMS (Annex 6/6). A failure report goes JE/SSE → ADEN → DEN → CTE &amp; ED(M&amp;C)/RDSO, with sketches/photos and the <b>failure code</b> (item 5.3, RDSO monograph). No report needed for non-running lines, obsolete rails, or accidental damage (wheel burns, buckling, derailment, corrosion, batter, elongated holes).</p>
<p><b>Send 1 m sample (500+500 mm) to C&amp;M / RDSO when:</b></p>
<ol><li>Failure within first <b>25% of service life</b> (max 10 years from rolling), any type;</li>
<li>Rail removed after visual/USFD detection and the defect is in the listed codes (100/200 transverse breakage, 1212/2212, 1321-1323/2321-2323 web horizontal cracks, 238, 253 half-moon, 1511/2511, 1512/2512 foot breaks, 111-113/211-213 internal head flaws, 133/233, 139/239, 153/253);</li>
<li>Rail/weld failure is prima facie cause of an accident (to RDSO);</li>
<li>Repetitive failures of the same rolling mark;</li>
<li>Imported rails within guarantee (CTE lodges provisional claim).</li></ol>
<p class="small">Protect fractured faces with mineral jelly and hessian.</p>
<div class="warn"><b>On noticing a fracture (618):</b> protect the track first, inform JE/SSE and SM. Gap &lt;30 mm → fishplates and clamps. Gap &gt;30 mm → closure with fishplates and clamps. Piece missing or multiple fractures → change the rail before traffic. Weld failure → joggled fishplates and clamps. Gang Mate/Keyman may then pass trains at Annex 3/8 speeds; a trackman-patrolman may pass only the first train he stopped, if confident.</div>`},
{id:"c06-joints", para:"619–622", title:"Rail joints, fishplates and insulated/glued joints", body:`
<p><b>Lubrication of rail joints (619):</b> reduces wear on fishing planes (prevents low joints) and allows expansion.</p>
<ul><li>Grease to RDSO Generic Specification (March 2026) <span class="acs">ACS-12</span>.</li>
<li><b>Once a year, October to February</b>, not in extremes of weather (non-running lines: 2 years with CE approval). Adjust creep &gt;150 mm first.</li>
<li>Under at least JE/P.Way, with caution order and engineering signals or block. Remove plates, wire-brush, inspect for cracks (magnifier/mirror), lubricate, refit bolts in reverse position, tighten <b>inner two bolts first</b>, don't over-tighten.</li>
<li>SSE (In-charge) certifies lubrication to ADEN in <b>April</b>. <b>Insulated joint fishplates are never greased.</b></li></ul>
<p><b>Joint maintenance (620):</b> never hammer fishplates (tap with a wooden piece); use torque wrenches or standard spanners, central bolts first. Defects &amp; cures: slack sleepers, loose plates, worn fishing planes (tapered shims / replace), batter (end cropping), hogging (cropping, repressed plates, de-hogging machine), broken plates, cracked rail ends (chamfer holes, USFD), pumping joints (replace ballast after monsoon; cross drains between 1st and 2nd shoulder sleepers). Convert fish-plated track to 3-rail panels where SWR conditions exist. <b>Chamfer every drilled hole</b> (incl. S&amp;T/electrical bond holes) — new rails before laying, FB panels at plant, cropped ends at site.</p>
<p><b>Insulated joints (622):</b> fish-plated type — insulation by S&amp;T, joint inspection with JE/SSE Signal once a year. <b>G3L glued joints on all run-through lines</b>; insulation resistance tested dry &amp; wet before laying and in service. Keep square, gap = end post thickness, remove burrs, bolts tight, clean ballast, no brake dust. Failed glued joints refurbished per RDSO specification.</p>`},
{id:"c06-sleepers", para:"623–629", title:"Sleepers, turnout sleepers, fastenings and ERC toe load", body:`
<ul><li>PSC sleepers square on straight, radial on curves; joints suspended; relay mechanically. Manual laying only exceptionally: unload sleeper by sleeper down hooked ramps into tyres/gunny bags; 20 km/h and alternate fastenings removed before block; no more sleepers replaced than can get one on-track tamping before the first train.</li>
<li><b>Fan-shaped turnout sleepers (624):</b> 30 cm clean cushion, perfectly level bed, deep screening of turnout + 30 m each side; <b>red/blue round mark always on the right-hand side</b>; switch sleepers square to straight, lead sleepers at half the angle, crossing sleepers square to the bisector; approach and exit sleepers for 1 in 20 rail slope transition; insert by T-28 machine as one unit or three panels.</li></ul>
<table class="t"><tr><th>Turnout</th><th>Switch sleepers</th><th>Lead</th><th>Crossing</th></tr>
<tr><td>1 in 8½</td><td>1–13</td><td>14–41</td><td>42–54</td></tr>
<tr><td>1 in 12</td><td>1–20</td><td>21–64</td><td>65–83</td></tr>
<tr><td>1 in 16</td><td>1–20</td><td>21–75</td><td>76–101</td></tr></table>
<ul><li>Sleeper ends painted with anti-corrosive paint at plant.</li>
<li><b>ERC</b>: leg flush with end face of insert (Keyman checks daily); use applicator/extractor; over/under-driving displaces liners and changes toe load. Replace pads with permanent set; CGRSP initials touching rail bottom; replace corroded/dented metal liners and cracked GFN liners (small indentation is OK).</li></ul>
<div class="formula">Toe load test: 1% of ERCs on every 100 sleepers (all 4 on one sleeper)</div>
<table class="t"><tr><th>ERC toe load rule (628)</th><th>Value</th></tr>
<tr><td>Testing frequency</td><td>After <b>4 years or 200 GMT</b>, whichever earlier (corrosion-prone: first test at 2 years / 100 GMT)</td></tr>
<tr><td>If ≥20% of sample &lt; <b>600 kg</b></td><td>Double frequency and sample size</td></tr>
<tr><td>If ≥20% of sample &lt; <b>400 kg</b> (confirmed on 5% sample)</td><td>Initiate <b>through fastening renewal</b></td></tr></table>
<p><b>ERC/MCI insert greasing:</b> graphite grease IS-408 Gr.0 on central leg and insert eye; one sleeper at a time (≥15 intact between); swap inside/outside ERCs; at laying and then <b>yearly</b> in corrosion-prone areas &amp; platform lines, <b>every 2 years</b> elsewhere. Not in extreme summer or heavy rain. Large-scale fastening renewal under JE/SSE; ADEN investigates the cause.</p>
<p><b>Steel sleepers on bridges (629):</b> tighten all fittings incl. hook bolts every 15 days for the first month, monthly for next 6 months, then on need; guard rail fittings quarterly for 6 months; spare stock and emergency reserve; repair damaged galvanising.</p>`},
{id:"c06-bridges", para:"630–631", title:"Track on bridge approaches and on bridges", body:`
<ul><li>Guard-rail sleepers on approaches; full fittings for <b>100 m</b>; rail level per designed L-section, no dip after abutments; <b>no rail joint within 3 m of an abutment</b>; LWR full ballast section up to 100 m; SEJs as per Ch 3; joggled plates on good AT welds on bridges with ≥100 m waterway and 100 m approaches.</li>
<li>Important/major bridges: 90 cm clear cess for ~100 m; ballast retaining arrangement.</li>
<li>On bridge: track central on girders, line and level, clearances at ballast walls, sleeper spacing (≤600 mm), squareness, <b>hook bolts</b> (galvanised, arrows at right angles pointing towards rail), creep and gaps, free SEJ movement, guard rail distance, pathways.</li></ul>`},
{id:"c06-yards", para:"632–635A", title:"Yards, sand humps, sample track, checking gangs, ghat sections", body:`
<ul><li><b>Yard lines</b> aren't covered by TRC/OMS: measure manually or mechanically (Annex 6/10) — passenger loops &amp; crossovers <b>every 3 months</b>, other lines <b>every 6 months</b>; registers countersigned by ADEN and SSE <span class="acs">ACS-3</span>. Passenger loops preferably machine-maintained.</li>
<li><b>Sand humps / dead ends</b> give the signal overlap; laid to RDSO drawing; an obstructed sand hump no longer counts for taking 'off' signals.</li>
<li><b>Sample track</b>: 3 rail lengths at the start of each gang length maintained to full standard as the model.</li>
<li><b>Checking gangs (635):</b> JE/SSE checks alignment, surfacing, boxing, rails, sleepers, fastenings, gauge, cross level, squareness, packing, joints, ballast profile, cess; initials muster; checks tools monthly and spirit level/gauge/straight edge accuracy monthly.</li></ul>
<p><b>Minimum gang equipment:</b> level-cum-gauge, 2 sets red/green flags (2 lamps at night), <b>10 detonators</b>, 30 cm steel scale, 1 m straight edge, square, hemp cord, keying hammer, chalk, rail thermometer, shovels, powrahs, beaters, crowbars, ballast forks, mortar pans, wooden mallet/Canne-a-boule, feeler gauge, 2 whistle thunderers, 2 sets jumper &amp; gloves (electrified section).</p>
<p>Every man is examined periodically and on appointment/promotion/transfer on: line protection, detonators, hand signals, parted train, "Safety First", patrolling in rain/storm/LWR heat — instruction must be <b>demonstrative</b>.</p>
<p><b>Ghat sections &amp; sharp curve/steep gradient sections (635A)</b> <span class="acs">ACS-15</span> — CTE may declare "challenging sections":</p>
<table class="t"><tr><th>Problem</th><th>Measures</th></tr>
<tr><td>Excessive rail wear</td><td>Automatic gauge-face lubricators; till then hand lubrication: curves ≤3° every 15 days, 3–5° every 7 days, &gt;5° every 3 days. Wear on curves ≤600 m measured quarterly (PCE may tighten wear limits). Slack-gauge sleepers above 5°. Same speed for passenger &amp; goods where feasible. CTE to consider check rails on curves milder than 8° (clearance checked monthly). R350HT rails at TRR.</td></tr>
<tr><td>SEJ jamming near girder bridges (creep)</td><td>"Zero missing fittings" — recoup same/next day; ERC Mk-V with ≥600 kg toe load; creep measured every km monthly; pocket-type pads; deep screen where cushion poor; good cess; creep anchors; pull back creep.</td></tr>
<tr><td>Liners displacing</td><td>Extra rib-depth metal liners; extra rib-depth HVN liners in track circuits.</td></tr>
<tr><td>Pads displacing/crushing</td><td>Pocket-type 10 mm CGRSP; monitor and renew.</td></tr></table>`},
{id:"c06-ds", para:"636–637", title:"Deep screening of ballast", body:`
<p>Deep screening = screening the full ballast depth down to formation/sub-ballast, restoring drainage and elasticity. Provide standard ballast section, restore side drains, treat bad formation alongside, work continuously end to end.</p>
<table class="t"><tr><th>When to deep screen (636(2)) <span class="acs">ACS-1</span></th><th>Trigger</th></tr>
<tr><td>Always</td><td>Before CTR, before TSR, where caked ballast causes bad riding, before converting to LWR (unless recently screened)</td></tr>
<tr><td>Main lines &amp; their turnouts</td><td>Propose in Works Programme when clean cushion &lt;<b>200 mm</b>; complete before it falls below <b>150 mm</b></td></tr>
<tr><td>Passenger loops; goods loops affecting main line; their turnouts</td><td>Propose at &lt;200 mm; carry out at around 150 mm</td></tr>
<tr><td>All other loops &amp; turnouts</td><td>Carry out when clean cushion &lt;<b>100 mm</b></td></tr></table>
<p><b>Manual method (not for LWR):</b> L-section every 30 m and at obligatory points; yard cross-sections every 50 m; DEN fixes final levels; pegs every 30 m; slew curves and renew sleepers in advance; supervised by ≥JE/P.Way; on double line work against traffic. Sleeper-by-sleeper sequence with wooden blocks supporting rails; ≥4 fully supported sleepers between the sleeper being worked and the next; lift ≤50 mm at a time; 20 km/h.</p>
<table class="t"><tr><th>Speed schedule</th><th>Manual packing (Table I)</th><th>Machine packing (Table II)</th><th>BCM + TTM + DTS (Table III)</th></tr>
<tr><td>Day 1</td><td>20 (screen + initial pack)</td><td>20</td><td>40 (BCM, initial pack, DTS)</td></tr>
<tr><td>Days 2–3</td><td>20 (1st, 2nd through packing)</td><td>20 (1st machine) → 45</td><td>40 (1st tamping + DTS; ballasting)</td></tr>
<tr><td>Days 4–9</td><td>45 (slacks; 3rd packing day 10)</td><td>45 (2nd machine day 6) → 75 (days 7–9; 3rd machine day 9)</td><td>40 (day 4–5, 2nd tamping) → 75 (days 6–7, design survey)</td></tr>
<tr><td>Later</td><td>75 (days 11–19) → normal on <b>day 21</b></td><td>Normal on <b>day 10</b></td><td>Day 8: 3rd tamping (design mode) + 2 DTS (controlled) → 110; day 10 → 130; day 12 → 160</td></tr></table>
<p class="small">BCM precautions: all LWR rules; remove cutter bar, fill, tamp and stabilise at day end; no ramp at LC, girder bridge or transition (keep 2 rail lengths away); if TTM/DTS fails, stop and attend manually; recoup shoulders if no BRM; full ballast before 3rd tamping; watchmen on stretches overdue for rail renewal.</p>`},
{id:"c06-liftlower", para:"638–639", title:"Lifting and lowering track", body:`
<table class="t"><tr><th></th><th>Lifting</th><th>Lowering</th></tr>
<tr><td>Max per operation</td><td><b>50 mm</b></td><td><b>75 mm</b></td></tr>
<tr><td>Easement for trains</td><td colspan=2>Not steeper than <b>25 mm in one 13 m rail</b></td></tr>
<tr><td>Direction (single line)</td><td>From downhill end, up the rising grade</td><td>In the direction of falling grade</td></tr>
<tr><td>Direction (double line)</td><td>Opposite to traffic</td><td>—</td></tr>
<tr><td>Markers</td><td>Level pegs</td><td>Trenches across track every 30 m</td></tr></table>
<p>Both under speed restriction, engineering signals and JE/P.Way supervision. Check clearances under bridges, structures, tunnels and OHE. On curves set the inner rail to grade and raise the outer for cant. Lowering only when unavoidable. LWR rules apply.</p>`},
{id:"c06-misc", para:"640–652", title:"Drains, boards, posts, land, refuges, clearances, fouling marks, derailments", body:`
<ul><li><b>Drains (640–641):</b> side drain bottom ≥ <b>30 cm below formation</b>; openings under LCs; catch-water drains well away from cutting top in black cotton soil with a bund; clean weep holes; clear drains and waterways <b>before monsoon</b>; liaise with municipalities; yard drainage plan by SSE/Works.</li>
<li><b>Section limit boards (642):</b> division, sub-division, section and gang limits; complete bridge/LC/curve/P&amp;C with ≥50 m approach in one gang beat; ≥100 m beyond an SEJ in the same beat; complete turnout/crossover/turn-in curve/trap in one gang <span class="acs">ACS-12</span>. Black letters on white, same side of line throughout a division.</li>
<li>Km and gradient posts (RCC, black on white, square to track); OHE mast/hectometre numbers at 45° alternately facing up/down, repeated at cess level in cuttings/tunnels (electrical department paints on OHE masts).</li>
<li><b>Land boundaries (645):</b> SSE (In-charge) maintains them between stations; reports encroachments to ADEN; annual certificate to ADEN (copy DEN).</li>
<li><b>Trolley refuges (646):</b> max <b>1 km</b> apart; cuttings 200 m straight / 100 m curve; high banks 200 m; staggered on double line; bridges with spans &lt;100 m — every 100 m, ≥100 m spans — over each pier; tunnels ≤100 m with luminous "R" posts.</li>
<li><b>Standard dimensions (647):</b> watch for platform slacks, alignment errors near structures, over-lifting under bridges/OHE. SSE verifies yearly and reports infringements to ADEN by <b>end of March</b>; permanent infringements need sanction through CRS.</li>
<li>Trees obstructing view of signals, LCs or inside of curves are cut (Railways Act Sec 14 for private land). <b>Distance pieces</b> every ~30 m on platform lines.</li>
<li><b>Fouling marks (650):</b> where track centre reduces to <b>4.265 m</b> (existing works with normal centres 4.265–4.725 m) or <b>4.725 m</b> (normal ≥4.725 m); glued joint <b>3.35 m inside FM</b> between berthing lines; FM chainage, CSR and CSL on ESP; CSL and wagon capacity written on FM; block ~1500×250×125 mm, white, level with ballast top.</li>
<li><b>P.Way store (651)</b> in TMS store module; new / second-hand / scrap stacked and boarded separately; minimum imprest set by CTE.</li>
<li><b>Derailment damage (652):</b> extensive — remove and relay with available material, restore at restricted speed (LWR: isolate with buffer rails/SEJs first, re-convert later). Not extensive — SR, replace sleepers, weld, consolidate; LWR: de-stress affected portion + <b>100 m each side</b> before normal speed.</li></ul>`},
{id:"c06-records", para:"653–661", title:"Record keeping", body:`
<ul><li>Almost all records are in <b>TMS</b>, entered by JE/SSE and scrutinised by ADEN.</li>
<li><b>Gang chart</b> (fortnightly work, Annex 6/2) and <b>gang diary</b> (fortnightly programme; JE/SSE assessment at fortnight end). Charts kept 6 months overlapping, retained ≥5 years. ADEN/DEN check during inspections. Artisans keep work diaries.</li>
<li><b>Half-yearly P.Way report</b> (31 March &amp; 30 September, Annex 6/3) from SSE to DEN through ADEN — candid defects, causes, proposals. It does not absolve the SSE of keeping track fit.</li>
<li><b>Section register</b>: administration, formation trouble spots, track structure, LWR/SWR km, buckles, temperatures, regrading, curves, deep screening, renewals, yards, trials, rainfall, bridge repairs, flood damage, RAW list, vulnerable locations, encroachments, infringements, accidents — scrutinised by ADEN every year.</li>
<li><b>Plans (657):</b> L-sections at 1:5000 H / 1:500 V and index plans 1:50,000 / 1:1000; L-section re-surveyed <b>at least once in 5 years</b>; track diagrams to nearest metre; yard diagrams; land plans.</li>
<li><b>Musters (658):</b> no overwriting; separate musters per category; blank sheets initialled by ADEN; ADEN checks musters at least once in 2 months.</li>
<li><b>Gang strength (659)</b> by <b>MCNTM-2010</b> formula, recalculated yearly; extra posts sanctioned before new track opens; no deviation without CTE approval.</li>
<li><b>Materials under trial (661):</b> limited trials of simple items by CTE with a full scheme in TMS (inform CRS and RDSO); indication plates at both ends with item, number, date and km.</li></ul>`},
{id:"c06-tc", para:"662", title:"Working in track-circuited areas", body:`
<ul><li>No signal fixture interfering with track maintenance without RDSO/Board approval; S&amp;T provides staff to open rods/gears for machines (not needed with In-sleeper Point Machines).</li>
<li>Never place any tool or metal across both rails. Gauges, levels and trolleys must be <b>insulated</b>. No steel tapes. Pipes under track well below rails.</li>
<li>Pull back rails only in presence of S&amp;T where signalling connections exist.</li>
<li>Ballast resistance not less than <b>2 Ω/km in yards and 4 Ω/km in block sections</b>; insulated liners at least <b>97%</b> present on PSC track.</li>
<li>Holes for S&amp;T fixtures at the rail's <b>neutral axis</b> and chamfered. On curves keep the inner rail as the positive rail.</li></ul>`},
{id:"c06-ohe", para:"663–671", title:"Working in electrified (OHE) areas", body:`
<div class="warn">Treat all electrical equipment and lines as <b>live at all times</b>. No work within <b>2 m</b> of live OHE without a written <b>permit-to-work</b>.</div>
<ul><li>Report OHE defects to the Traction Power Controller; protect the line per GR 3.62 if trains/pantographs are endangered.</li>
<li><b>Traction bonds</b> (longitudinal rail bonds at joints in DC areas, cross bonds, structure bonds) are maintained by Electrical; bonds removed by Engineering staff must be replaced by them and reported to AEE/TRD.</li>
<li>Return current can create dangerous voltage between rail and earth, across a fractured rail, across an insulated joint. <b>Before removing fishplates or rails, or at a fracture, connect a temporary metallic jumper first</b>; never touch the two parts with bare hands — use approved gloves (665).</li>
<li>Trees: no part within <b>4 m</b> of a live conductor. Wholesale cutting by Engineering in presence of TRD; day-to-day trimming by TRD (cost to TRD revenue).</li>
<li>Never touch fallen wires until switched off and earthed; at LCs the gateman stops road traffic.</li>
<li>No tapes/tools on station roofs or gantries that could blow onto OHE. Excavation: inform TRD (DC) / Electrical &amp; S&amp;T (AC); stop if cable tiles/bricks are found.</li>
<li>Don't slew or lift beyond agreed limits without contact wire adjustment — cant changes magnify horizontal displacement.</li>
<li>Cranes only with permit-to-work and OHE staff present. Tunnel roof inspection with OHE dead (or insulated tools).</li>
<li>Prefer closed wagons; open/hopper wagon loading supervised by ≥JE/P.Way keeping everyone outside the 2 m danger zone. <b>Linen tapes only</b>; no metallic tapes or staffs.</li>
<li><b>AC areas:</b> unloaded rails must not touch to form a continuous metal mass longer than <b>300 m</b>; keep clear of rails when an electric train is within <b>250 m</b>; induced voltages in fences etc. are bonded and earthed.</li>
<li>Fire near electrical equipment: don't fight it — report to the nearest SM. Sanded catch sidings kept clear of sand for 21.5 m beyond section insulators.</li>
<li><b>Electric shock:</b> artificial respiration, continued until a doctor takes over. Keep names/addresses of owners of outside power lines crossing railway land.</li></ul>`}
],

CH.push({
id:"c07", n:7, title:"Permanent Way Renewals", short:"When & how to renew track",
why:`Every track component wears out. This chapter tells you <b>when</b> a rail, sleeper, turnout or fitting is due for renewal (by fractures, wear, GMT carried or condition), <b>how</b> renewal works are planned, justified and sanctioned, how they are executed (mechanised or manual) with the speed restriction schedule, and how released material is classified, marked and accounted for.`,
sections:[
{id:"c07-types", para:"701", title:"Types of renewal", body:`
<p><b>Primary</b> renewal = only new material. <b>Secondary</b> = released serviceable material.</p>
<table class="t"><tr><th>Abbreviation</th><th>Meaning</th></tr>
<tr><td>CTR (P/S)</td><td>Complete Track Renewal — rails, sleepers, fastenings together</td></tr>
<tr><td>TRR (P/S)</td><td>Through Rail Renewal</td></tr>
<tr><td>TSR (P/S)</td><td>Through Sleeper Renewal</td></tr>
<tr><td>TTR</td><td>Through Turnout Renewal</td></tr>
<tr><td>TFR / TFR(R)</td><td>Through Fitting Renewal / TFR without ERC replacement (only liners and GRSP/CGRSP)</td></tr>
<tr><td>TWR</td><td>Through Weld Renewal</td></tr>
<tr><td>TBSR</td><td>Through Bridge Sleeper Renewal</td></tr>
<tr><td>TBR</td><td>Through Ballast Renewal</td></tr>
<tr><td>Scattered renewal</td><td>Isolated replacement by identical serviceable, similar-vintage items — max <b>10 rails and/or 250 sleepers per gang beat per year</b>; part of normal maintenance</td></tr>
<tr><td>Casual renewal</td><td>Small continuous stretches with serviceable or new items; not normal maintenance; can't be covered as scattered</td></tr></table>`},
{id:"c07-rail", para:"702(1)", title:"When are rails due for renewal?", body:`
<p>Five criteria: fractures/failures, wear, maintainability, GMT carried, plan-based modernisation.</p>
<ul><li><b>Fractures:</b> priority when <b>5 rail withdrawals per 10 km in a year</b> due to fracture and/or IMR USFD defects. If failures are mostly at joints, consider end-cropping (with welding). TRR also allowed where <b>&gt;30 defective welds per track km</b>.</li>
<li><b>Maintainability:</b> poor running despite extra labour, disproportionate cost, hogging/batter/scabbing/burns/corrugation (renew for hogged/battered ends only if other cures failed).</li>
<li><b>Plan-based:</b> modernising selected routes quickly, even if premature. Special components (SEJ, glued joints) when they no longer serve their purpose.</li></ul>
<table class="t"><tr><th>Wear limit for renewal</th><th>52 kg</th><th>60 kg</th></tr>
<tr><td>Loss of section</td><td>6%</td><td>7%</td></tr>
<tr><td>Vertical wear (at centre of head)</td><td>8 mm</td><td>13 mm</td></tr>
<tr><td>Corrosion in web or foot</td><td colspan=2>Beyond 1.5 mm (pits under foot and liner bite are crack starters)</td></tr></table>
<table class="t"><tr><th>Lateral wear (13–15 mm below top)</th><th>A &amp; B routes</th><th>C &amp; D routes</th></tr>
<tr><td>Curves</td><td>8 mm</td><td>10 mm</td></tr>
<tr><td>Straight</td><td>6 mm</td><td>8 mm</td></tr></table>
<table class="t"><tr><th>Minimum GMT before TRR</th><th>72 UTS</th><th>90 UTS</th></tr>
<tr><td>60 kg</td><td>550</td><td>800</td></tr>
<tr><td>52 kg</td><td>350</td><td>525</td></tr></table>
<ul><li><b>Routes under rail grinding</b> (60 kg/90 UTS): service life <b>P = 1000 − 0.25R</b> GMT, R = GMT carried before grinding started.</li>
<li>First preventive grinding of new track within <b>5 GMT or 6 months</b>, whichever earlier.</li>
<li>On important bridges, major bridges with bank ≥5 m, all tunnels, and 100 m approaches: <b>half</b> the GMT above <span class="acs">ACS-12</span>.</li></ul>
<p>Try the <a href="#tool-renewal">Rail renewal checker</a>.</p>`},
{id:"c07-sleeper", para:"702(2)", title:"When are sleepers due for renewal?", body:`
<p>A sleeper is serviceable if it holds gauge, gives a good rail seat, keeps fastenings tight and retains packing. A <b>PSC sleeper is replaced</b> if: rail seat notches deeper than <b>3 mm</b>; inserts broken or elongated; can't give required toe load; broken; or can't hold gauge and level.</p>
<p><b>TSR</b> is considered when such sleepers exceed <b>20% in a patch</b>. Re-sleepering in continuous stretches; released serviceable sleepers used for casual renewals. On girder bridges renew the full span.</p>`},
{id:"c07-plan", para:"703–707", title:"Planning, proposals, staff and traffic arrangements", body:`
<ul><li>Plan in long continuous lengths; short stretches ≤10 km not yet due may be included with adjoining lengths if substandard. Busy lines get priority. <b>CTE frames the programme</b> from DENs' proposals.</li>
<li><b>Proposals:</b> ADEN → DEN on condition and inspections; DEN checks personally at site, certifies the data is factually correct, and submits through <b>IRPSM</b> with abstract estimate and narrative justification (prepared a year ahead; up to 2 years may pass before execution).</li>
<li>HQ Track Cell test-checks, sets priorities, verifies premature (pre-GMT) proposals are unavoidable, and submits to CTE/CE; after Board sanction HQ arranges material supply.</li>
<li><b>Standards (705):</b> rail per Para 205; secondary renewals — crop ends, weld into SWR, use on less important lines (USFD tested); all primary renewals and loops/sidings with PRC sleepers; density per 209; ballast per 212.</li>
<li>Special JE/SSE takes over maintenance of the length a few days before work and hands back after completion; watchmen from permanent gangs; first aid at site.</li>
<li>Additional sidings at depots; special rakes; Engineering time allowance in WTT. Blocks: <b>2–3 h for manual</b>, <b>3–4 h for mechanised</b> relaying. Single-line working on double line where possible. Field telephones where SM can't be reached.</li></ul>`},
{id:"c07-sr", para:"708", title:"Speed restriction schedules after renewal", body:`
<table class="t"><tr><th>Day</th><th>Manual packing (I)</th><th>Machine + DTS, manual laying (II-A)</th><th>Machine + DTS, TLE (II-B)</th><th>Machine + DTS, TRT (II-C)</th></tr>
<tr><td>1</td><td>20</td><td>20</td><td>20</td><td>30</td></tr>
<tr><td>2</td><td>20</td><td>20</td><td>20</td><td>30</td></tr>
<tr><td>3</td><td>20</td><td>40 (1st tamp + DTS)</td><td>20</td><td>40 (1st tamp + DTS)</td></tr>
<tr><td>4–5</td><td>45</td><td>40</td><td>40 (day 4 1st tamp) / 40</td><td>40 / 75 (day 5 2nd tamp)</td></tr>
<tr><td>6</td><td>45</td><td>75 (2nd tamp)</td><td>75 (2nd tamp)</td><td>75</td></tr>
<tr><td>7–8</td><td>45</td><td>75</td><td>75</td><td>75 / up to 110 (day 8, 3rd tamp design mode)</td></tr>
<tr><td>9</td><td>45</td><td>up to 110 (3rd tamp, design)</td><td>up to 110</td><td>Normal</td></tr>
<tr><td>10</td><td>45 (3rd packing)</td><td>Normal</td><td>Normal</td><td>—</td></tr>
<tr><td>11–19</td><td>75</td><td colspan=3></td></tr></table>
<p class="small">Manual schedule: speed raised to normal only after one round of machine tamping in design mode and DTS stabilisation in controlled settlement mode. Work on double line normally proceeds against traffic.</p>
<table class="t"><tr><th>Without DTS (III-A TLE / III-B TRT)</th><th>Speed</th></tr>
<tr><td>Days 1–4 (TLE) / 1–3 (TRT) up to 1st tamping</td><td>20 / 30</td></tr>
<tr><td>After 1st tamping, ballasting, traffic stabilisation; 2nd tamping</td><td>40</td></tr>
<tr><td>Design survey; 3rd tamping in design mode</td><td>75</td></tr>
<tr><td>Days 11–12 (TLE) / 10–11 (TRT)</td><td>110</td></tr>
<tr><td>Day 14 / 13 after footplate inspection</td><td>130</td></tr>
<tr><td>Day 16 / 15</td><td>160</td></tr></table>
<p class="small">Without DTS the schedule assumes ≥10 GMT routes; on lighter routes extend so at least 50,000 t passes after each tamping. Full ballast profile before the 3rd tamping. Ballast deficiency, rail condition or joints may further restrict speed.</p>`},
{id:"c07-dpr", para:"709–711", title:"Project report and preliminary works", body:`
<p>Every sanctioned track work (CTR, TSR, TRR, deep screening, bridge sleeper renewal…) needs a <b>detailed project report</b> soon after inclusion in the FWP, submitted to HQ:</p>
<ol><li>Pink Book details, scope, cost.</li><li>Existing track inventory (rails, sleepers, fittings, turnouts, SEJs, glued joints, ballast, formation width, LCs, bridges, curves, banks/cuttings, yards).</li><li>Classification and colour marking of existing material (Paras 721–722), jointly by section SSE and Spl SSE.</li><li>Proposed P.Way diagram.</li><li>Levels every 20 m and gradient diagram; vertical curves; avoid lowering; girder lifting scheme; LC road levels across multiple tracks.</li><li>Fresh curve survey and slews.</li><li>Execution <b>bottom upwards: Formation → Ballast → Sleepers → Rails</b>.</li><li>Formation widening, drains, rehabilitation.</li><li>Ballast sources (cess/depot) — don't start sleeper renewal without ballast arrangements.</li><li>Transport &amp; unloading; welding plan; turnout/bridge sleeper/LC renewals; machines, fuel, base depot; contracts; materials with drawing numbers; manpower and camps; <b>approved LWR plan</b>; SRs, blocks and rakes (approved by DRM with Sr.DOM); network diagram with critical activities.</li></ol>
<p><b>Preliminary works (710):</b> deep screening a couple of days ahead of CTR/TSR; treat bad formation first; fix centre-line and level references; realign and lengthen transitions for future speeds; square joints where creep exists; mark new joint positions (cut rails on curves); arrange tools and check gauges; give notice to TRD (OHE adjustment, bonding), S&amp;T and Operating.</p>
<p><b>Unloading (711):</b> opposite the laying point, no excess; ramps of unserviceable rails; end-unloading for panels (RDSO CT-35); stack level on foot; no carrying on head/shoulder; jim-crow kinks; never punch/chisel mark; remove material lying alongside quickly.</p>`},
{id:"c07-method", para:"712–716", title:"Relaying methods and linking standards", body:`
<ul><li><b>Mechanical relaying</b> (TLE/TRT etc.) — mandatory practice for concrete sleepers; follow IRTMM.</li>
<li><b>Manual relaying (714)</b> — for single rail, 3-rail panel and LWR (plus Paras 346, 347). TSR first with deep screening under 20 km/h (both completed continuously each day; or every 5th sleeper with 4 intact if under SR); lift to final level with ramp; after 3 rounds of through packing do TRR in a short block; final packing and relax per Table I. Post-relaying: alignment, gauge, cross level, ERC greasing, full ballast, cess, curve boards and cant, drains, clear released material.</li></ul>
<table class="t"><tr><th>Free rail (12/13 m) laying gap (715)</th><th>Gap</th></tr>
<tr><td>Rail temp 0–10°C</td><td>10 mm</td></tr><tr><td>10–25°C</td><td>8 mm</td></tr><tr><td>25–40°C</td><td>6 mm</td></tr><tr><td>40–55°C</td><td>4 mm</td></tr><tr><td>55–70°C</td><td>2 mm</td></tr><tr><td>Above 70°C</td><td>Zero</td></tr></table>
<p class="small">SWR gaps per Para 319. Grease fishing surfaces; no bent rails; anticorrosive paint on LC and yard rails; same-length rails in pairs; square joints; creep posts. Laying standards (716) per Para 520, measured 3 months after normal speed.</p>`},
{id:"c07-pc", para:"717", title:"Renewal of points & crossings", body:`
<p>Renew when wear limits of Para 429 are reached, sleepers are due, adjoining rail section is upgraded, or after the GMT below (or condition basis by CTE) <span class="acs">ACS-14</span>:</p>
<table class="t"><tr><th>Item</th><th>52 kg</th><th>60 kg</th></tr>
<tr><td>Fabricated over-riding switch (incl. bearing plates, slide chairs)</td><td>250</td><td>300</td></tr>
<tr><td>Thick Web Switch</td><td>500</td><td>800</td></tr>
<tr><td>— fabricated slide chairs &amp; bearing plates of TWS</td><td>250</td><td>400</td></tr>
<tr><td>— cast slide chairs &amp; bearing plates of TWS</td><td>—</td><td>800</td></tr>
<tr><td>CMS crossing after 3 rounds of in-situ robotic reconditioning</td><td>350</td><td>400</td></tr>
<tr><td>WCMS crossing after 3 rounds of robotic reconditioning</td><td>—</td><td>400</td></tr></table>
<ul><li>Layout modifications on passenger lines need <b>CRS sanction</b>. Improve layouts, use standard sections and standard crossings, one rail length of same section each side, accurate reference for intersection point, weld SRJ and lead joints.</li>
<li>Gauge tie plates fitted jointly with S&amp;T. Tongue rails must house against stock rail up to JOH without pressure before stretcher bars are connected.</li>
<li>Deep screen first, ballast up to sleeper bottom, extra ballast ready. Methods: build at site, slew a pre-assembled turnout (on greased rail grid), or mechanised (IRTMM).</li></ul>`},
{id:"c07-fittings", para:"718–720", title:"Service life of fittings; yards", body:`
<table class="t"><tr><th>Fitting (plain track)</th><th>Renew after (whichever earlier) or on condition by CTE</th></tr>
<tr><td>GFN-66 liners</td><td><b>200 GMT or 4 years</b></td></tr>
<tr><td>Metal liners</td><td><b>400 GMT or 8 years</b></td></tr>
<tr><td>ERC</td><td><b>400 GMT or 8 years</b></td></tr>
<tr><td>GRSP</td><td><b>200 GMT or 4 years</b></td></tr>
<tr><td>CGRSP</td><td><b>400 GMT or 8 years</b></td></tr></table>
<p class="small"><b>50%</b> of the above at turnouts, washable aprons/BLT aprons, curves sharper than 5°, SEJs, gradients steeper than 1 in 100, coastal areas, station yards and approaches.</p>
<ul><li><b>Yard sleeper density:</b> loops per Para 209; other running and busy yard lines <b>M+4</b>; other yard lines <b>M+2</b> (M = 13 m rail length); symmetrical splits with equal speeds — same as main line. Concrete sleepers in all yard lines.</li>
<li>Non-running yard lines: <b>Class II rails</b> only. Renewals in yards with 3-rail SWP, preferably welded into LWR.</li></ul>`},
{id:"c07-released", para:"721–723", title:"Released material — classes, marking, accounts", body:`
<table class="t"><tr><th>Class</th><th>What it is</th><th>Marking</th></tr>
<tr><td><b>Class I</b></td><td>New, standard section (and new interchangeable obsolescent items bought to keep stock usable)</td><td>No mark</td></tr>
<tr><td><b>Class II(a)</b></td><td>Released rails fit for running lines</td><td><span class="sw" style="background:#fff;border:1px solid #888"></span>White daub on ends</td></tr>
<tr><td><b>Class II(b)</b></td><td>Released rails fit for non-running lines</td><td><span class="sw" style="background:#eab308"></span>Yellow daub</td></tr>
<tr><td>Class II others</td><td>Second-hand sleepers etc. fit for track</td><td>White daub</td></tr>
<tr><td><b>Class III</b></td><td>Unserviceable / scrap</td><td><span class="sw" style="background:#dc2626"></span>Red daub</td></tr></table>
<ul><li>Sort rails (re-use, non-running, posts/structures, scrap; crop worn ends), sleepers, fishplates, ERCs, liners; recover small P&amp;C fittings; recondition S&amp;C if wear not excessive.</li>
<li><b>Accountal:</b> yardsticks of % weight loss fixed from foot-by-foot survey jointly by SSE and ISA/Stock Verifier (weigh samples), approved personally by Sr.DEN/DEN (Annex 7/1). Scrap: rails by length → weight; sleepers in numbers (whole/parts); fittings by weight. PSC sleepers replaced on condition = scrap. Higher loss needs justification and DEN certificate; lower loss → actuals. Summary sheet Annex 7/2; <b>ADEN test-checks 20%</b> of each item. Works accountant checks MAS accounts. With contractors, list released material jointly <b>before dismantling</b>; contractor liable for shortages.</li>
<li><b>After relaying:</b> remove all released material (work isn't complete until then), temporarily strengthen gangs, description boards for trial materials, update P.Way/yard diagrams and TMS, close accounts within <b>3 months</b>.</li></ul>`}
],

CH.push({
id:"c08", n:8, title:"Engineering Restrictions & Indicators, Trollies, Lorries & Material Trains", short:"Protection of works, boards, detonators, trollies, material trains, machines",
why:`Track work happens on a live railway. This chapter is about <b>protecting the work site and the trains</b>: which works need a block, how to protect short and long duration works with flagmen, banner flags, detonators and engineering indicator boards, how to impose and remove a block, how detonators are stored and tested, and the rules for trollies, motor trollies, lorries, rail dollies, material trains and track machines.`,
sections:[
{id:"c08-basics", para:"801–805", title:"Basic rules & categories of work", body:`
<ul><li>No gang may start work endangering trains without permission of JE/SSE/P.Way (or authorised person) <b>who must be present at site</b>. In emergency, the person at site first exhibits engineering signals and posts flagmen.</li>
<li>Trains pass only after the track is made safe, at the specified speed.</li>
<li><b>Obstructing the line</b> (discontinuity, disconnecting points/signals) only with <b>written permission of the Station Master</b> who puts signals ON, plus banner flags, detonators and hand signals. In emergency: stop the train (Para 812), give the driver a written memo, request block from SM, do the obstructing work only in block, then memo the driver to proceed.</li></ul>
<p><b>Works needing complete block protection (804(2)):</b> on-track machines; material trains/girder specials; dip lorries; motor trollies; push trollies on heavy grades, poor visibility or long tunnels; TRR; casual rail replacement; SEJ/buffer rail replacement; glued joint insertion; temporary/permanent fracture or buckle repairs; switch/crossing replacement; de-stressing; in-situ welding; end cropping and welding; bridge sleeper renewal; girder-to-slab replacement; removing any rail; sleeper/guard rail renewal on important &amp; major bridges. (Indicative list.)</p>
<table class="t"><tr><th>Category</th><th>Example</th><th>Protection</th></tr>
<tr><td>1 — Routine</td><td>Through packing, picking slacks, overhauling</td><td>No SR, no hand signals</td></tr>
<tr><td>2 — Short duration</td><td>Casual renewals, creep adjustment, joint lubrication — finished by sunset, no SR after</td><td>Hand signals, banner flags, detonators</td></tr>
<tr><td>3 — Long duration</td><td>Relaying, deep screening, bridge works, diversions over days/weeks</td><td>Temporary engineering fixed signals (indicator boards), notified in advance</td></tr></table>`},
{id:"c08-short", para:"806", title:"Protecting works of short duration", body:`
<p>Give written notice to SM/block hut at both ends and get acknowledgement.</p>
<svg class="diag" viewBox="0 0 720 170" role="img" aria-label="Protection diagram for short duration work">
<line x1="20" y1="95" x2="700" y2="95" stroke="currentColor" stroke-width="3"/>
<rect x="640" y="83" width="40" height="24" fill="var(--bad)" opacity=".85"/><text x="660" y="125" text-anchor="middle" font-size="11">Work site</text>
<g><line x1="600" y1="95" x2="600" y2="60" stroke="currentColor"/><rect x="600" y="58" width="14" height="10" fill="var(--bad)"/><text x="600" y="50" text-anchor="middle" font-size="11">Flagman</text><text x="620" y="145" text-anchor="middle" font-size="11">30 m</text></g>
<g><line x1="360" y1="95" x2="360" y2="60" stroke="currentColor"/><rect x="340" y="88" width="40" height="8" fill="var(--bad)"/><text x="360" y="50" text-anchor="middle" font-size="11">Flagman + banner flag</text><text x="360" y="145" text-anchor="middle" font-size="11">600 m</text></g>
<g><circle cx="95" cy="95" r="5" fill="var(--warn)"/><circle cx="105" cy="95" r="5" fill="var(--warn)"/><circle cx="115" cy="95" r="5" fill="var(--warn)"/><line x1="70" y1="95" x2="70" y2="60" stroke="currentColor"/><text x="95" y="50" text-anchor="middle" font-size="11">3 detonators 10 m apart</text><text x="95" y="145" text-anchor="middle" font-size="11">1200 m</text><text x="60" y="80" text-anchor="end" font-size="10">Flagman ≥45 m back</text></g>
<text x="20" y="20" font-size="12" font-weight="600">Approaching train →</text>
</svg>
<table class="t"><tr><th></th><th>Train to STOP (806(1))</th><th>Train passes at RESTRICTED SPEED (806(2))</th></tr>
<tr><td>30 m</td><td>Flagman showing stop</td><td>Flagman showing caution</td></tr>
<tr><td>600 m</td><td>Flagman + banner flag across track, showing stop</td><td>Flagman + banner flag; removed once speed is reduced, then hand-signals forward</td></tr>
<tr><td>1200 m</td><td>Flagman with <b>3 detonators 10 m apart</b>, standing ≥45 m from them with clear view</td><td>Flagman showing caution</td></tr>
<tr><td>After passing</td><td colspan=2>Man at site gives proceed signal to resume normal speed (Annex 8/1, 8/2)</td></tr></table>
<ul><li>Single line: protect <b>both sides</b>. Increase distances on curves, falling grades and poor visibility (intermediate flagmen). Avoid stopping trains on steep rising grades. At night use red lights.</li>
<li>Emergency: protect per GR 15.08/15.09 first, then notify SM.</li>
<li><b>Station limits:</b> written permission of SM and signals ON; isolate the line and keep keys, clamping points; else full hand-signal protection.</li>
<li><b>Automatic signalling territory:</b> if the automatic signal is &lt;1200 m away and secured ON, banner flag at <b>90 m</b> and 3 detonators at <b>180 m</b> (GR 15.09(3)(a)).</li></ul>`},
{id:"c08-long", para:"807–809", title:"Works of long duration — engineering indicator boards", body:`
<p>Operating issues the notice; DEN obtains CRS sanction where needed and sends the safety certificate; SSE (In-charge) gets DEN/ADEN permission, blocks via Controller, notifies SMs, who issue caution orders.</p>
<table class="t"><tr><th>Board</th><th>Stop dead restriction</th><th>Reduced speed</th><th>Look</th></tr>
<tr><td>Caution indicator</td><td><b>1200 m</b> before work</td><td><b>800 m</b> before work</td><td>Yellow arrow-shaped board 1400×400 mm with black triangles, 2 m above rail</td></tr>
<tr><td>Stop indicator / Speed indicator</td><td>Stop board (red &amp; white) <b>30 m</b> before work</td><td>Yellow triangle (1 m equilateral) with speed figure <b>30 m</b> before work</td><td>2 m above rail level</td></tr>
<tr><td>T/P (termination – passenger)</td><td colspan=2>Beyond work, at length of longest passenger train</td><td>1 m yellow disc, black band</td></tr>
<tr><td>T/G (termination – goods)</td><td colspan=2>Beyond work, at length of longest goods train</td><td>1 m yellow disc, black band</td></tr></table>
<ul><li>Boards on the <b>left side</b> as seen by the driver (right side on single-line CTC). On intermediate tracks of multiple lines, fixed between tracks within 300 mm of rail level. Retro-reflective boards in new work and replacements.</li>
<li>Guard of a shorter passenger train shows "all clear" when the rear clears the restricted length; light engines resume after clearing.</li>
<li><b>Multiple speed restrictions in continuation (808(2)):</b> if the following SR is <b>more restrictive</b>, the earlier SR zone must be ≥200 m — else use only the stricter board. If the following SR is <b>less restrictive</b>, place its speed board one longest-goods-train length after the end of the previous zone (Annex 8/3A).</li>
<li><b>Stop dead (809):</b> the flagman at the stop board gets the driver's signature in the "Restriction Book" (indicator km, date, train no., time), then shows proceed with caution.</li></ul>`},
{id:"c08-block", para:"810–813", title:"Taking and removing an engineering block; caution orders", body:`
<ol><li>DEN arranges block with Sr.DOM in advance (except urgent cases); DOM instructs SMs about the last train, cancellations and who will impose/remove the block. In emergency SM (consulting Control) arranges directly.</li>
<li><b>Imposing:</b> JE/SSE sends a message to the nearest SM (copy DEN, ADEN, SSE Loco, Controller, DOM) with time and km; SM transmits to the other end; other SM acknowledges; transmitting SM blocks the line and hands a signed copy to JE/SSE. Use field telephone with Control.</li>
<li><b>Removing:</b> message with km, SR and indicator positions; acknowledged by both SMs; original SM removes block; Control advises train-ordering stations.</li>
<li><b>Caution orders</b> by SMs for all temporary engineering restrictions (exact km, speed, stops) — not for permanent restrictions in the WTT.</li></ol>
<ul><li><b>Poor visibility (811):</b> no rail displaced or obstructing work except in emergency; then add <b>2 detonators 10 m apart ≥270 m before the caution indicator</b> and a caution hand signal.</li>
<li><b>Emergency protection (812):</b> plant danger signal at the spot; go towards the train showing danger; <b>1 detonator at 600 m</b>; <b>3 detonators 10 m apart at ≥1200 m</b>; stand ≥45 m away with good view; if recalled, leave the 3 and pick up the 1 on the way back. Single line: both sides; adjacent lines: each line.</li>
<li><b>Periodical notice (813):</b> DEN publishes stations, km, speed/stop, nature and duration in the railway gazette.</li></ul>`},
{id:"c08-boards", para:"814–815", title:"Permanent speed restriction boards and other indicators", body:`
<ul><li>Permanent restrictions are notified in the WTT and use the same boards and distances as temporary ones; posts painted in 300 mm white/black bands.</li>
<li><b>'S' marker</b> for SR at facing points of outlying sidings: 1 m yellow disc with black 300 mm "S", centre 2 m above rail (not needed where sectional speed ≤50 km/h unless point speed is lower).</li>
<li>Where speed over points at a station is lower than at other stations, a permanent speed indicator on the first approach signal.</li>
<li>Information indicators under special instructions: black on yellow.</li>
<li><b>Whistle boards</b> 600 m before places where view is obstructed (cuttings, tunnels, curves) and <b>W/L</b> boards before LCs without clear view (Para 915).</li>
<li><b>Shunting limit board</b>: 600×1000 mm yellow with black cross and "SHUNTING LIMIT", 2 m high, white light both ways, ahead of trailing points.</li></ul>`},
{id:"c08-det", para:"816–818", title:"Detonators (fog signals)", body:`
<ul><li>Store dry: max <b>10 per tin</b>, wrapped in paper with cotton waste top and bottom, tins in wooden boxes away from damp walls, disinfectants and steam. Carry personally, not by consignment.</li>
<li>Every ADEN, Gang Mate, Keyman, Gateman, Patrolman and Watchman with protection duty carries the prescribed stock. Use <b>oldest first</b> (month/year stamped).</li>
<li>Fix with label/brand <b>upwards</b>, clasps bent round the rail head.</li>
<li><b>Annual test:</b> SSE (In-charge) takes the oldest one from his own stock and from each Gang Mate, Keyman, Gateman, Patrolman, Watchman and officials in his jurisdiction; explode under an empty 8-wheeler propelled at walking speed; record results; certificate to ADEN by <b>31 December</b> (countersigned to DEN).</li>
<li><b>Life: 5 years</b>; extendable year by year up to <b>8 years</b> if 2 from each lot pass the test; never beyond 8 years. Destroy rusty/time-barred ones (soak in mineral oil 48 h then burn singly, incinerator, explode under a wagon, or deep sea) under JE/SSE — never bury.</li>
<li><b>Safety range: 45 m</b> during testing; stand behind the wheel.</li>
<li><b>Warning signal (817–818):</b> red flag by day / flashing red lamp at night (GR 3.65–3.67) to warn an approaching train when there's no time to place detonators (derailment fouling adjacent line, breach, landslide).</li></ul>`},
{id:"c08-contract", para:"819", title:"Safe working of contractors", body:`
<ol><li>No work without both the railway supervisor (or representative) and contractor's supervisor at site.</li>
<li>Road vehicles/machinery must not infringe moving dimensions — demarcate and barricade; take care while turning.</li>
<li>Look-out and whistle caution orders, SRs, flagmen and detonators as needed.</li>
<li>Contractor's supervisor gets a <b>competency certificate from ADEN</b> (Annex 8/5), valid only for that work.</li>
<li>Unloaded material clear of moving dimensions and stacked to specified height/distance.</li>
<li>Engineer-in-charge approves methodology and ensures arrangements exist; an <b>assurance register</b> at each site signed by both supervisors.</li></ol>`},
{id:"c08-trolley", para:"820–841", title:"Trollies, motor trollies, lorries, moped trollies and rail dollies", body:`
<table class="t"><tr><th>Vehicle</th><th>Definition</th><th>Manning</th><th>Working</th></tr>
<tr><td>Trolley</td><td>Can be lifted off by 4 men</td><td>4 men; pushed, never pulled</td><td>Block protection preferred; at night, fog, dust storm and restricted-visibility sections under block. Otherwise by day with flagman protection.</td></tr>
<tr><td>Motor trolley</td><td>Self-propelled trolley</td><td>Driver + staff</td><td><b>Only under block</b> or following a fully braked train/light engine/motor trolley by day in clear weather (special instructions) <span class="acs">ACS-6</span></td></tr>
<tr><td>Lorry (incl. dip lorry)</td><td>Heavier; or a trolley carrying heavy material</td><td>≥4 men on foot + loaders; nobody rides</td><td><b>Only under block</b>; pushed; on grades steeper than 1 in 100, also held back by a rope</td></tr>
<tr><td>Moped trolley</td><td>Light motor trolley liftable by 3</td><td>≥3 incl. driver</td><td>As motor trolley</td></tr>
<tr><td>Rail dolly</td><td>Runs on one rail carrying a rail/sleeper slung</td><td>≥2; in-charge not below JE/P.Way <span class="acs">ACS-3</span></td><td><b>Only under block</b>; red flag; SM's written permission in station limits <span class="acs">ACS-12</span></td></tr></table>
<ul><li>Placed on line only by a person holding a <b>competency certificate</b> (literate, medically fit, knows rules; periodically renewed). Engineering officers and JEs/SSEs, authorised Gang Mates/Head Trolleymen may use trollies; motor trollies by officers, motor trolley drivers and authorised JE/SSE.</li>
<li>Efficient brakes tested before each journey (screw-down brakes desirable in ghats). Never attached to a train. Each numbered with code, department, designation and HQ.</li>
<li>Loaded in trains only with Guard's consent; motor trolley with petrol: fuel cut off, pressure released, cap tight, engine run dry.</li>
<li>Not in use: clear of line, wheels chained and padlocked.</li>
<li>Non-railway persons only by order of ADEN or above on an <b>indemnity bond</b> (Annex 8/6); private siding trolley permits with bond (8/7).</li>
<li><b>Equipment:</b> 2 hand signal lamps (or tri-colour LED), 2 red + 2 green flags, <b>10 detonators</b>, chain &amp; padlock, WTT with corrections, a watch; motor trolley — horn &amp; searchlight; lorry — 2 banner flags and extra detonators.</li>
<li><b>Signals:</b> red flag by day on a staff visible both ways; night: double line red towards expected trains and white the other way; single line red both ways; station limits red both ways; in long tunnels and poor visibility show lights by day too.</li>
<li><b>Without block where view &lt;1200 m:</b> flagman with detonators ≥1200 m in the direction of trains (double line one, single line both), intermediates to relay; on sighting a train he waves red and places 3 detonators 10 m apart; trolley removed so it can't roll back. Trollies in company ≥ <b>100 m</b> apart. Restricted-visibility sections without block use form Annex 8/8 with SM, "Trolley on line" placard and caution orders.</li>
<li>Lorry in station yard stationary &gt;15 min: banner flags + 3 detonators on both sides.</li></ul>`},
{id:"c08-mt", para:"842–861", title:"Material trains", body:`
<ul><li>Departmental train for railway material (ballast, boulders, sand, moorum, rails, sleepers). Ordered by Operating on ADEN/DEN requisition — <b>at least a week's notice</b>. Formed to maximum capacity.</li>
<li>Not in fog/storm without ADEN/DEN permission; <b>no labour-carrying material trains between sunset and sunrise</b> except emergency (DOM permission).</li>
<li>Brake van at the rear (engine at the other end); covered wagons for labour; C&amp;W "fit-to-run" certificate to Guard; weekly exam where possible.</li>
<li>Accompanied by a Guard <b>and</b> an engineering official not below <b>JE/P.Way</b>. Guard's kit: G&amp;SR, WTT, watch, lamps, 2 red + 1 green flag, whistle, ≥10 detonators, keys, padlocks, point clamps, spare glasses, first aid, wedges/skids &amp; chains, tail lamp/LV board, portable phone.</li>
<li>Every vehicle must have an efficient hand brake. Work in block with SM's permission and written clearance time. On double line run through to the station in advance, not push back (unless directed).</li>
<li>On grades: long whistle + 3 short = apply hand brakes; 2 short = release. On 1 in 50 or steeper the engine at the downhill end. No division outside station limits except emergency; no detaching vehicles on 1 in 100 or steeper.</li>
<li>After unloading ballast/sleepers, first train at <b>45 km/h or less</b>; caution order states no boards displayed <span class="acs">ACS-6</span>.</li></ul>
<table class="t"><tr><th>Speed of material train</th><th>Limit</th></tr>
<tr><td>Engine leading</td><td>As goods train with similar load</td></tr>
<tr><td>Pushing, brake van leading, grades easier than 1 in 100</td><td><b>25 km/h</b></td></tr>
<tr><td>Pushing, brake van not leading</td><td><b>10 km/h</b>, Guard on leading vehicle</td></tr>
<tr><td>Down gradient steeper than 1 in 100</td><td>Pushing <b>not permitted</b></td></tr></table>
<ul><li><b>Push back</b> only with SM's written authority ("to push back to this station"); green flags on engine front and rear brake van; stop outside advance starter/outer and be piloted in; daylight only (at night at walking pace with a man 600 m ahead showing danger).</li>
<li>Stop short of unprotected facing catch/loop/spring points; Guard checks and locks them.</li>
<li><b>Stabling:</b> not on running lines; points set against and clamped, keys with SM; in outlying sidings inside the trap, clear of fouling marks, brakes pinned.</li>
<li>Guard ensures labour seated before starting and detrained before shunting or dividing. Crew hours per roster; extended only in emergencies with certificate.</li></ul>`},
{id:"c08-hopper", para:"862–868", title:"Hopper wagons and track machines", body:`
<ul><li>Depot staff ensure correct loading level. JE/SSE gives Guard a memo of km and quantities for a "working trip"; inspects and clears track behind the train.</li>
<li>Hoppers unloaded one at a time at walking speed under Guard/official's direction; don't stop the train while discharging; remote electro-mechanical gates preferred.</li>
<li>Daily material train journal (Annex 8/10) with labour, wagons, quantities and detentions → JE/SSE → ADEN → DEN. Monthly material train return for debiting; register of engineering vehicles and monthly return by ADEN.</li></ul>
<p><b>Track machines (868):</b></p>
<ul><li>Work <b>only under traffic block</b> with SMs' permission.</li>
<li>Each machine under a nominated operator with valid competency certificate who knows protection rules; supervised by an engineering official ≥ JE/SSE/P.Way who takes the block, protects the line, and certifies track fit when the last machine clears.</li>
<li>Moving between stations with proper authority to proceed (GR 1.02(6)). Carry IRTMM safety equipment.</li>
<li>Machines in the same block section at least <b>200 m</b> apart. If a machine infringes the adjacent line, protect it per Para 806. Run within permitted machine speed. GR 4.65 + IRTMM.</li></ul>`}
],
