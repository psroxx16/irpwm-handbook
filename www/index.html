CH.push({
id:"c09", n:9, title:"Level Crossings and Gateman", short:"LC classes, TVU, standards, equipment",
why:`A level crossing is where the railway and a road share the same ground — one of the riskiest places on the network. This chapter covers how LCs are classified by traffic (TVU), the standards for gates, roads and visibility, normal position of gates, equipment at the gate, inspection and maintenance, census, track structure, and the policy of eliminating LCs by ROBs/RUBs.`,
sections:[
{id:"c09-policy", para:"901, 919–921", title:"Policy — avoid new LCs, eliminate existing ones", body:`
<ul><li>No new level crossings as far as possible. Only for new lines with RoR &lt;10% built on socio-economic grounds, a <b>manned interlocked</b> LC may be considered with Railway Board approval — <b>outside the outermost facing points</b>, away from cuttings.</li>
<li>LCs inside busy yards: replace by ROB/RUB or shift outside outermost facing points, especially during GC, remodelling and doubling.</li>
<li><b>National/State Highways, bypasses and important city roads: no new LC — only grade separators</b> (relaxation needs Board approval). Other important roads: preferably grade separators.</li>
<li>Elimination by subways with drainage, diversion roads along railway boundary (even through existing waterway spans if capacity allows), closing low-TVU gates, ROB/RUB, and during GC/doubling.</li></ul>
<table class="t"><tr><th>ROB/RUB on cost-sharing (921)</th><th>Criterion</th></tr>
<tr><td>Minimum TVU</td><td><b>1 lakh per day</b> (relaxable on suburban sections or near stations with heavy detention)</td></tr>
<tr><td>Gate closures</td><td>At least 12 times a day; trunk routes preferred</td></tr>
<tr><td>Light vehicle ramp/subway</td><td>Only for genuine hardship; cost shared 50:50</td></tr>
<tr><td>4-lane ROB cost sharing</td><td>TVU ≥ 3 lakh/day with ≥ 6000 road vehicle units, approach also 4-laned</td></tr>
<tr><td>Condition</td><td>LC must be closed before commissioning the ROB/RUB</td></tr></table>`},
{id:"c09-class", para:"902–903, 917", title:"Classification — TVU and road classes", body:`
<div class="formula">TVU per day = Trains per day × Road vehicle units per day</div>
<p>Road units: car/bus/truck/bullock cart/tonga = 1; cycle rickshaw / auto rickshaw = ½; motorised two-wheeler = ¼. Census for <b>7 days every 3 years</b> by a team of Engineering, S&amp;T and Traffic; for manned LCs a census-cum-job analysis (also checks staff adequacy under HOER).</p>
<table class="t"><tr><th>Class</th><th>Criterion <span class="acs">ACS-6</span></th></tr>
<tr><td><b>Special</b></td><td>TVU &gt; 50,000</td></tr>
<tr><td><b>A</b></td><td>TVU 30,000 – 50,000; or line capacity utilisation 80% (single line) with &gt;1000 road vehicles</td></tr>
<tr><td><b>B1</b></td><td>TVU 25,000 – &lt;30,000</td></tr>
<tr><td><b>B2</b></td><td>TVU 10,000 – &lt;25,000 (and road vehicles &gt; 750 for class B)</td></tr>
<tr><td><b>C</b></td><td>All others</td></tr></table>
<p>LCs on colliery/factory sidings with light traffic: local arrangements approved by CRS.</p>
<table class="t"><tr><th>Road class</th><th>Includes</th></tr>
<tr><td>Class I</td><td>National &amp; State Highways, important municipal roads, roads in/around towns with heavy road and rail traffic</td></tr>
<tr><td>Class II</td><td>Major &amp; other district roads, other municipal roads, roads in non-municipal towns (incl. within shunting limits), other surfaced roads</td></tr>
<tr><td>Class III</td><td>Earth roads, cart tracks</td></tr></table>
<p>Try the <a href="#tool-tvu">TVU / LC class calculator</a>.</p>`},
{id:"c09-standards", para:"904, Annex 9/1", title:"Standards for LCs (new works and upgrades)", body:`
<table class="t"><tr><th>Item</th><th>Standard</th></tr>
<tr><td>Min gate width (square to road)</td><td>Class I road: <b>9 m or X + 2.5 m</b>; Class II: <b>7.5 m or X + 2 m</b>; Class III: <b>5 m or X + 1.25 m</b> (whichever more; X = carriageway width)</td></tr>
<tr><td>Check rail (or flangeway arrangement) length</td><td><b>Gate width + 2 m</b>; on skew crossings L/sin A <span class="acs">ACS-15</span></td></tr>
<tr><td>Angle of crossing</td><td>Not less than <b>45°</b>; gate posts square to road</td></tr>
<tr><td>Wicket gates</td><td>Special, A, B: unless FOB exists; C: on need basis</td></tr>
<tr><td>Gate position when open</td><td>Special: across/towards line; others: away from or towards but not across the line; lifting barriers coupled</td></tr>
<tr><td>Gate lights for road users</td><td>Red when either gate closed, white when both open; flashing lights at important gates. No light for train drivers (except special class)</td></tr>
<tr><td>Gate post from track centre</td><td>Min <b>3.5 m</b> (tolerance +30 cm; more only with PCE approval) <span class="acs">ACS-3</span></td></tr>
<tr><td>Gate lodge</td><td>≥ <b>6 m</b> from nearest track centre and from edge of road metalling; outside of curve <span class="acs">ACS-6</span></td></tr>
<tr><td>Gate keepers (minimum)</td><td>Special 3; A, B, C 2 (C may be 1 if closed and locked at night per GR 16.03)</td></tr>
<tr><td>Fencing (unfenced lines)</td><td>Min 15 m from each gate post parallel to track</td></tr>
<tr><td>Metalling outside gates</td><td>Class I 7 m, Class II 5.5 m, Class III 3.78 m (or existing width), tapering within 30 m</td></tr>
<tr><td>Road formation for 30 m</td><td>Metalling width C + 5 m</td></tr>
<tr><td>Level length / gradient beyond</td><td>Level between gates. Outside gates level for <b>15 m</b> (Class I road) or <b>8 m</b> (Class II &amp; III roads); beyond that not steeper than <b>1 in 40</b> (Special), <b>1 in 30</b> (A), <b>1 in 20</b> (B), <b>1 in 15</b> (C). Vertical curves per IRC beyond the level portion.</td></tr>
<tr><td>Road curve radius (NH/SH)</td><td>Plain 250 m; hilly 90 m</td></tr>
<tr><td>Straight road outside gate (desirable/min)</td><td>Class I 30/15 m; II 22.5/9 m; III 15/4.5 m</td></tr>
<tr><td>Sight distance &amp; road warning signs</td><td>Class I plain 120 m (hill 60); Class II 60–90 (40–50); Class III 40 (30)</td></tr>
<tr><td>Height gauge clearance</td><td><b>4.76 – 4.78 m</b> road to underside</td></tr>
<tr><td>Lifting barrier boom above road when closed</td><td>0.8 – 1 m (IRSEM 14.2.1(h))</td></tr></table>
<p class="small">Existing lower-standard LCs need not be altered just to meet these. Interlocking: Special &amp; A always with station signals; B within station limits interlocked with station signals (and outside with gate signals) where operated from cabins/automatic territory; C in automatic signalling territories. Telephone with ASM for all. Warning bell/hooter at interlocked LCs in suburban and automatic signalling sections. Warning board (2000×450 mm, black/yellow 45° stripes, top 4 m above rail) at emergency braking distance if gate signal sighting is poor; LC near a station must be at least a full train length clear of the outer signal.</p>`},
{id:"c09-gates", para:"905–909", title:"Gates, locking, normal position, signals, traffic vs engineering gates", body:`
<ul><li>Lifting barriers (coupled, simultaneous) at new manned LCs; replace chains/swing gates progressively. Lock securely when closed against road; stops to prevent swinging onto track; catches when open.</li>
<li>Spares at every manned LC: <b>2 long chains</b> with "STOP" red discs and rail posts to fix them; spare small chains and padlocks.</li>
<li><b>Normal position:</b> <b>Interlocked LCs — normally open to road</b>, closed for trains by taking off signals. <b>Non-interlocked — normally closed to road</b>, opened only when necessary and safe (special instructions may permit normally open, e.g. seasonal heavy traffic). Station signals don't protect a non-interlocked gate. When open to road, the gateman keeps a hand signal ready (lit red at night).</li>
<li>Road signals preferably electric; else gate lamps with blinders lit sunset to sunrise.</li>
<li><b>Traffic gates</b> (within outermost stop signals): operated by Operating, maintained by Engineering. <b>Engineering gates</b> (beyond outermost stop signals): operated and maintained by <b>SSE/P.Way (In-charge)</b>. Signals, interlocking, lifting barriers at interlocked gates and communication are maintained by S&amp;T everywhere.</li>
<li>Gate working instructions (English, Hindi, local language) with interlocking diagram in Station Working Rules and at the gate lodge.</li></ul>`},
{id:"c09-equip", para:"910–912", title:"Equipment at LC, gate lodge and gatemen", body:`
<p><b>Equipment:</b> 2 tri-colour rechargeable LED hand signal lamps; 1 green + 2 red flags; staff for red lamp/flag; 2 long spare chains with STOP discs; 2 small chains &amp; padlocks; <b>10 detonators</b>; 2 banner flags; flag tin; muster canister (engineering gates); tommy bar, water pot, mortar pan, phowrah, rammer, pick-axe; tool list; safety rule book; duty roster; road users' complaint book; inspection register; LC working instructions; 2 gate lamps; warning signals (3 on double/multiple line, ghat, suburban, automatic; 2 on single line); protection diagram (Annex 9/7); wall clock; whistle thunderer; 2 sets jumper &amp; gloves in electrified sections. More flags/detonators on multiple lines. Automatic Private Number generators (PN only after gates close) preferred.</p>
<ul><li>Indicator posts with <b>one dot at 600 m</b> and <b>three dots at 1200 m</b> both sides to guide detonator placing; arrangement to show danger signal 5 m away.</li>
<li><b>Height gauges</b> on electrified sections both sides, at least <b>8 m from gate posts</b> (PCE may relax to 8 m from track centre).</li>
<li>Gate lodge with clear view of trains and road, allowing for future doubling/road widening; outside of curve.</li>
<li><b>Gatemen</b>: competent track maintainers, medically fit in <b>A3</b>, literate (to exchange private numbers), trained at Divisional Training Centre with competency certificate; duty roster at lodge — no change without SSE's order; medical and vision test records at lodge; joint check of equipment at handing over.</li></ul>`},
{id:"c09-maint", para:"913–916", title:"Maintenance, inspection, registers, whistle boards, speed breakers", body:`
<ul><li>Cut trees/undergrowth obstructing view (Para 648).</li>
<li><b>Overhaul LCs</b> on PSC with each machine packing cycle — <b>never more than 2 years</b>; galvanised fittings in contact with road (or wire-brush + coal tar); check flangeway, cross level, gauge, alignment, pack before reopening.</li>
<li>Paint gates and discs regularly; SSE keeps a manuscript repair register; maintains whistle and STOP boards.</li>
<li><b>Check rails removed</b> for tamping/overhaul/de-stressing/renewal must be refixed before leaving site. If not possible: <b>30 km/h</b>, divert road traffic (or temporary arrangement), refix by <b>close of next day</b>, post a stationary watchman <span class="acs">ACS-15</span>.</li>
<li>JE/SSE checks gate equipment <b>monthly</b> by rotation and examines gatemen in rules (with practical demonstration) on appointment, promotion, transfer and routinely; surprise day/night checks. <b>ADEN</b> inspects equipment at every manned LC <b>once in 6 months</b> and examines gatemen.</li>
<li>LC register (Annex 9/3) in DEN, ADEN and SSE offices; update and paste revised instructions/diagram at the lodge after changes.</li>
<li><b>Whistle boards (W/L)</b> bilingual, <b>600 m</b> before every LC (Annex 9/4).</li>
<li>Rumble strips are the road authority's job; meanwhile Railway provides <b>speed breakers ~20 m from the gate post</b> across the full road width (entry side only on divided roads), painted, with standard warning signs.</li></ul>`},
{id:"c09-track", para:"918", title:"Track at level crossings", body:`
<ul><li>No rail joints in check rails or running rails within the LC and <b>3 m</b> either side.</li>
<li>SWR may run through the LC, with no fish-plated joint on it or within <b>6 m</b>.</li>
<li>LC must not fall within an LWR breathing length.</li>
<li>Concrete sleepers to RDSO LC drawings (RT-4148/4148A; RT-8671 for 25 t).</li></ul>
<div class="tip"><b>Gateman's emergency protection</b> (Para 118(5), Annex 9/7): banner flag 5 m from end of check rails on the line where a train is expected first; 1 detonator at 600 m; 3 detonators 10 m apart at ≥1200 m; repeat for other direction/line; stay at the obstruction.</div>`}
],

CH.push({
id:"c10", n:10, title:"Patrolling of the Railway Line", short:"Keyman, monsoon, hot/cold weather, watchmen",
why:`Track can become unsafe suddenly — a breach after heavy rain, a buckle on a hot afternoon, a weld fracture on a cold night. Patrolling puts trained eyes on the track at exactly those times so that trains can be stopped in time. This chapter lists the six kinds of patrolling, how patrol charts are made, what each patrolman carries, and exactly how to protect the line when damage is found.`,
sections:[
{id:"c10-types", para:"1001–1003", title:"Types of patrolling", body:`
<ol><li><b>Keyman's daily patrol</b> — every bit of track inspected daily on foot (CE may allow once in 2 days on light-traffic lines). Keyman preferably given a <b>GPS tracking device</b>.</li>
<li><b>Gang patrol in abnormal rain or storm</b> — organised by the Mate on his own, focusing on known danger points: cuttings, scour-prone culverts, banks near tanks, bridge approaches; in high winds, track liable to falling trees. Beat length like monsoon patrol. IMD warnings reach JE/SSE via Control (see Para 1129).</li>
<li><b>Monsoon patrolling</b> on notified sections.</li>
<li><b>Hot/cold weather patrolling</b> for LWR/CWR.</li>
<li><b>Stationary watchmen</b> at vulnerable locations.</li>
<li><b>Security patrolling</b> during civil disturbance / special occasions — with civil authorities; primary duty: protect trains from tampering and obstructions.</li></ol>`},
{id:"c10-monsoon", para:"1004(1)–(7)", title:"Monsoon patrolling — charts, books, equipment", body:`
<ul><li>DEN notifies the sections and the period; JE/SSE may start earlier or continue later if needed, advising all.</li>
<li><b>Patrol chart principles:</b> single patrolman normally (pairs in ghats, suburban or risky areas with Sr.DEN/Co approval); <b>maximum protection to passenger trains between sunset and sunrise</b>; block section as a unit split into equal beats, each <b>≤5 km</b>; walking speed <b>3 km/h</b>; max <b>20 km a day</b>; ≥½ hour rest between beats; plot train paths to minimise time between patrol and train; show watchman locations (specimens Annex 10/1–10/3).</li>
<li>Charts distributed before monsoon to ADEN, SSE, DOM (Control), SMs and Loco Inspectors — so drivers expect patrolmen and act as a check on them.</li>
<li><b>Patrol book</b> (numbered per beat, in a tin case): SM/block hut signs arrival and departure times; patrolmen exchange books at beat ends; if the next man is absent, keep going until you meet him and report next day.</li>
<li>If a patrolman doesn't arrive, SMs at both ends issue <b>caution orders</b> to all trains until he arrives and reports all well. SMs also check patrolmen report sober, equipped, lamps ready.</li></ul>
<p><b>Monsoon patrolman's kit:</b> staff (foldable); <b>15 cm square number plate</b> (white on black); <b>10 detonators</b>; warning signals (3 on double/multiple line, ghat, suburban, automatic; 2 on single line); protective clothing (safety shoes/gum boots, jacket, raincoat, helmet with headlight); match box; 2 red + 1 green flag (day); patrol book in tin; 3-cell torch; whistle thunderer; haversack. In pairs, the second man gets a torch, whistle, clothing, plus spanner, hammer and light crowbar.</p>
<ul><li><b>Selection:</b> literate, intelligent, experienced, trustworthy track maintainers; <b>twice the number required</b> (for relief); pass DMO vision test.</li>
<li>SSE (In-charge) certifies to DEN through ADEN <b>a month before monsoon</b> that patrolling and watching arrangements are complete and staff trained, with list of names and beats.</li></ul>`},
{id:"c10-damage", para:"1004(8)–(10)", title:"What a patrolman does on finding damage", body:`
<div class="warn"><b>First protect, then report.</b> Danger signal = red flag by day, red light by night. Detonators: <b>1 at 600 m</b>, <b>3 at 1200 m, 10 m apart</b>, on the line from which trains approach.</div>
<p><b>Two patrolmen:</b> show danger both ways; walk in opposite directions placing detonators at 600 m and 1200 m; if a washaway prevents crossing, one stops trains from the far side while the other protects his side. Then the one nearer the station hurries there (showing danger) to tell the SM and alerts the gang on the way; the other stays at the obstruction showing danger.</p>
<p><b>One patrolman, single line:</b> place red lamp/flag prominently facing one direction; run the other way placing detonators; come back and protect the first side the same way (if it's impossible to cross, place the lamp to be seen from as far as possible). <b>Double line:</b> place lamp/flag on one track; run along the track on which a train is expected first and place detonators; come back and protect the other. Then stay at the site and send word through any railway employee or person available.</p>
<p><b>Officials:</b> JE/SSE examines and initials patrol books; supplies equipment and consumables (Mate checks they carry it); drills patrolmen by practical demonstration; checks equipment <b>monthly</b>. Night patrol checks by train: <b>JE/SSE (Sectional) fortnightly</b>, <b>SSE (In-charge) monthly</b>, <b>ADEN whole sub-division monthly</b>. On damage, ADEN, SSE and JE rush to site.</p>`},
{id:"c10-hot", para:"1005(1)–(2)", title:"Hot weather patrolling (LWR/CWR)", body:`
<p>Period set by <b>CTE</b> for each section; JE/SSE organises; Gang Mate and JE/SSE stay vigilant on hot days.</p>
<table class="t"><tr><th>Start hot weather patrol when rail temperature exceeds</th><th></th></tr>
<tr><td>Wider-base PSC, 1660/km</td><td><b>t<sub>d</sub> + 30°C</b></td></tr>
<tr><td>PSC with density ≥1540/km</td><td><b>t<sub>d</sub> + 25°C</b></td></tr>
<tr><td>PSC with density &lt;1540/km</td><td><b>t<sub>d</sub> + 20°C</b></td></tr></table>
<table class="t"><tr><th>Beat</th><th>Hot weather</th><th>Cold weather</th></tr>
<tr><td>Single line, or only one road of double line is LWR</td><td>1 patrolman per <b>2 km</b></td><td>1 per <b>4 km</b></td></tr>
<tr><td>Double line, LWR on both roads</td><td>1 patrolman per <b>1 km of UP + DN</b> (2 km walk)</td><td>1 per <b>2 km of UP + DN</b></td></tr></table>
<p class="small">Sr.DEN (Co) may vary beats for local conditions.</p>
<p><b>Kit:</b> 2 red flags, staff, <b>10 detonators</b>, <b>Canne-a-boule with rubber ball</b>; GPS device preferred.</p>
<p><b>Duties:</b> during the hottest part of the day walk slowly on one rail (or on sleepers on the non-gauge side) one way and the other rail back, alternating UP/DN on double line. On seeing a kink, sound <b>every sleeper for 100 sleepers each side</b> by dropping the Canne-a-boule on each sleeper end — poor rebound means voids/floating track. If floating condition or actual buckle: protect with hand signals, then inform Gang Mate and JE/SSE.</p>
<p><b>Gang Mate then:</b> rushes with men, protects, inspects 100 m either side, heaps and compacts ballast on shoulders up to rail head, <b>does not slew, align or disturb ballast</b>, records rail temperature, covers the sun-facing rail with ballast/leaves, stays till JE/SSE arrives.</p>`},
{id:"c10-cold", para:"1005(3)–(5)", title:"Cold weather patrolling (LWR/CWR)", body:`
<ul><li>Sections and period set by <b>Sr.DEN (Co)</b> based on fracture analysis, rail corrosion, overdue renewals and traffic. <b>Compulsory when rail temperature falls below t<sub>d</sub> − 30°C.</b></li>
<li>Beats: see table above (4 km single / 2 km UP+DN double).</li>
<li><b>Kit:</b> 10 fog signals, 2 tri-colour lamps/LED torches, match box, 2 red + 1 green flag, 3-cell torch, staff, number plate, spanner, protective clothing.</li>
<li>Patrol during the <b>coldest part of the night</b>, along one rail then the other, looking for rail/weld fractures, SEJ gaps beyond design maximum, sheared bolts. On finding one: suspend traffic and protect per Para 812; report to Keyman/Gang Mate/JE/SSE for emergency repairs.</li></ul>`},
{id:"c10-watch", para:"1006", title:"Stationary watchmen at vulnerable locations", body:`
<p><b>Vulnerable locations</b> = places where unsafe conditions may develop and trains must be stopped in time: bridges with inadequate waterway / scour-prone foundations / oblique flow / floods often above danger level; bad banks liable to slip; bridges fed by railway-affecting tanks; cuttings and hills declared vulnerable by DEN; water overtopping track; any other.</p>
<ul><li>ADEN/DEN keep and review a register of vulnerable locations.</li>
<li>Watchmen posted <b>round the clock</b> at nominated locations during monsoon; protect the line per Para 1004(8) if danger is apprehended.</li>
<li>Equipment same as patrolman except number plate, haversack and patrol book — they get a notebook instead.</li></ul>`}
],

],

]

CH.push({
id:"c11", n:11, title:"Action During Accidents including Breaches & Pre-Monsoon Precautions", short:"Accidents, evidence, restoration, floods, monsoon prep",
why:`When things go wrong, P.Way officials are among the first at site. This chapter tells you how to report an accident, protect the train, help the injured, <b>preserve evidence</b> (so the cause can be found fairly), restore traffic quickly, run diversions, pass trains through flooded track, and — most importantly — how to prepare before every monsoon so breaches don't happen in the first place.`,
sections:[
{id:"c11-def", para:"1101–1102", title:"What is an accident; first report", body:`
<p>An <b>accident</b> is any occurrence (inside or outside railway limits) that does or may affect the safety of the railway, its engines, stock, track, works, passengers or staff, or causes unusual delay or loss — e.g. a flood outside railway land threatening the line. Rules: Accident Manual and Railways (Notices of and Enquiries into Accidents) Rules 1998 under Sec 122 of the Railways Act 1989. GR 2.11 obliges every railway servant to ensure public safety, report, assist, and act on defective signals, track failures, anything wrong with a train — but for a <b>parted train never show a stop signal</b>; attract driver/guard by shouting/gestures.</p>
<p><b>First engineering official at site reports to nearest SM</b> (quickest means, for an "all concerned" message): station(s), km, train number/description, date &amp; time, casualties, nature and cause if known, damage (track, works, bridges, OHE, signals, stock), probable duration of block, transhipment need/feasibility, assistance required (medical, ART). Get acknowledgement.</p>`},
{id:"c11-site", para:"1103–1104", title:"Action at site", body:`
<ul><li>JE/SSE (P.Way/Works/Bridge) and ADEN go to site by the quickest means, arranging material, staff, tools and the tool van on the way; DEN checks with Control and goes if serious. Adjacent division may be called if it can help faster.</li></ul>
<p><b>JE/SSE at site:</b></p>
<ol><li><b>Protect the train</b> front and rear (GR 6.03, 9.10); protect the adjacent line too if affected; else pass trains cautiously.</li>
<li><b>First aid and rescue</b>.</li>
<li>Advise SM (field telephone on controlled sections).</li>
<li>If no traffic official is present: secure line clear token/ticket and caution orders; in yards seize the train register, note line badges, panel, block instruments, signals, points, levers, keys jointly with other departments.</li>
<li><b>Before clearing</b>: senior-most official first at site examines and records track, train and vehicles with notes and sketches; checks spectacles of staff if eyesight may matter.</li>
<li><b>Sabotage suspected</b>: <b>no clearance until Police arrive and agree</b>; joint factual note signed by senior Police and Railway officials (differences recorded); ask CRS whether he wishes to inspect first. First aid is never delayed.</li>
<li>Other cases: clearing can start before Police arrive; preserve rails, sleepers and fastenings with wheel marks, especially between <b>point of mount and point of drop</b>.</li>
<li>Senior-most officer records preliminary staff statements early (delay invites suppression/fabrication).</li>
<li>Contact ADEN/DEN; if unreachable organise restoration himself (ballast trains, material, tools).</li></ol>
<p><b>Preserving clues (1104(1)(h)):</b></p>
<ul><li>Nominated ART staff take photos/video using <b>"whole to part"</b>: long shot (whole site with OHE mast/hectometre number and coach/wagon number) → medium (bogie and track) → close-ups of components; inside driver and guard cabins; panel, block instruments, relay room seals.</li>
<li>Advise Divisional Safety officials in writing of clues to preserve; preserve tell-tale signs in sabotage cases.</li>
<li>Rail/weld failure: collect <b>WILD data</b> for preceding trains. Preserve and analyse <b>data logger</b> records. Loco speed and event recorders frozen.</li></ul>
<p><b>ADEN</b> ensures all this, informs DEN and Control with restoration time, works continuously till through running, makes a preliminary report. <b>DEN</b> checks adequacy, informs DRM and PCE (PCE/CTE may go for very serious accidents), reports, and ensures fractured rail/weld pieces go to <b>RDSO</b> when they are prima facie the cause. The senior-most officer at site coordinates everything.</p>`},
{id:"c11-report", para:"1105–1109", title:"Reports, sketches and joint measurements", body:`
<ul><li><b>Report to PCE</b> (copy DRM) by senior-most engineering official: nature, cause, casualties, damage, rainfall &amp; patrolling (for floods), steps taken, restoration time, transhipment, diversion, assistance needed — with a dimensioned sketch.</li>
<li><b>Breaches:</b> DEN submits a technical report with drawings and remedies to PCE <b>within a month</b>.</li>
<li>Police attend derailments of passenger trains to guard evidence, loose material and luggage.</li>
<li>First engineering representative examines the whole site including track the train passed before derailing; prepares the <b>site sketch (Annex 11/1A)</b>: train no., date, km, North point, direction, stations, ~<b>300 m behind point of mount and similar ahead</b>, LCs, posts, bridges, gradients, curves (degree, cant, transitions), positions of all vehicles and marks, point of mount (with nearest joints), point of drop, first derailed wheel pair, displaced parts — all dimensioned from km post and track centre. Wheel-mount marks are vital (length, strong/faint, continuous/broken, single/multiple) and must be photographed.</li>
<li>Check gang charts for when the track was last attended; note works in progress, caution orders and protection.</li></ul>
<p><b>Joint track measurement (Annex 11/1B)</b> with C&amp;W and Traffic supervisors:</p>
<ul><li><b>Part A</b>: soil, formation, rainfall, ballast depth and cleanliness, drainage, shoulders, sleepers (type, density, condition, square, packing), rails (section, year, wear, GMT), fastenings, joints, creep, broken components, anti-sabotage measures, point of mount/derailment location (straight/curve/transition, grade/sag — sag = 90 m either side of grade intersection). Left/right relative to train movement.</li>
<li><b>Part B</b>: point of mount = station 0; stations <b>every 3 m</b> for <b>45 m each side</b> if cause is indisputable, otherwise <b>100 m in rear and 45 m ahead</b>; gauge and cross level (unloaded and loaded), marks, versines (20/10 m chord for curves &gt;600 m; 10 m or shorter for sharper), alignment kinks, subsidence; longitudinal levels <b>300 m rear and 100 m front</b>.</li>
<li>Also loco (11/1C), wagons (11/1D), coaches (11/1E); signalling (stretcher bars, last movement, point locking, crank handle seal, emergency operations, TSR/log book last three moves, panel frozen, relay room double-locked, disconnections, data logger, block instrument, overhaul/testing dates, unsafe failures in 3 months); operating (speed from recorder, long/short hood leading, brake power, marshalling, sudden braking/regulator, loading, caution orders, registers, PN book, securing); LC details where relevant.</li>
<li><b>Para 1109:</b> no enquiry is complete until full joint measurements of track and rolling stock are recorded and attached.</li></ul>`},
{id:"c11-restore", para:"1110–1114", title:"Restoration, labour, diversions and emergency funds", body:`
<ul><li>First repairs = minimum needed to restore traffic quickly; then bring track to standard.</li>
<li><b>Labour</b>: departmental labour nearby, 2+ men from each permanent gang, adjoining divisions, Revenue authorities, local hire, reliable contractors (fix wages first); keep departmental and contract labour separate; muster sheets; food, shelter, water, lighting. ADEN/JE may authorise SMs to issue proceed orders for labour and tools.</li></ul>
<table class="t"><tr><th>Diversion</th><th>Use</th><th>Speed</th></tr>
<tr><td><b>Temporary</b></td><td>≤10 days</td><td><b>Stop dead, then 10 km/h</b>; no cant</td></tr>
<tr><td><b>Semi-permanent</b></td><td>&gt;10 days, for reconstruction</td><td>Non-stop reduced speed after consolidation</td></tr></table>
<ul><li>Curve radius ≥ <b>450 m</b> (difficult terrain ≥ 225 m); gradient ≤ <b>1 in 100</b> compensated (difficult terrain up to ruling gradient).</li>
<li>Setting out: L = √(C² + 4RD − D²) + S/2 ; T = RD ÷ (L − S/2 + C)… (half-length L along old alignment, offset D, straight S, straight between reverse curves C, radius R, tangent T).</li>
<li>Consolidate and test by loco/loaded wagons; bench slopes where new bank meets old (most vulnerable); check cross levels after every train till stable. Opening per Para 1209.</li>
<li>Transhipment decided by Commercial/Transportation; gangways laid away from the repair site.</li>
<li><b>Funds (1114)</b>: DEN/ADEN may draw on <b>station earnings</b> (Engg Code 1405) for daily labour, urgent tools/materials, and food for labour (free food within prescribed limits); clear receipts; inform Accounts immediately; full account with vouchers; ADEN witnesses payments. Urgent works on <b>Urgency Certificate</b> (Code 1103).</li></ul>`},
{id:"c11-flood", para:"1115–1117", title:"Obstructions, flooded causeways and submerged track", body:`
<ul><li>Obstruction on track: protect, inform SM, clear; inform Police if sabotage suspected; JE/SSE reports to ADEN/DEN; DEN reports to DRM and PCE.</li></ul>
<table class="t"><tr><th>Flooded causeway/dip (negligible current)</th><th>Max water above rail level</th></tr>
<tr><td>Passenger and mixed trains</td><td><b>300 mm</b></td></tr>
<tr><td>Goods trains</td><td><b>450 mm</b></td></tr></table>
<p class="small">Only after JE/SSE walks and probes and finds track intact. Indication posts ~1200 mm high at each end of the level portion, <b>3 m from track centre</b>, black/white 300 mm bands with white flat bars at the limits (Annex 11/2). Separate depth gauges for electric/diesel locos as fixed by the administration.</p>
<ul><li><b>Submerged track:</b> every train <b>stops dead and proceeds at ≤10 km/h</b>. Water above ballast but below rail: two men walk abreast (one at each sleeper end) before each train. Water over rails: <b>JE/SSE pilots the train</b> after probing, within the depth limits.</li>
<li>Advise ADEN, DEN, DRM, PCE when water rises above ballast and when it subsides; enter in Section Register.</li></ul>`},
{id:"c11-other", para:"1118–1123", title:"Driver's reports, rolling stock damage, minor accidents, enquiries, records", body:`
<ul><li><b>Driver's report of bad track (GR 6.07)</b>: JE/SSE collects details, goes to site if needed, records, rectifies, modifies restriction, reports to ADEN (copy DEN); ADEN examines personally where possible.</li>
<li><b>Track distorted by loco/stock</b>: impose SR and protect; report to SSE (Loco), ADEN, DEN, DME, Control and both SMs with the engine/vehicle number; examine whether track weakness contributed; repair; report. ADEN visits and reports cause and prevention.</li>
<li><b>Accidents not affecting through traffic</b>: JE/SSE clears; SSE submits report in duplicate with sketch and track particulars to ADEN; DEN scrutinises restoration time. Gate damage by road vehicles, cattle run-over, fires not affecting track reported separately.</li></ul>
<p><b>Conducting an accident enquiry (1121):</b></p>
<ul><li>Derailment depends on track geometry, vehicle characteristics and maintenance, freight loading, enginemanship and speed together.</li>
<li>Two kinds: <b>sudden derailment</b> (wheel jumps off) and <b>flange climbing</b> (wheel gradually mounts).</li>
<li>Proneness rises with higher <b>lateral force</b>, lower <b>vertical wheel load</b> (off-loading) and positive <b>angle of attack</b> — especially persistent positive angularity.</li>
<li>Decide whether damaged track components were cause or after-effect.</li>
<li>Manual tolerances are <b>for riding comfort, not safety limits</b>; they apply to main line unless stated; consider yard/low-speed tolerances appropriately.</li>
<li>Photograph/video the site like a crime scene. Include RDSO M&amp;C report if a track or stock component broke.</li></ul>
<p><b>Records:</b> accidents, breaches, washouts, subsidences in SSE's Section Register; flood damage at important bridges in rivers &amp; floods register (ADEN); systematic accident records at SSE, ADEN, DEN offices; returns to Board via Operating; workshop accidents under Factories Act.</p>`},
{id:"c11-premonsoon", para:"1124–1126", title:"Pre-monsoon precautions & emergency materials", body:`
<div class="check"><b>Pre-monsoon checklist (1124):</b>
<ul><li>Clear catch-water and side drains of silt and vegetation.</li>
<li>Clear bridge waterways (de-silt only to bed level); repair protection and river training works; fill scour holes with boulders.</li>
<li>Paint <b>HFL</b>, FSL (canals) with year, and <b>Danger Level</b> as a bright red band on piers next to abutments; flood gauges on important bridges.</li>
<li>No water stagnating on track — cross drains; yard drains to grade.</li>
<li>Hilly areas: survey and drop loose boulders systematically.</li>
<li>Select, train and test patrolmen/watchmen; complete their equipment.</li>
<li>Spare trollies ready; motor trollies overhauled.</li>
<li>Inspect rivers upstream for course changes.</li>
<li>Reserve stock of boulders, empty cement bags, wire netting, sand/quarry dust at specified places — recoup deficiencies.</li>
<li>Railway Affecting Works action (Para 1127(3)).</li>
<li>Temporary engineering indicators painted and ready; rain gauges checked.</li>
<li>Use drones for hard-to-reach assets (RDSO BS-129).</li>
<li>Cut trees likely to fall on track in storms.</li>
<li>ADEN and DEN jointly review vulnerable locations and update the register.</li></ul></div>
<ul><li><b>Emergency materials (1125):</b> rails, sleepers, crib material, ballast, sand/quarry dust/cinder and boulders near vulnerable locations; loaded wagons of sand/ballast/boulders at stations before monsoon; ballast trains working near vulnerable zones in monsoon. PCE notifies locations; reserve used only in emergency and recouped; DEN certifies to PCE that monsoon reserve is in order by the prescribed date.</li>
<li>Bridge Engineer/DEN keep service spans, trestles, cribs, derricks, compressors, blasting equipment, rock breakers, welding sets ready. PCE circulates list and drawings of <b>service spans and rail clusters</b> before monsoon (1126).</li></ul>`},
{id:"c11-raw", para:"1127–1128", title:"Railway Affecting Works & Tanks (RAW/RAT)", body:`
<p>A <b>Railway Affecting Work</b> is any tank, storage work, canal, bund etc. which, if badly built, maintained or operated, could endanger a railway bridge or bank.</p>
<ul><li>DEN/ADEN keep an up-to-date list jointly approved by Railway and State Government, showing the responsible State authority.</li>
<li>DEN reads PWD/Revenue inspection reports, marks unsatisfactory tanks, ADEN inspects; <b>ADEN jointly inspects all RAW/RAT with civil authorities before every monsoon</b>; DEN presses for repairs before monsoon; records kept in the RAW register.</li>
<li>During heavy rain, local authorities/village headmen watch tanks and warn the nearest SM, who informs SSE, ADEN, DEN. If threatened: patrol and post watchmen.</li>
<li>Bridges that may be affected carry a <b>"R.A.W." tablet</b> on a parapet with an arrow pointing to the tank.</li>
<li>If the bridge is a vulnerable location, or repairs weren't done, post watchmen in monsoon.</li></ul>`},
{id:"c11-weather", para:"1129", title:"Weather warnings and cyclones", body:`
<ul><li>Arrange with IMD for year-round warnings of high winds, cyclones and heavy rain; division updates the list of recipients yearly; foolproof communication to line staff.</li>
<li><b>Anemometers</b> near specially selected bridges with high winds; working rules fix danger wind velocity, beyond which the SM stops traffic and informs the other end and Control.</li>
<li>SM may detain a train (with Guard and Driver) when a severe storm is forecast. A driver caught in a storm stops as soon as possible but <b>not on sharp curves, high banks, cuttings or bridges</b>; restarts with Guard when safe.</li>
<li><b>SSE (In-charge)</b> alerts patrolmen, watchmen and mates; in fair season introduces monsoon patrolling and watchmen at vulnerable locations and bridges day and night for the warning period <b>+ 48 hours</b>. JE/SSE stays out in the section (by trolley) for the same period.</li>
<li><b>Gang Mates</b>: yard gang mate sends 2 men with patrol equipment both ways to alert intermediate gangs; in very heavy rain/storm all gangs start day-and-night patrolling on their own initiative, for the warning period + 48 hours.</li></ul>`}
],
facts:[
["Sabotage suspected","No clearance until Police arrive and agree","1104(1)(e)"],
["Evidence zone","Between point of mount and point of drop","1104(1)(e)"],
["Photo principle","Whole to part","1104(1)(h)"],
["Site sketch extent","~300 m behind point of mount and similar ahead","Annex 11/1A"],
["Track measurement stations","Every 3 m; 45 m each side (or 100 m rear + 45 m ahead)","Annex 11/1B"],
["Breach technical report","Within a month to PCE","1105(2)"],
["Temporary diversion","≤10 days; stop dead + 10 km/h","1112"],
["Diversion curve / gradient","≥450 m (225 m difficult); ≤1 in 100","1112(3)"],
["Flooded causeway limit","300 mm passenger, 450 mm goods above rail","1116"],
["Submerged track speed","Stop dead + 10 km/h","1117"],
["Indication posts","1200 mm high, 3 m from track centre","1116(2)"],
["Weather warning action","Warning period + 48 hours","1129"],
["RAW/RAT inspection","Every year before monsoon jointly with State","1127(3)"]
],

CH.push({
id:"c12", n:12, title:"CRS Sanction for Works Affecting Passenger Running Lines", short:"When and how to get CRS sanction",
why:`The Commissioner of Railway Safety (CRS), under the Ministry of Civil Aviation, is the independent safety authority for passenger lines. Certain works cannot be started or opened without CRS sanction. This chapter tells you which works need it, who signs the application and certificates, and the shortcut procedure after accidents.`,
sections:[
{id:"c12-law", para:"1201–1202", title:"Which works need CRS sanction", body:`
<p>Governing documents: <b>Railways Act 1989</b> (Sec 23, 24), <b>G&amp;SR 1976</b>, <b>Railways (Opening for Public Carriage of Passengers) Rules 2000</b> (Chapter VII), and <b>IRSOD</b>.</p>
<p><b>CRS sanction required</b> for opening, on passenger lines:</p>
<ul><li>Additional lines and deviation lines;</li>
<li>Stations, junctions and <b>level crossings</b>;</li>
<li><b>Yard remodelling</b> and rebuilding of major and important bridges;</li>
<li>Any alteration or reconstruction <b>materially affecting the structural character</b> of a work (decided by CE/Con for construction, CTE/CBE for open line; CTE/CBE may also refer any safety-affecting work).</li></ul>
<p><b>Not required</b> for: emergency works and temporary arrangements; FOBs and ROBs; minor bridges (construction, rebuilding, regirdering, strengthening); regirdering/strengthening of other existing bridges; elimination of manned LCs; LC upgradation incl. interlocking outside station limits; introduction of electric traction; DFC works.</p>
<p class="small">Related: P&amp;C insertion/removal/alteration on running lines needs CRS sanction (Para 429(7)); shifting without changing signalling does not. Permanent infringements to IRSOD need sanction through CRS (Para 647).</p>`},
{id:"c12-apply", para:"1203–1206", title:"Application, certificates and safety certificate", body:`
<table class="t"><tr><th>Who signs the application</th><th></th></tr>
<tr><td>Divisional track/bridge works</td><td>Sr.DEN (JAG); S&amp;T works Sr.DSTE; DRM/ADRM if no JAG officer</td></tr>
<tr><td>Construction organisation</td><td>JAG officer for CE(Con) / CSTE(Con)</td></tr>
<tr><td>Civil + S&amp;I works together</td><td>Jointly by JAG officers of both departments</td></tr>
<tr><td>RE organisation S&amp;I works</td><td>Not below Sr.DSTE/Dy.CSTE, countersigned by Dy.CSTE/RE; joint safety certificate by Dy.CSTE/RE and Sr.DSTE</td></tr></table>
<ul><li>Documents per Annex 12/1: description, drawings, list of IRSOD infringements, deviations from S&amp;I manuals and G&amp;SR, restrictions, traffic working rules, bridge documents.</li>
<li><b>Track Certificate</b> (Annex 12/2) by <b>Dy.CE (Track)</b>, countersigned by <b>CTE/PCE</b> — weakest portion's rail, wear %, sleeper density, ballast cushion and clean cushion, axle load, max speed, local restrictions, number of locos coupled.</li>
<li><b>Bridge Certificate</b> (Annex 12/3) by Dy.CE (Bridge Design), countersigned by CBE/PCE. PCOM consulted for stock, axle loads and speeds; electrical certificate in electrified sections.</li>
<li>CRS may inspect before opening (railway gives <b>≥14 days'</b> notice of readiness) or allow opening on a <b>Safety Certificate</b> (Annex 12/4) — signed by <b>ADEN, countersigned by DEN</b> (jointly with S&amp;T if signalling involved), confirming compliance with any conditions, emailed to CRS before opening with copies to DRM and PCE/PCSTE; separate certificate for each phase.</li>
<li>Any deviation from CRS-approved plans affecting layout, signals or working rules needs CRS's prior approval.</li>
<li>New types of locos/stock, speed increases, double/multiple heading: per Policy Circular No. 6 (1207).</li>
<li>New works brought into use only after DSO/DOM circulates a notice to all staff (1208).</li></ul>`},
{id:"c12-accident", para:"1209–1210", title:"Works after accidents & opening new lines", body:`
<p><b>Section 24, Railways Act</b> — after an accident, restored lines or a temporary diversion may be opened <b>without prior CRS inspection</b> if the railway servant in charge certifies in writing that opening won't endanger the public, and notice is sent to CRS immediately.</p>
<ul><li>Certificate in Annex 12/5 signed by the Engineering representative in charge, sent by quickest means; a copy handed to the Operating representative at site, who must not allow traffic until he has it.</li>
<li>Test diversions with a material train or light engine where possible.</li>
<li>No certificate to CRS needed if through communication is restored <b>within 24 hours</b>.</li>
<li>If a temporary diversion will be used for <b>more than 3 days</b>, CRS may inspect it.</li>
<li>New lines, electric traction and gauge conversions open per the Opening Rules 2000.</li></ul>`}
],
facts:[
["CRS sanction needed","New lines, stations, junctions, LCs, yard remodelling, major bridge rebuilding, structural alterations","1202"],
["No CRS sanction","FOB/ROB, minor bridges, regirdering, LC elimination, electrification, DFC","1202(3)"],
["Track certificate","Dy.CE(Track), countersigned CTE/PCE","1204(2)"],
["Safety certificate","ADEN, countersigned DEN","1205(4)"],
["Notice for CRS inspection","≥14 days","Annex 12/1"],
["No CRS certificate if restored within","24 hours","1209(4)"],
["CRS may inspect diversion if in use beyond","3 days","1209(5)"]
],
quiz:[
["Who signs the Safety Certificate for engineering works when CRS doesn't inspect?",["SSE, countersigned by ADEN","ADEN, countersigned by DEN","DEN, countersigned by PCE","CTE"],1,"Para 1205(4)."],
["Which work does NOT need CRS sanction?",["Yard remodelling","Opening a new LC","Elimination of a manned LC","New junction"],2,"Para 1202(3)(d)."],
["After an accident, a certificate to CRS is not needed if traffic is restored within:",["6 hours","12 hours","24 hours","72 hours"],2,"Para 1209(4)."]
]
});

CH.push({
id:"c13", n:13, title:"Track Management System (TMS)", short:"IR's web-based P.Way database",
why:`TMS is the single digital home for all P.Way data — assets, inspections, works, stores, TRC/OMS results and circulars. Almost every inspection and record mentioned in this manual is now entered in TMS, and most old paper registers have been withdrawn.`,
sections:[
{id:"c13-tabs", para:"1301–1305", title:"What TMS is and its modules", body:`
<p>A web-based application available 24×7 holding track assets, inspections, testing, maintenance and managerial outputs. Modular, so new modules plug in.</p>
<table class="t"><tr><th>Tab / module</th><th>Use</th></tr>
<tr><td>Asset</td><td>Rail, sleeper, fastening, weld, joint, ballast/blanket, formation, drains, switches, SEJ, LWR, bridge, LC… <b>Left/right rail is always in the direction of increasing km</b>, regardless of traffic direction.</td></tr>
<tr><td>Inspection</td><td>All manual (incl. USFD) and machine inspections</td></tr>
<tr><td>Planning</td><td>Inspection schedules and maintenance plans</td></tr>
<tr><td>Work</td><td>Assign men and machines, report compliance; gang work, special works, machine works, asset changes</td></tr>
<tr><td>Miscellaneous</td><td>Message centre, circulars, inspection notes</td></tr>
<tr><td>Store module</td><td>Ledgers for receipt, issue and accountal of P.Way material</td></tr>
<tr><td>Report</td><td>Track diagrams, TRC/OMS results &amp; analysis, assets, USFD defects, welding performance, inspections, component condition</td></tr></table>
<ul><li>TRC and OMS data are uploaded and analysed; TMS sends alerts by SMS, e-mail and home page for geometry and overdue inspections.</li>
<li>Access by user name/password with role-based interfaces (Divisional Engineering Control, USFD JE/SSE, Divisional administrators, officers, HQ, track machines).</li>
<li>Single source for Board and Zonal circulars and important letters.</li></ul>`},
{id:"c13-use", para:"1306–1308", title:"Benefits, withdrawn registers, administrators", body:`
<p><b>Benefits:</b> no manual records; monitoring of inspections and follow-ups; transparency; data-driven proactive maintenance; inventory control; resource optimisation; prioritisation; holistic planning; quick, anywhere access; single window; automatic alerts.</p>
<p><b>Registers withdrawn (now in TMS):</b> curve inspection, P&amp;C (joint P&amp;C register with S&amp;T continues but entries made in TMS), LC, LWR, welding, rail/weld failure, toe load, push trolley/footplate/rear window (footplate booklets continue with TMS entries), rail/sleeper/fastening/ballast inspection, sand hump, gap survey, USFD, TRC, OMS registers, and track diagrams. Old registers preserved in ADEN's office. <b>Still maintained on paper:</b> Section Register, Gang Chart and Gang Diary (and material handling and bridge registers).</p>
<table class="t"><tr><th>Administrator</th><th>Role</th></tr>
<tr><td>Railway Board TMS Admin</td><td>Define sections, routes, stations, lines, material master</td></tr>
<tr><td>Board / Zonal / Divisional Security Admin</td><td>Create users, profiles, passwords, upload circulars; Divisional also gives jurisdictions, gangs, agencies, certifies USFD machines and FB plants</td></tr>
<tr><td>Zonal TMS Admin</td><td>Engine run sections, control sections, tamping frequency, RAW manual, system map, special routes</td></tr>
<tr><td>Divisional TMS Admin</td><td>Stations, sections, loops, suppliers, USFD teams/machines, special works, GMT, gradients, PSRs</td></tr>
<tr><td>Store Admin</td><td>Scrap verification, ART assignment, material scales</td></tr>
<tr><td>TRC Admin</td><td>Upload, extract and bifurcate TRC/OMS data</td></tr>
<tr><td>TWTC</td><td>Welder certification by Thermit Welding Training Centre</td></tr></table>`}
],
facts:[
["Left/right rail in TMS","Direction of increasing km","1302(1)"],
["Registers still on paper","Section register, gang chart, gang diary","1307"]
],
quiz:[
["In TMS, the left and right rails are identified looking in the direction of:",["Traffic","Increasing kilometre","North","The nearest station"],1,"Para 1302(1)."],
["Which record is still maintained in physical form?",["LWR register","USFD register","Gang diary","Toe load register"],2,"Para 1307 Note (ii)."]
]
});

CH.push({
id:"c14", n:14, title:"Training, Competency & References", short:"Courses, certificates, medical, books",
why:`Track is only as safe as the people who maintain it. This chapter lists the training every category of P.Way staff must get, who issues competency certificates for which work (and how long they're valid), the medical standards, and the books every office must have.`,
sections:[
{id:"c14-courses", para:"1401–1405, Annex 14/1", title:"Training courses", body:`
<p>Four types: <b>Initial/Induction</b>, <b>Promotional</b>, <b>Refresher</b>, <b>Special</b> — classroom plus practical with tools, preferably with audio-visual aids.</p>
<table class="t"><tr><th>Category</th><th>Course</th><th>Where</th><th>Duration</th><th>When</th></tr>
<tr><td>JE/SSE/P.Way (new / LDCE)</td><td>Induction</td><td>Zonal Training Institute + field</td><td>1 year (6 + 6 months)</td><td>On joining</td></tr>
<tr><td>SSE/P.Way</td><td>Promotion</td><td>ZRTI</td><td>17 days</td><td>On promotion from JE</td></tr>
<tr><td>JE/SSE/P.Way</td><td>Refresher</td><td>ZRTI / centralised</td><td>17 days</td><td>Once in 5 years</td></tr>
<tr><td>Gang Mate / Keyman</td><td>Promotion / Basic</td><td>Divisional Training Centre</td><td>18 days</td><td>On promotion</td></tr>
<tr><td>Gang Mate / Keyman</td><td>Refresher</td><td>DTC</td><td>6 days</td><td>Once in 5 years</td></tr>
<tr><td>Gateman</td><td>Induction</td><td>DTC</td><td>12 days (6 days if from track maintainers)</td><td>New</td></tr>
<tr><td>Gateman</td><td>Refresher</td><td>DTC</td><td>6 days</td><td>Once in 5 years</td></tr>
<tr><td>Track Maintainer</td><td>Induction / Refresher</td><td>DTC</td><td>30 days / 6 days</td><td>Joining / every 5 years</td></tr>
<tr><td>JE/SSE (USFD)</td><td>Initial / Refresher</td><td>RDSO / RDSO-IRICEN</td><td>4 weeks / 1 week</td><td>On selection / after 3 yrs, then every 5</td></tr>
<tr><td>AT Welder</td><td>Initial / Refresher</td><td>TPP Lucknow, TWC Vijayawada</td><td>2 weeks / 1 week</td><td>On selection / every 2 years</td></tr>
<tr><td>JE/SSE welding supervisor</td><td>Initial</td><td>TPP/TWC</td><td>1 week</td><td>Once in service</td></tr></table>
<ul><li>Apprentice JE/SSE classroom: railway organisation, establishment rules, all P.Way topics (rails, sleepers, ballast, formation, electrified &amp; track-circuited areas, renewals, curves, inspections, patrolling, monsoon, accidents, LCs, trollies, SWR/LWR, high-speed routes, P&amp;C, tools), transportation (G&amp;SR, signals, systems of working), office work and TMS store module; plus site visits.</li>
<li>Promotional courses at first opportunity: Track Maintainer/Gateman → Keyman/Mate (DTC); Track Maintainer → JE (ZRTI); JE → SSE (ZRTI).</li>
<li>Refreshers for Keymen, Mates and JE/SSE <b>once in 5 years</b>.</li>
<li>Special courses: rail-wheel interaction &amp; derailments, geotechnics, survey, USFD, AT/FB welding, mechanised maintenance, P&amp;C, curves, high-speed track, track recording, TMS. Staff posted to welded/machine-maintained sections get a short special course first.</li></ul>`},
{id:"c14-comp", para:"1402(4), 1406–1407, Annex 14/2", title:"Competency certificates", body:`
<p>A competency holder must be literate, know Hindi or the local language and be medically fit; certificates are time-bound and renewed.</p>
<table class="t"><tr><th>Activity</th><th>Who holds</th><th>Issued by / validity</th></tr>
<tr><td>LWR work: fastening renewal without lifting, emergency fracture repair, SEJ checking &amp; greasing</td><td>Keyman (Gang Mate)</td><td>Divisional Training Centre — <b>5 years</b>; exceptionally ADEN — <b>1 year</b></td></tr>
<tr><td>Hot/cold/other patrolling, protecting track, passing a train at fracture in emergency</td><td>Patrolman (railway employee)</td><td>SSE/P.Way (In-charge)</td></tr>
<tr><td>Track maintenance activities</td><td>JE/P.Way</td><td>On passing initial/refresher/promotional courses</td></tr>
<tr><td>Trolley / lorry / dolly; motor trolley</td><td>Gang Mate / Head Trolleyman; Motor trolley driver</td><td>ADEN — <b>2 years</b></td></tr>
<tr><td>Gateman</td><td>Gateman / trackman</td><td>SSE (In-charge) / DTC — <b>5 years</b></td></tr>
<tr><td>Trolley/motor trolley/lorry</td><td>JE/SSE/P.Way</td><td>Senior Scale officer — <b>2 years</b></td></tr>
<tr><td>Supervise AT welding</td><td>JE/SSE</td><td>TPP Lucknow / TWC Vijayawada after TW3 course</td></tr>
<tr><td>AT welding — provisional (departmental)</td><td>Welder</td><td>TPP/TWC (TW1) — <b>100 joints or 6 months</b></td></tr>
<tr><td>AT welding — regular (departmental)</td><td>Welder</td><td>TPP/TWC (TW2) — 2 years, reassessed for next 2</td></tr>
<tr><td>AT welder of private firm</td><td>Firm welder</td><td>RDSO M&amp;C — provisional 2 yrs, regular 5 yrs</td></tr>
<tr><td>FB welding supervisor / welder (railway, firm)</td><td>Diploma/BSc; Class X</td><td>CTE / CE(Con); CTE for PSU/Metro</td></tr>
<tr><td>USFD operator, departmental</td><td>Operator</td><td>RDSO M&amp;C — initial 3 yrs, subsequent 5 yrs</td></tr>
<tr><td>USFD operator, contractor</td><td>Operator</td><td>RDSO — provisional 6 months, regular 2 yrs; QC in-charge 3 yrs</td></tr></table>
<p class="small">Private firm welders certified by RDSO per IRS specification; departmental welders by TPP/NR Lucknow and TWC Vijayawada per Annex 1 of AT Welding Manual.</p>`},
{id:"c14-med", para:"1408–1409, Annex 14/3–14/4", title:"Medical standards and books of reference", body:`
<p>Medical groups: <b>A</b> (vision for public safety, A-1 to A-3), <b>B</b> (for self/fellow workers, B-1, B-2), <b>C</b> (administration, C-1, C-2). Examiner: DMO and above.</p>
<table class="t"><tr><th>Category</th><th>Standard</th><th>Periodical medical exam</th></tr>
<tr><td>JE/SSE/P.Way, Gateman, Trolleyman</td><td><b>A-3</b></td><td>Every 4 years till 45, every 2 years till 55, then yearly</td></tr>
<tr><td>Gang Mate, Keyman, Track Maintainer</td><td><b>B-1</b></td><td>At 45 and then every 5 years</td></tr>
<tr><td>Safaiwala, Watchman</td><td>C-2</td><td>No PME</td></tr></table>
<p><b>Books every office keeps (Annex 14/4):</b> Railways Act; Engineering Code; IRPWM; Works Manual; Bridge Manual; Accident Manual &amp; circulars; Opening Rules (DEN office); G&amp;SR; IRSOD; Engineering Standing Orders; WTT &amp; appendix; Glued Joint Manual; FB Welding Manual; AT Welding Manual; Small Track Machine Manual; Track Machine Manual; USFD Manual; RDSO CT-35 (handling &amp; stacking of rails); plus RDSO/IRICEN publications. Circulars kept available on TMS / Zonal website.</p>`}

CH.push({
id:"c15", n:15, title:"Emerging Track Technology Items", short:"Modern technologies being introduced",
why:`Indian Railways is steadily modernising its track. This chapter is a short tour of technologies the manual asks Railways to adopt progressively — useful when you see these words in circulars, tenders or inspection notes.`,
sections:[
{id:"c15-list", para:"1501–1515", title:"The technologies at a glance", body:`
<table class="t"><tr><th>Para</th><th>Technology</th><th>In plain words</th></tr>
<tr><td>1501</td><td>Canted turnouts</td><td>Turnouts with rails inclined at 1 in 20 like plain track — better ride, longer life, safer. Procured to RDSO-approved specs.</td></tr>
<tr><td>1502</td><td>Modern sleeper &amp; fastening system</td><td>Fastening designed as one system, factory-fitted on sleepers from automated plants — solves liner bite corrosion, ERC jamming/loosening, pad crushing.</td></tr>
<tr><td>1503</td><td>Ballastless Track (BLT)</td><td>Concrete track slab instead of ballast — for tunnels, viaducts, yards and cuttings; less maintenance, lower life-cycle cost; per RDSO technical eligibility conditions.</td></tr>
<tr><td>1504</td><td>In-sleeper point machine</td><td>Point machine housed inside a hollow sleeper — no need to disconnect for tamping.</td></tr>
<tr><td>1505</td><td>Composite sleepers</td><td>Eco-friendly substitute for timber on girder bridges and special locations (RDSO approved).</td></tr>
<tr><td>1506</td><td>Phased Array UT (PAUT)</td><td>Steerable ultrasonic beams giving A/B/C/S-scan images of the whole rail/weld section — more accurate, repeatable, less human error.</td></tr>
<tr><td>1507</td><td>High Performance Rail Clamp</td><td>RDSO-approved clamps at fractures/flaws allowing <b>50 km/h or more</b> on temporary repairs.</td></tr>
<tr><td>1508</td><td>Rail Inspection Vehicle (RIV)</td><td>Self-propelled vehicle measuring rail head profile to plan optimum grinding.</td></tr>
<tr><td>1509</td><td>Rail milling</td><td>Machines that mill the rail head to restore profile and remove fatigued metal with micro-cracks &gt;0.3 mm.</td></tr>
<tr><td>1510</td><td>Rail-cum-Road Inspection Vehicle (RCRIV)</td><td>Self-propelled inspection vehicle replacing push trolleys, safe on electrified sections.</td></tr>
<tr><td>1511</td><td>New rail grades</td><td><b>60E1</b> profile; <b>R260</b> (better than Gr 880); <b>R260NC</b> (nickel-chromium-copper, corrosion resistant for coastal/industrial areas); <b>R350HT</b> (heat treated, for higher axle loads/sharp curves).</td></tr>
<tr><td>1512</td><td>Portable P&amp;C geometry system</td><td>Measures turnout geometry quickly and accurately, replacing manual measurement.</td></tr>
<tr><td>1513</td><td>Ground Penetrating Radar (GPR)</td><td>Vehicle-mounted radar scanning ballast and formation — finds fouled ballast and bad formation for scientific planning of deep screening.</td></tr>
<tr><td>1514</td><td>UTIS on Smart Loco</td><td>Unattended track inspection from a locomotive: line-scan video of components, axle-box accelerations, driver's-view video, alerts and predictive maintenance.</td></tr>
<tr><td>1515</td><td>Vehicular USFD</td><td><b>RCRV</b> (rail-cum-road, ~80 km/h transit, 40 km/h testing, under development) and <b>SPURT car</b> (self-propelled rail-bound, tests at 40 km/h); suspected defects confirmed by manual USFD.</td></tr></table>`}
],
facts:[
["High performance rail clamp speed","50 km/h and higher","1507"],
["Rail milling removes cracks of","> 0.3 mm","1509"],
["SPURT car testing speed","40 km/h","1515"],
["Corrosion-resistant rail","R260NC","1511"]
],
quiz:[

]

["Alignment (AL)","Deviation of each rail in the horizontal plane from its intended position, measured on a chord of specified length.","Terminology 1"],

["Blanket","Layer of granular material between ballast and subgrade across the full formation width.","Terminology 3"],
["Breathing length","The length at each end of an LWR/CWR that expands and contracts with temperature (≈44–82 m depending on zone, rail and sleeper).","Terminology 4"],
["Buckling","Sudden or gradual lateral or vertical shifting of track due to unbalanced thermal (compressive) stress.","Terminology 5"],
["Cant (super-elevation)","Amount by which one rail (outer on curves) is raised above the other.","Terminology 33"],
["Cant deficiency","When a train runs faster than equilibrium speed: theoretical cant needed minus actual cant.","Terminology 6"],
["Cant excess","When a train runs slower than equilibrium speed: actual cant minus theoretical cant needed.","Terminology 7"],
["Cant gradient","Rate at which cant (or deficiency) changes along a transition, e.g. 1 in 1000 = 1 mm per metre.","Terminology 8"],
["Catch siding","Safety siding off the main line to stop an uncontrolled train running into a station at the foot of a steep falling incline (ACS-13).","Terminology 9"],
["Centrifugal force","Outward force on a vehicle on a curve; depends on speed, mass and radius.","Terminology 10"],

["Consolidation of track","Building up ballast resistance against sleeper movement, initially before LWR and after any disturbance.","Terminology 12"],
["Cross level","Level difference between the two rails at one sleeper, one rail taken as reference.","Terminology 13"],

<script>
(function(){

var CHS = window.CH.slice().sort(function(a,b){return a.n-b.n;});

  FACTS.forEach(function(f){var t=(f.k+" "+f.v+" "+f.p).toLowerCase();if(ts.every(function(w){return t.indexOf(w)>=0;}))hits.push({type:"f",f:f,sc:6});});

 function(){function arr(id){return val(id).split(/[\s,;]+/).filter(function(x){return x!=="";}).map(Number);}

  var N=e.length-1;val("sl_k").split("\n").forEach(function(l){var x=l.trim().split(/[\s,]+/).map(Number);if(x.length===3&&!x.some(isNaN)&&x[0]>=0&&x[1]<=N){p[x[0]]+=x[2];p[x[1]]-=x[2];}});
  var d=p.map(function(v,i){return v-e[i];}),f=[],s=[];d.forEach(function(v,i){f[i]=(i?f[i-1]:0)+v;s[i]=i?s[i-1]+f[i-1]:0;});
  var se=e.reduce(function(a,b){return a+b;},0),sp=p.reduce(function(a,b){return a+b;},0),F=s[N];
  var circ=[];var mx=Math.max.apply(null,p);p.forEach(function(v,i){if(v===mx)circ.push(i);});var i0=circ[0],j0=circ[circ.length-1];
  var sug=(F!==0&&j0>i0)?'Suggested couple to close: <span class="mono">'+i0+' '+j0+' '+f1(-F/(j0-i0),2)+'</span> (add to the box and press Enter / edit).':"";

  e.forEach(function(v,i){o+='<tr><td>'+i+'</td><td>'+v+'</td><td>'+f1(p[i],2)+'</td><td>'+f1(d[i],2)+'</td><td>'+f1(f[i],2)+'</td><td>'+f1(s[i],2)+'</td><td><b>'+f1(2*s[i],1)+'</b></td></tr>';});

  var h='<div class="wide"><div class="sec-h" style="margin-top:0"><h2>Calculators &amp; checkers</h2><small>Results update as you type. Formulas and limits are from the cited paras.</small></div><nav class="toolnav">';
  TOOLS.forEach(function(t){h+='<a href="#'+t.id+'">'+t.title+'</a>';});
  h+='</nav><div class="tools">';
  TOOLS.forEach(function(t){h+='<section class="tool" id="'+t.id+'"><h3>'+t.title+' <span class="para">¶ '+t.para+'</span></h3><p>'+t.desc+'</p><div class="fields">'+t.fields+'</div><div class="out" id="'+t.id+'-o"></div></section>';});
  main.innerHTML=h+'</div><p class="note">Calculators help you understand and cross-check; they don’t replace the manual, approved drawings, or RDSO/Board instructions. Check inputs before using any result in an official document.</p></div>';
  TOOLS.forEach(function(t){var box=document.getElementById(t.id);var run=function(){var o;try{o=t.calc();}catch(e){o="Check the inputs.";}document.getElementById(t.id+"-o").innerHTML=o;};$$("input,select,textarea",box).forEach(function(el){el.addEventListener("input",run);});run();});
  if(focus){var el=document.getElementById(focus);if(el){el.scrollIntoView();el.classList.add("flash");}}else window.scrollTo(0,0);
}

/* ---------- router ---------- */
function route(){
  document.body.classList.remove("nav-open");
  var h=(location.hash||"#home").slice(1);
  if(h==="home"||h===""){viewHome();markSide("home");return;}
  if(h==="tools"){viewTools();markSide("tools");return;}
  if(h.indexOf("tool-")===0){viewTools(h);markSide("tools");return;}
  if(h==="ref"){viewRef();markSide("ref");return;}
  if(h==="glossary"){viewGloss();markSide("glossary");return;}
  if(h==="acs"){viewACS();markSide("acs");return;}
  if(h==="quiz"){viewQuiz();markSide("quiz");return;}
  var c=CHS.filter(function(x){return x.id===h;})[0];
  if(c){viewChapter(c);markSide(c.id);return;}
  var s=SECBY[h];
  if(s){viewChapter(s.ch,h);markSide(s.ch.id);return;}
  viewHome();markSide("home");
}
buildSide();
window.addEventListener("hashchange",route);
route();
var q=$("#q"),timer;
q.addEventListener("input",function(){clearTimeout(timer);timer=setTimeout(function(){if(q.value.trim().length>1){viewSearch(q.value);markSide("");}else route();},180);});
q.addEventListener("keydown",function(e){if(e.key==="Escape"){q.value="";route();}});
document.addEventListener("keydown",function(e){if(e.key==="/"&&document.activeElement!==q&&!/input|textarea|select/i.test(document.activeElement.tagName)){e.preventDefault();q.focus();}});
$("#menu").addEventListener("click",function(){document.body.classList.toggle("nav-open");});
$("#scrim").addEventListener("click",function(){document.body.classList.remove("nav-open");});
side.addEventListener("click",function(e){if(e.target.closest("a")){q.value="";var a=e.target.closest("a");if(a.getAttribute("href")===location.hash)route();}});
main.addEventListener("click",function(e){var a=e.target.closest('a[href^="#"]');if(!a)return;if(q.value){q.value="";}if(a.getAttribute("href")===location.hash){route();}});
})();

</script>
<script>
(function(){
  var isNative = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) || /Electron/i.test(navigator.userAgent);
  var standalone = isNative || (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
  if (standalone) document.documentElement.classList.add('standalone');
  if (isNative) document.documentElement.classList.add('native');

  // Offline cache (only when served over http/https, not inside the native shells)
  if (!isNative && 'serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
  }

  // "Get the app" chip
  var btn = document.getElementById('getapp'), deferred = null, dismissed = false;
  try { dismissed = localStorage.getItem('irpwm-getapp-dismissed') === '1'; } catch(e) {}
  if (standalone || dismissed || !btn) return;
  btn.classList.add('show');
  window.addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); deferred = e; });
  window.addEventListener('appinstalled', function(){ btn.classList.remove('show'); });
  btn.addEventListener('click', function(e){
    if (e.target.classList.contains('x')) {
      btn.classList.remove('show');
      try { localStorage.setItem('irpwm-getapp-dismissed', '1'); } catch(err) {}
      return;
    }
    if (deferred) { deferred.prompt(); deferred.userChoice.finally(function(){ deferred = null; }); }
    else { location.href = 'install.html'; }
  });
})();
</script>
