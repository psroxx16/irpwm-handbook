CH.push({
id:"c03", n:3, title:"Installation and Maintenance of Welded Rails", short:"AT/FB welding, SWR, LWR/CWR",
why:`Fish-plated joints are the weakest, noisiest, most maintenance-hungry part of a track. Welding rails together removes joints — but a long welded rail cannot expand freely, so huge temperature forces build up inside it. This chapter explains how rails are welded (Alumino-Thermic and Flash Butt), how Short Welded Rails (SWR) and Long Welded Rails (LWR/CWR) are laid, de-stressed and maintained, and what to do when a weld fractures or the track tries to buckle. It also contains the temperature rules every P.Way man in LWR territory must know by heart.`,
sections:[
{id:"c03-concept", para:"Concept", title:"Why welded rail behaves differently (the big idea)", body:`
<p>Steel expands when hot and shrinks when cold. A free 13 m rail grows about 0.15 mm per °C — the joint gap absorbs it. Weld 1 km of rail together and fasten it firmly to heavy PSC sleepers in good ballast: now the <b>central part cannot move at all</b>. Instead, a force builds up inside it:</p>
<div class="formula">P = E · A · α · t</div>
<p>where E = 2.11×10⁶ kg/cm², A = rail area (76.86 cm² for 60 kg; 66.15 cm² for 52 kg), α = 1.152×10⁻⁵ /°C, and t = difference between today's rail temperature and the <b>stress-free (de-stressing) temperature</b>. For 60 kg rail, each 1°C creates about <b>1.87 tonnes</b> of force per rail!</p>
<ul><li><b>Hot day (rail hotter than t<sub>d</sub>)</b> → <b>compression</b> → risk of <b>buckling</b> (track jumps sideways).</li>
<li><b>Cold night (rail colder than t<sub>d</sub>)</b> → <b>tension</b> → risk of <b>rail/weld fracture</b>.</li></ul>
<p>Only the last ~50–80 m at each end (the <b>breathing length</b>) moves, and that movement is absorbed by a <b>Switch Expansion Joint (SEJ)</b>. A welded rail longer than <b>250 m</b> on BG normally behaves as LWR (Para 325).</p>
<div class="tip">This is why t<sub>d</sub> is chosen slightly <b>above</b> the mean rail temperature t<sub>m</sub>: India's track is more endangered by buckling in summer than by fracture in winter. Try the <a href="#tool-thermal">Thermal Force calculator</a>.</div>`},
{id:"c03-temps", para:"Terminology 26, 335", title:"The rail temperatures you must know", body:`
<table class="t"><tr><th>Symbol</th><th>Name</th><th>Meaning</th></tr>
<tr><td>t<sub>m</sub></td><td>Mean annual rail temperature</td><td>Average of max and min rail temperature in the year; fixed locally from ≥5 years' records, else read from the rail temperature map (Fig 3.7)</td></tr>
<tr><td>t<sub>d</sub></td><td>De-stressing temperature</td><td>Average rail temperature while fastening rails after de-stressing without a tensor (with tensor, t<sub>d</sub> = t<sub>0</sub>)</td></tr>
<tr><td>t<sub>0</sub></td><td>Stress-free temperature</td><td>Temperature at which the LWR has no thermal stress</td></tr>
<tr><td>t<sub>i</sub></td><td>Installation temperature</td><td>Average rail temperature while fastening at installation</td></tr>
<tr><td>t<sub>p</sub></td><td>Prevailing rail temperature</td><td>Rail temperature at the time of an operation</td></tr></table>
<p><b>Rail temperature zones (Fig 3.7 map):</b> Zone I 40–50°C · Zone II 51–60°C · Zone III 61–70°C · Zone IV 71–76°C (annual range of rail temperature). Broadly, Zone I is the south-west coastal strip, Zone II most of the southern peninsula, Zone III central and eastern India, and Zone IV the hot north and north-west. Use local records of 5 years where available.</p>
<table class="t"><tr><th>Zone</th><th>Rail</th><th>Range of t<sub>d</sub> (conventional PSC)</th></tr>
<tr><td>I, II, III</td><td>All sections</td><td><b>t<sub>m</sub> to t<sub>m</sub> + 5°C</b></td></tr>
<tr><td>IV</td><td>52 kg &amp; heavier</td><td><b>t<sub>m</sub> + 5°C to t<sub>m</sub> + 10°C</b></td></tr></table>
<p><b>Reduced t<sub>d</sub> for wider-base PSC sleepers</b> (60 kg, 1660/km): Zones I–III: t<sub>m</sub>−5 to t<sub>m</sub>; Zone IV: t<sub>m</sub> to t<sub>m</sub>+5 — only on curves up to 5° (Zone I) / 4° (II–IV) and gradients up to 1 in 100. Not applicable to the sharp-curve / steep-gradient LWR of Para 326.</p>
<p><b>Thermometers (332):</b> embedded type (25–30 min to settle), dial/magnetic type on shady side of web (≈8 min), continuous recording type (24 h / 7 day chart), or any RDSO/CE approved type. A thermometer reading very differently from its neighbours is defective. Every gang and sectional JE/SSE must carry one; SSE (In-charge) records rail temperature preferably with a continuous recorder and updates TMS.</p>`},
{id:"c03-at", para:"301–311", title:"Alumino-Thermic (AT) welding", body:`
<p><b>How it works:</b> a "portion" of aluminium powder + iron oxide is ignited in a crucible; the reaction produces molten steel which flows into a sand mould clamped around the rail gap. On IR the <b>Short Pre-heating (SKV)</b> process is used with CO₂-dried high-silica sand moulds; pre-heating by air-petrol, compressed air-petrol or Oxy-LPG.</p>
<p><b>Selecting rails (303):</b> end bends within <b>+0.5/−0 mm vertical and ±0.5 mm lateral</b> on a 1 m straight edge; eliminate fish bolt holes (so the weld can be USFD tested). For second-hand rails:</p>
<ul><li>Not older than <b>50 years</b> and not obsolete (else CTE approval); substantial residual life.</li>
<li>Minimum dimensions: <b>60 kg</b> height ≥ <b>163 mm</b> (new 172), head width ≥ <b>66 mm</b> (new 72); <b>52 kg</b> height ≥ <b>150 mm</b> (new 156), head width ≥ <b>61 mm</b> (new 67).</li>
<li>USFD tested before welding; no bad scabbing, wheel burns, corrugation; ends cropped to remove bolt holes; cut by saw/abrasive disc, <b>never flame cut</b>; match-marked before release; kinks removed.</li>
<li>Don't weld different grades; if 72 UTS (Gr 710) must meet 90 UTS (Gr 880), use the 880 portion.</li></ul>
<p><b>Portions (304–305):</b> from RDSO-approved sources only, with RDSO-approved parameters (pre-heat time, pressure, mould waiting time) <span class="acs">ACS-9</span>. No fixed shelf life, but moisture ruins them — use first-in-first-out. Beyond <b>2 years</b>: reaction test one sample per batch; if quiet/boiling, make a test joint (weld chemistry + load-deflection test). Reject → ignite 5 at a time in a pit. Store igniters in a locked steel cupboard in a <b>different building</b>; never carry portions in passenger coaches.</p>
<p><b>Block &amp; traffic (306):</b> block of <b>70–75 minutes</b>; traffic allowed only <b>30 minutes after</b> welding, with speed restriction until grinding is complete. Team: 1 Welder Gr I/II, 2 Welder Gr III/skilled, 5 khalasis + trackmen.</p>
<p><b>Joggled fishplates (307):</b> every new in-situ weld is joggled with <b>2 clamps</b> and supported on 300–450 mm wooden blocks until passed by USFD. Joggled fishplates with clamps/far-end bolts on good welds are also required: on welds that have carried ≥50% of the rail's fatigue-life GMT; on banks ≥ <b>5 m</b> high; on bridges with waterway ≥ <b>100 m</b> and 100 m approaches; on curves of <b>3° or sharper</b>.</p>
<table class="t"><tr><th>AT weld finishing tolerance (308)</th><th>Limit</th></tr>
<tr><td>Vertical alignment (end of 1 m straight edge)</td><td>+1.0 mm / −0.0 mm</td></tr>
<tr><td>Lateral alignment (centre of 1 m)</td><td>±0.5 mm</td></tr>
<tr><td>Top surface (end of 10 cm)</td><td>+0.4 mm / −0.0 mm</td></tr>
<tr><td>Head sides, gauge face (centre of 10 cm)</td><td>±0.3 mm</td></tr></table>
<ul><li>Welds are numbered serially per km (repair welds get the next number); marked with month, year, agency and welder code on non-gauge side of head; recorded in Thermit Weld Register &amp; TMS. Outsourced agency re-welds non-conforming joints free.</li>
<li><b>Painting (310):</b> weld collar painted immediately; maintenance painting <b>once in 4 years</b> in normal areas, <b>every year</b> in corrosion-prone areas, on condition basis in severe-corrosion areas (declared by PCE) <span class="acs">ACS-16</span>.</li>
<li><b>Acceptance (311):</b> visual (cracks, blow holes, shrinkage, <b>fins</b> at mould parting line felt by fingers/mirror = defective), dimensional, and <b>USFD within 30 days</b>.</li></ul>`},
{id:"c03-fb", para:"312–316", title:"Flash Butt (FB) welding", body:`
<p>Electric current softens the rail ends, which are then forged together under pressure — no added metal, so FB welds are stronger and more reliable than AT welds. Done in <b>stationary plants</b> (rail mills, FBW depots) or by <b>mobile FBW plants</b>. Parameters are plant-specific and RDSO-approved; operators certified (CTE for depots).</p>
<p>Mobile plant: QAP approved by RDSO, then field approval after <b>30 trial welds in two shifts</b> passing visual, dimensional, USFD, hardness, transverse, macro and micro tests.</p>
<table class="t"><tr><th>FB finishing tolerance</th><th>New rails</th><th>Old rails</th></tr>
<tr><td>Vertical (centre of 1 m)</td><td>+0.3 / −0.0 mm</td><td>±0.5 mm</td></tr>
<tr><td>Lateral (centre of 1 m)</td><td>±0.3 mm</td><td>±0.5 mm</td></tr>
<tr><td>Head width, gauge side (10 cm)</td><td>±0.25 mm</td><td>±0.3 mm</td></tr>
<tr><td>Top table (10 cm)</td><td>+0.2 / −0.0 mm</td><td>±0.2 mm</td></tr>
<tr><td>Web zone</td><td colspan=2>+3.0 / −0.0 mm of parent contour</td></tr></table>
<p>Upset must not be raised more than 3 mm; no tearing or chisel marks. Plant welds are tested by <b>Phased Array UT (PAUT)</b>; field welds preferably by PAUT. Failed sample → two more; if either fails, RDSO revises parameters.</p>`},
{id:"c03-swr", para:"317–324", title:"Short Welded Rails (SWR)", body:`
<p>An SWR (typically 3 rails welded = 39 m panel) expands and contracts <b>throughout its length</b>, so it still needs joint gaps.</p>
<ul><li>Extra shoulder ballast on outside of curves: <b>100 mm</b> (up to 875 m radius), <b>150 mm</b> for sharper curves; 60 kg uses LWR profile.</li>
<li>SWR on PSC sleepers <b>not on curves sharper than 440 m</b> radius (existing may continue with CTE approval).</li>
<li>SWR butting insulated joints, crossing heels or SRJ: anchor <b>39 m</b> on the approach.</li></ul>
<details open><summary>Initial laying gaps — Table 1 (Para 319)</summary>
<table class="t"><tr><th>Zone I &amp; II: t<sub>i</sub></th><th>39 m panel</th><th>26 m rail</th></tr>
<tr><td>t<sub>m</sub>−17.5 to t<sub>m</sub>−12.6</td><td>12</td><td>10</td></tr><tr><td>t<sub>m</sub>−12.5 to t<sub>m</sub>−7.6</td><td>10</td><td>9</td></tr><tr><td>t<sub>m</sub>−7.5 to t<sub>m</sub>−2.6</td><td>8</td><td>7</td></tr><tr><td>t<sub>m</sub>−2.5 to t<sub>m</sub>+2.5</td><td>6</td><td>6</td></tr><tr><td>t<sub>m</sub>+2.6 to t<sub>m</sub>+7.5</td><td>4</td><td>5</td></tr><tr><td>t<sub>m</sub>+7.6 to t<sub>m</sub>+12.5</td><td>2</td><td>3</td></tr>
<tr><th>Zone III &amp; IV: t<sub>i</sub></th><th>39 m</th><th>26 m</th></tr>
<tr><td>t<sub>m</sub>−22.5 to t<sub>m</sub>−17.6</td><td>12</td><td>10</td></tr><tr><td>t<sub>m</sub>−17.5 to t<sub>m</sub>−12.6</td><td>10</td><td>9</td></tr><tr><td>t<sub>m</sub>−12.5 to t<sub>m</sub>−7.6</td><td>8</td><td>7</td></tr><tr><td>t<sub>m</sub>−7.5 to t<sub>m</sub>−2.5</td><td>6</td><td>6</td></tr><tr><td>t<sub>m</sub>−2.4 to t<sub>m</sub>+2.5</td><td>4</td><td>5</td></tr><tr><td>t<sub>m</sub>+2.6 to t<sub>m</sub>+7.5</td><td>2</td><td>3</td></tr></table>
<p class="small">Gaps in mm. If laying is outside these ranges, readjust gaps within 2 days, before track consolidates.</p></details>
<p><b>Gap survey (320):</b> once a year before end of February; on a clear sunny day, cool hours, rising temperature; divide into sub-sections between fixed points; measure with taper gauge. Compare average with Table 2 (permissible gaps in service):</p>
<ul><li><b>Case 1</b> — average OK, some individual gaps outside → correct only those; <b>never</b> cut a rail or add a longer one.</li>
<li><b>Case 2</b> — average outside → systematically re-gap the whole sub-section to Table 1 values; a longer/shorter rail may be needed.</li>
<li><b>Case 3</b> — all within range → no action.</li></ul>
<details><summary>Table 2 — permissible gaps in service (mm)</summary>
<table class="t"><tr><th>Zone I &amp; II rail temp</th><th>39 m</th><th>26 m</th></tr><tr><td>t<sub>m</sub>−17.5 to −12.6</td><td>11–14</td><td>8–13</td></tr><tr><td>t<sub>m</sub>−12.5 to −7.6</td><td>9–13</td><td>6–11</td></tr><tr><td>t<sub>m</sub>−7.5 to −2.5</td><td>7–11</td><td>5–10</td></tr><tr><td>t<sub>m</sub>−2.4 to +2.5</td><td>5–9</td><td>3–8</td></tr><tr><td>t<sub>m</sub>+2.6 to +7.5</td><td>3–7</td><td>2–7</td></tr><tr><td>t<sub>m</sub>+7.6 to +12.5</td><td>1–5</td><td>1–5</td></tr>
<tr><th>Zone III &amp; IV</th><th>39 m</th><th>26 m</th></tr><tr><td>t<sub>m</sub>−12.5 to −7.6</td><td>11–14</td><td>8–13</td></tr><tr><td>t<sub>m</sub>−7.5 to −2.6</td><td>9–13</td><td>6–11</td></tr><tr><td>t<sub>m</sub>−2.5 to +2.5</td><td>7–11</td><td>5–10</td></tr><tr><td>t<sub>m</sub>+2.6 to +7.5</td><td>5–9</td><td>3–8</td></tr><tr><td>t<sub>m</sub>+7.6 to +12.5</td><td>3–7</td><td>2–7</td></tr><tr><td>t<sub>m</sub>+12.6 to +17.5</td><td>1–5</td><td>1–5</td></tr></table></details>
<p><b>Creep (321):</b> rails "walk" in the direction of dominant traffic — sleepers go out of square, gauge distorts, bolts shear, track may buckle. Causes: poor toe load, poor ballast, bad joints, wrong gaps, damaged/uneven sleepers, poor drainage, yielding formation, loose packing. PSC with elastic fastenings is creep-resistant (no anchors needed). Creep posts on both sides at ≤1 km, top ≈25 mm above rail level. <b>Creep more than 150 mm is not permitted.</b> Adjust before summer, in cool hours, from the running-on end; closure rails mean <b>30 km/h</b> until replaced.</p>
<p><b>Buckling of non-LWR track (322):</b> watch junctions between creeping and anchored track — jammed joints there signal danger. Precautions: no ballast-disturbing work in high temperature, grease fishplates before summer, gap survey, adequate shoulder ballast, bolts tight but not over-tight. If buckled: protect; cut rails ≥ <b>6.5 m</b> apart, slew to line, insert cut rails with special fishplates and clamps, open with speed restriction.</p>
<p><b>Maintenance of SWR (324):</b></p>
<table class="t"><tr><th>Work</th><th>Zone I &amp; II</th><th>Zone III &amp; IV</th></tr>
<tr><td>Regular maintenance (packing, lifting, aligning, screening) without restriction when rail temp below</td><td>t<sub>m</sub> + 25°C</td><td>t<sub>m</sub> + 20°C</td></tr>
<tr><td>— on curves &lt;875 m radius or yielding formation</td><td>t<sub>m</sub> + 15°C</td><td>t<sub>m</sub> + 10°C</td></tr>
<tr><td>Major lifting/alignment, deep screening, continuous sleeper renewal</td><td>t<sub>m</sub> + 15°C</td><td>t<sub>m</sub> + 10°C</td></tr></table>
<p>Above these limits: open max <b>30 sleeper spaces</b> with ≥30 boxed spaces between, box up before day end. Fracture in SWR: cut out ≥ <b>5.5 m</b> and re-weld a new piece; no weld closer than <b>4 m</b> to a fish-plated joint.</p>`},
{id:"c03-lwr-where", para:"325–327", title:"Where LWR/CWR may be laid", body:`
<ul><li>All new lines, doublings, gauge conversions, permanent diversions → opened with LWR/CWR. All CTR/TSR/TRR(P) → provide LWR wherever permissible. Yards may be welded if all components are sound.</li>
<li>Min rail <b>52 kg</b>; no two different rail sections in one LWR; stable formation, full ballast; new rails preferably without bolt holes (chamfer any holes).</li>
<li>LWR is followed by the same track structure for at least <b>3 rail lengths (39 m)</b> beyond the SEJ. <b>LCs must not fall within breathing lengths.</b></li>
<li>Near P&amp;C: one 39 m panel between SRJ and SEJ, and between crossing and SEJ. Through P&amp;C → RDSO report <b>CT-48</b>; use <b>Weldable CMS crossings</b> (1 in 8.5 &amp; 1 in 12, 60 kg) per CT-48 (May 2024). Aim for <b>Zero Fish-Plated Track</b> on main lines.</li>
<li>Digital Axle Counters in all new works; elsewhere G3L glued joints, progressively replaced by DACs (327).</li>
<li>Installation or change of an LWR needs <b>CTE approval</b> on a detailed plan (scale 1:5000); deviations need <b>PCE</b> approval (326(4)).</li></ul>
<table class="t"><tr><th>Alignment / gradient limits</th><th>Limit</th></tr>
<tr><td>52 kg, PSC ≥1540/km</td><td>Curves up to <b>440 m</b> radius; in Zone I up to 350 m (5°) with extra precautions (300 mm clean cushion, 600 mm shoulder on outside for 100 m beyond TP, reference marks every 50 m, SEJs 100 m from TP on curves &gt;250 m long)</td></tr>
<tr><td>Steepest gradient (normal)</td><td><b>1 in 100</b></td></tr>
<tr><td>60 kg, PSC 1660/km, with PCE permission (Annex 3/19)</td><td>Curves up to <b>6.5°</b> (Zones I, II) / <b>6.0°</b> (III, IV); gradients up to <b>1 in 65</b> (Zones I–III) / <b>1 in 80</b> (Zone IV); combined: 5° with 1 in 65 (I–III), 4° with 1 in 80 (IV). Cross-bracing (RDSO/T-8329) on curves sharper than 6°.</td></tr>
<tr><td>Reverse curves</td><td>LWR may continue; 600 mm shoulder for 100 m on either side of common point (not needed if straight between them &gt;50 m)</td></tr>
<tr><td>LWR on Ballastless Track (BLT)</td><td>Min 60 kg; curves up to 350 m; gradient 1 in 80; fastening longitudinal restraint ≥ 15 kN/m/rail; 100 m ballast retaining wall at junction; SEJ ≥30 m into ballasted track; creep posts every 100 m for 500 m — if creep &gt;10 mm in 500 m, de-stress 1000 m</td></tr></table>`},
{id:"c03-sharp", para:"Annex 3/19", title:"Extra conditions for LWR on sharp curves & steep gradients", body:`
<p><b>Curves sharper than 4° (up to 5°) and gradients steeper than 1 in 100:</b></p>
<ul><li>Min 60 kg 90 UTS, PSC 1660/km with ERC Mk-V; full ballast; full fittings.</li>
<li>All good AT/FB welds joggled with <b>4 clamps</b>; defective welds with 2 clamps + 2 far-end bolts.</li>
<li>Pre-works of 336(1)(b) completed (realignment, sags/humps removed, vertical curves, formation).</li>
<li>Wear limits: vertical <b>8 mm</b>, lateral <b>6 mm</b>. Alignment defects within <b>10 mm on 10 m chord</b>.</li>
<li>Creep measured at least <b>monthly</b>; total creep must not exceed <b>50 mm per track km</b> — else de-stress.</li>
<li>ERC Mk-V + composite pads; toe load never below <b>600 kg</b>. Gauge-face lubrication by track-mounted lubricators (IRS:T-48, 2022).</li>
<li>USFD: inner rail as per manual; outer rail at <b>4 GMT</b> frequency; if back-wall echo loss &gt;20% FSH, hand-probe non-gauge side of outer rail head.</li>
<li>Steep gradients only where wheel burns/scabs are not prevalent.</li></ul>
<p><b>Sharper than 5°:</b> slack gauge sleepers; SSE (In-charge) monthly and ADEN quarterly monitoring; temperature records for 5–10 years analysed by Sr.DEN/DEN twice a year. <b>Sharper than 6°:</b> slack-gauge sleepers <b>cross-braced</b> per RDSO/T-8329.</p>
<p><b>Sharp curve + steep gradient:</b> all measures above; in Zone III t<sub>d</sub> may be raised by 5°C.</p>
<p><b>Monthly (SSE) / quarterly (ADEN) checklist:</b> ballast profile (impose SR if loose), alignment, creep, need for de-stressing, wear, joggled plates, inter-bracing, lubrication, toe load of sample ERCs, USFD of non-gauge face, surface defects, out-of-square sleepers.</p>`},
{id:"c03-sej", para:"328, 338", title:"SEJ and buffer rails — location and gaps", body:`
<table class="t"><tr><th>SEJ type</th><th>Where allowed</th></tr>
<tr><td>Conventional SEJ (RT-4160, RT-4165)</td><td>Not on curves sharper than <b>0.5°</b> (3500 m)</td></tr>
<tr><td>Improved SEJ (RT-6902/6914 SG80, RT-6922/6930 DG65)</td><td>Curves up to <b>2°</b>; 2°–4° use RT-8924 (80 mm) / RT-8926 (65 mm) for 60 kg with CTE approval</td></tr>
<tr><td>Thick Web SEJ (RT-8822)</td><td>Straight and curves up to 0.5° — progressively in renewals/new works</td></tr>
<tr><td>Any SEJ</td><td><b>Never on a transition curve</b></td></tr></table>
<p><b>Gap at SEJ at t<sub>d</sub>:</b> set to <b>40 mm</b> for both 52 kg and 60 kg (338(1)(b)). The tongue rail tip coincides with the mid-point of central bolts of the CI chair; reference line kept 20 mm from the central bolt.</p>
<p>The gap follows a <b>hysteresis curve</b> with temperature, so for any temperature there is a range. Measured gap between reference mark and tongue tip/stock rail corner should not differ by more than <b>±10 mm</b> from the Annex 3/9 range (3/9B for wider sleepers). Don't measure on a SWR/fish-plated side. Use the <a href="#tool-sejgap">SEJ Gap checker</a>.</p>
<p><b>Buffer rails (328(2))</b> <span class="acs">ACS-12</span> — a set of short fish-plated rails in lieu of SEJ, with PCE approval, where SEJ isn't permitted (interim till SEJ designs up to 6.5° are available), or temporarily for maintenance:</p>
<ul><li>Allowed on curves up to 6.5° (Zones I, II) / 6° (III, IV). <b>3 buffer rails in Zones I &amp; II, 4 in Zones III &amp; IV</b>, each <b>6.5 m</b> long, on PSC with ERC; 1 m fishplates with 6 bolts (bolt RDSO/T-11599).</li>
<li>Initial gap <b>7.5 mm</b> at each joint; holes chamfered; conventional track beyond box-anchored for 3 rail lengths; no kinks/hogs; bolts always tight.</li>
<li>Lubricate joints <b>twice a year</b> when rail temp is between t<sub>d</sub>±15°C and average gap 3–12 mm.</li>
<li>Individual gaps need not be equal. Abnormal if all gaps close below t<sub>d</sub>+30°C or fully open (15 mm) above t<sub>d</sub>−30°C (Zones III/IV; ±25°C for Zones I/II) → de-stress and reset 7.5 mm gaps.</li></ul>`},
{id:"c03-bridges", para:"329–331", title:"LWR/CWR over bridges", body:`
<ul><li><b>Ballasted deck without bearings</b> (slabs, box culverts, arches): LWR continues freely.</li>
<li><b>Ballasted deck / BLT with bearings:</b> Rail-Structure Interaction (RSI) analysis by CBE/CAO(C) per Bridge Rules 2.8.1.2 and RDSO <b>BS-126 Rev 1 (Dec 2023)</b>; else SWR. Special RSI-control arrangements per BS-114 <span class="acs">ACS-9</span>.</li>
<li><b>Un-ballasted deck</b> — max overall bridge length (m):</li></ul>
<table class="t"><tr><th>Zone</th><th>Rail</th><th>Rail-free fastenings (331(1))</th><th>Rail-free + 4 central sleepers box-anchored per span (331(2))</th></tr>
<tr><td rowspan=2>I</td><td>60 kg</td><td>30</td><td>77</td></tr><tr><td>52 kg</td><td>45</td><td>90</td></tr>
<tr><td rowspan=2>II</td><td>60 kg</td><td>11</td><td>42</td></tr><tr><td>52 kg</td><td>27</td><td>58</td></tr>
<tr><td rowspan=2>III</td><td>60 kg</td><td>11</td><td>23</td></tr><tr><td>52 kg</td><td>27</td><td>43</td></tr>
<tr><td rowspan=2>IV</td><td>60 kg</td><td>11</td><td>23</td></tr><tr><td>52 kg</td><td>27</td><td>43</td></tr></table>
<p class="small">Conditions: single spans ≤30.5 m with sliding bearings both ends; bridge outside breathing length; 50 m approaches well anchored with ballast heaped to rail foot; girders centralised; sliding bearings inspected in March &amp; October, lubricated once in 2 years.</p>
<table class="t"><tr><th>SEJ at far-end approach (331(3))</th><th>Zone</th><th>Max bridge length</th><th>Initial gap at t<sub>d</sub></th></tr>
<tr><td rowspan=4>190 mm SEJ</td><td>IV</td><td>55 m</td><td>70 mm</td></tr><tr><td>III</td><td>70 m</td><td>70 mm</td></tr><tr><td>II</td><td>110 m</td><td>65 mm</td></tr><tr><td>I</td><td>160 m</td><td>65 mm</td></tr>
<tr><td rowspan=2>120 mm SEJ</td><td>II</td><td>20 m</td><td>40 mm</td></tr><tr><td>I</td><td>50 m</td><td>40 mm</td></tr></table>
<p class="small">SEJ 15 m from abutment (DG65 improved SEJ may replace 120 mm SEJ). Gaps compared with Annex 3/9A (3/9C wider sleepers).</p>
<ul><li>Pier-to-pier welded rails with SEJ on each pier (331(4)), or single span with 190 mm SEJs 30 m from both abutments, installed at t<sub>m</sub>: max single span IV 75 m, III 87 m, II 110 m, I 146 m (331(5)). These are not entered in TMS as LWR.</li>
<li>Bridges not carrying LWR are isolated by <b>30 m</b> of well-anchored PSC track on each side.</li></ul>`},
{id:"c03-laying", para:"336–337", title:"Laying an LWR — survey to consolidation", body:`
<ol><li><b>Foot-by-foot survey</b>: isolate (by SEJs) locations where LWR can't continue — distressed bridges, sharp curves, steep grades, P&amp;C, unstable formation.</li>
<li><b>Preliminary works</b>: glued joints, curve realignment, sags/humps removed, vertical curves, formation stabilised, weak bridges rehabilitated, deep screening.</li>
<li><b>Detailed plan</b> at 1:5000 showing SEJ locations and features → <b>CTE approval</b>.</li>
<li><b>Materials per LWR:</b> four rail pieces ≥4 m; 2 SEJ sets; 1 m fishplates with screw clamps / joggled plates; closures; 1 m and 10 cm straight edges; callipers &amp; feeler gauges; rail cutter; rollers, tensor, mallets, side rollers; AT welding kit; protection equipment.</li>
<li><b>Welding (337)</b>: FB weld panels of 10–20 rails (or more); join in field by AT/mobile FB. Insert SEJs first with gaps at mean position, with closure rails.</li>
<li>De-stress as soon as ~1 km of panels is welded. If delayed and rail temp rises <b>&gt;20°C above welding temperature</b>, temporarily de-stress at <b>10°C below the max expected</b>; introduce cold weather patrol if it falls a lot. Final de-stressing after consolidation.</li></ol>
<div class="tip"><b>Consolidation (337(5))</b> — existing track after tamping: <b>50,000 GT of traffic or 2 days, whichever later</b>, OR one round of <b>DTS</b>. New track (CTR/TSR) or freshly deep-screened: <b>three rounds of packing, last two by tamping machine</b>.</div>`},
{id:"c03-destress", para:"339–343", title:"De-stressing and joining LWRs", body:`
<p>De-stressing means freeing the rail so that it becomes stress-free at the desired temperature, then fastening it again. Done under traffic block, personally supervised by JE/SSE/P.Way.</p>
<p><b>Without rail tensor (340)</b> — when rail temperature is within the t<sub>d</sub> range:</p>
<ol><li>Remove anchors, guard and check rails. Impose <b>30 km/h</b> and loosen fastenings on alternate sleepers before the block.</li>
<li>In block: cut out closure rail near SEJ; set SEJ gap (40 mm).</li>
<li>Unfasten from SEJ ends towards centre; lift rail on <b>rollers every 15th sleeper</b> (side rollers on curves); tap with wooden mallets.</li>
<li>Remove rollers; re-fasten <b>from the middle towards both ends</b> — all within the t<sub>d</sub> range. Record temperature, time and date.</li>
<li>Measure the four gaps, cut ≥4 m closure rails with AT welding gap, weld (unfasten 20 m at each LWR end before welding).</li></ol>
<p><b>With rail tensor (341)</b> — when t<sub>p</sub> is below desired t<sub>0</sub>, the rail is stretched by the amount it would have expanded:</p>
<ol><li>Create a 1 m gap at B (centre of first segment). Mark anchor lengths l<sub>a</sub> = <b>2.5 m per °C of (t<sub>0</sub>−t<sub>p</sub>)</b> at each end.</li>
<li>Erect marker pillars W0, W1, W2… at ~100 m. Unfasten and put on rollers; side rollers every n-th sleeper on curves, n = R × sleepers per rail ÷ [50 × (t<sub>0</sub>−t<sub>p</sub>)]; one outside support per three inside.</li>
<li>Tension lightly to remove kinks, release, note movement Y<sub>0</sub> at W0. Note t<sub>p</sub> once.</li>
<li>Required movement at W1 = Y<sub>0</sub> + L·α·(t<sub>0</sub>−t<sub>p</sub>); W2 = W1 + L·α·(t<sub>0</sub>−t<sub>p</sub>)… (Annex 3/11 extension table). Pull until each mark meets its pillar, fasten each segment in turn.</li>
<li>Paint mark at X + 2×25 − 1 mm across the gap; remove tensor, close gap temporarily, traffic at restricted speed. Later insert closure of exactly X (≥4 m), weld (25 mm gap per weld); release tensor ≥30 min after pouring.</li>
<li>When t<sub>p</sub> &lt; t<sub>d</sub>, <b>equalise forces</b> by releasing ≥125 m each side of B and tapping. Finally de-stress the end 125 m at t<sub>d</sub> and weld the closure next to SEJ.</li></ol>
<p class="small">Never make extra cuts to create a welding gap — weld below t<sub>d</sub> using the tensor and equalise. Try the <a href="#tool-extension">Extension calculator</a>.</p>
<p><b>Joining two LWRs (342):</b> replace SEJs by ordinary rails with two temporary ≥4 m rails; W0 pillars 100 m from centre; at t<sub>p</sub>&lt;t<sub>0</sub> release, note Y<sub>0</sub>, Y'<sub>0</sub>; paint mark at l + Lα(t<sub>0</sub>−t<sub>p</sub>) + Y<sub>0</sub> + Y'<sub>0</sub> + 2×25 − 1 mm (L = 200 m); insert rail l, weld; finally equalise.</p>
<p><b>Reference marks (343):</b> at each SEJ and at the LWR centre on reference pillars — <b>saw mark on the pillar, paint mark on the rail</b> (non-gauge face). <b>Never saw-mark a running rail.</b> Fix immediately after de-stressing and never shift them.</p>`},
{id:"c03-maint", para:"344–346", title:"Maintaining LWR/CWR — the temperature rules", body:`
<p>LWR may be maintained only by staff with a valid <b>competency certificate</b> (Annex 14/2) at or above the authorised level (Annex 3/10).</p>
<table class="t"><tr><th>Rule</th><th>Conventional PSC</th><th>Wider-base PSC</th></tr>
<tr><td>Regular maintenance allowed when rail temp is between</td><td><b>t<sub>d</sub> + 10°C and t<sub>d</sub> − 30°C</b></td><td><b>t<sub>d</sub> + 15°C and t<sub>d</sub> − 30°C</b></td></tr>
<tr><td>Speed restriction of 50 km/h if, during consolidation, rail temp exceeds</td><td>t<sub>d</sub> + 20°C</td><td>t<sub>d</sub> + 25°C</td></tr></table>
<ul><li>Regular maintenance = tamping/packing, lifting, aligning (incl. minor curve realignment), shallow screening/shoulder cleaning, fastening renewal requiring lift, SEJ maintenance. Finish before summer.</li>
<li>Ballast replenished before summer. Isolated shoulder shortage: Gang Mate may take ballast from the centre, width ≤ <b>600 mm</b>, depth ≤ <b>100 mm</b>. Dwarf walls at pedestrian/cattle crossings.</li>
<li><b>Tamping</b> with general lift ≤ <b>50 mm</b>; more lift in stages, each consolidated.</li>
<li><b>Manual work:</b> max <b>30 sleeper spaces</b> opened, ≥30 boxed between; in-between lengths only after <b>24 h traffic</b> (&gt;10 GMT routes) or <b>2 days</b> (others). Up to 100 spaces under JE/SSE supervision in exceptional cases when daily temps stay within t<sub>d</sub>−30 to t<sub>d</sub>+10.</li>
<li><b>Casual sleeper renewal:</b> not more than 1 in 30 consecutive sleepers at a time.</li>
<li><b>Fastening renewal</b> not needing lift: one sleeper at a time, ≥15 intact between (Keyman). Needing lift (pads): one at a time, ≥30 intact between (Gang Mate); or up to 5 sleepers either side if rail temp &lt; t<sub>d</sub>−10.</li>
<li><b>SEJ:</b> check, pack, align, <b>grease fortnightly</b> with grease to RDSO Generic Specification (March 2026) <span class="acs">ACS-12</span>.</li></ul>
<p><b>Special maintenance (346)</b> — through fitting renewal, deep screening, lifting/lowering, major curve realignment, sleeper renewal, bridge/formation rehabilitation:</p>
<ul><li>TFR → de-stress immediately after.</li>
<li>Deep screening: BCM + tamper + DTS together. If rail temp range during work &amp; consolidation is within <b>t<sub>d</sub>+10 to t<sub>d</sub>−20</b>, no cutting needed; otherwise temporary de-stress at <b>10°C below max expected</b>. Cold weather patrol if temperature may fall 20°C below. Screen from one end to the other, consolidate, then de-stress.</li>
<li>Other special works: isolate with SEJs, then de-stress and re-join.</li></ul>`},
{id:"c03-abnormal", para:"347–348", title:"When must an LWR be de-stressed?", body:`
<ul><li>SEJ gap beyond Annex 3/9 limits, beyond SEJ's maximum design gap, or tongue tip/stock rail corner crosses the reference line.</li>
<li>Creep of more than <b>20 mm</b> in the central portion.</li>
<li>Actual Stress-Free Temperature (by RDSO-approved NDT) shows locked-in stress.</li></ul>
<p>First the ADEN inspects for ballast deficiency, poor consolidation, missing fittings, poor ERC toe load, formation trouble, improper fracture repairs, faulty thermometers → correct → watch → if still abnormal, ADEN decides on de-stressing.</p>
<p><b>De-stress also:</b> after any special maintenance; after restoring track following an <b>unusual occurrence</b> (rail fracture or replacement of rail/glued joint, SEJ damage, buckling or tendency, accidents/breaches); and when rail/weld replacements exceed <b>3 per km</b>.</p>`},
{id:"c03-fracture", para:"349–352, Annex 3/17", title:"Rail fracture, SEJ damage, buckling, breaches", body:`
<p><b>Fracture in LWR</b> — whoever detects it suspends traffic and protects the line, then reports. Repairs in 4 stages:</p>
<ol><li><b>Emergency:</b> join with 1 m fishplates + screw/MS clamps, or joggled plates with clamps (with or without closure). First train <b>stop dead &amp; 10 km/h</b>, then <b>20 km/h</b> (Annex 3/8). May be done by Keyman/trackman with competency certificate.</li>
<li><b>Temporary:</b> insert a ≥4 m USFD-tested cut rail, preferably near t<sub>d</sub>; length = rail removed − allowance for 2 welds + saw cut (~51 mm).</li>
<li><b>Permanent:</b> weld (wide-gap AT where possible, using tensor for the correct gap). Rail inserted must equal rail removed minus 50 mm for two welds.</li>
<li><b>Local de-stressing:</b> below t<sub>d</sub>, unfasten <b>125 m on either side</b>, tap and re-fasten to equalise; record in TMS.</li></ol>
<div class="tip"><b>Why the 125 m equalisation matters (Annex 3/17):</b> a repair done at t<sub>d</sub>−30°C inserts ~14.4 mm extra rail (60 kg). Spread over 250 m this lowers the stress-free temperature by only ~5°C; without equalisation the SFT at the spot drops all the way to t<sub>d</sub>−30 — a buckle waiting to happen. Overlapping repairs add up.</div>
<p><b>Damaged SEJ (350):</b> replace and set gap to mean of Annex 3/9 for the prevailing temperature; if no spare, replace both SEJs at that location by closure rails with clamps and restricted speed.</p>
<p><b>Buckling (351):</b> causes — working outside temperature limits, poor ballast/consolidation, missing/ineffective fastenings, formation settlement, improper fracture repairs (a longer rail adds compressive force). Kinks are the warning; tap sleepers for hollowness (vertical buckling). On tendency: suspend traffic, protect, heap ballast on shoulders up to top of web (taken from between sleepers). On actual buckle: gas-cut rails ≥ <b>6.5 m</b> apart, slew to line, insert cut rails with special fishplates, first train stop dead &amp; 10, then 20 km/h; weld later; de-stress <b>≥500 m on either side</b>; ADEN investigates and reports to DEN.</p>
<p><b>Breaches/diversions (352):</b> isolate with SEJs (preferably at t<sub>d</sub>), use fish-plated/SWR with ERCs, fully consolidate new banks before re-laying LWR, de-stress after restoration.</p>`},
{id:"c03-sr", para:"Annex 3/8", title:"Speed restrictions for welded track (Annex 3/8)", body:`
<table class="t"><tr><th>Condition</th><th>Speed (km/h)</th></tr>
<tr><td>1 m slotted fishplates / screw or MS clamps / joggled plates with clamps — with 24 h watch</td><td>30 (20 without watch)</td></tr>
<tr><td>Approved <b>High Performance Rail Clamps</b> — with 24 h watch</td><td>50 (30 without watch)</td></tr>
<tr><td>Fastenings on alternate sleepers loosened before de-stressing</td><td>30</td></tr>
<tr><td>Fracture after emergency repair</td><td>First train: Stop dead &amp; 10; then 20</td></tr>
<tr><td>Fracture after emergency repair with HPRC + 24 h watch</td><td>First train: Stop dead &amp; 10; then 50</td></tr>
<tr><td>After emergency repair of a buckle</td><td>First train: Stop dead &amp; 10; then 20</td></tr>
<tr><td>Consolidation period, rail temp &gt; t<sub>d</sub>+20°C — shoulder &amp; crib compacted</td><td>50</td></tr>
<tr><td>— not compacted</td><td>30</td></tr></table>`},
{id:"c03-auth", para:"Annex 3/10", title:"Who may do what in LWR (Annex 3/10)", body:`
<table class="t"><tr><th>Work</th><th>Lowest level in charge</th></tr>
<tr><td>Mechanised tamping, general lift, alignment, minor curve realignment, deep screening, lifting/lowering, emergency work above permitted temperature</td><td>JE/P.Way</td></tr>
<tr><td>Manual packing &amp; alignment; single isolated sleeper; fastening renewal requiring lift; isolated shoulder ballast; imposing SR when temp &gt; t<sub>d</sub>+20; ensuring hot weather patrolman turns out</td><td>Gang Mate</td></tr>
<tr><td>Fastening renewal not requiring lift; SEJ checking, oiling &amp; greasing fortnightly</td><td>Keyman</td></tr>
<tr><td>Renewal of defective rails; site welding; casual renewals over long stretches; ballast replenishment; screening; curve realignment; organising hot weather patrol; de-stressing; temporary &amp; permanent fracture repair; buckling repairs; derailment/breach restoration; SEJ inspection</td><td>JE/P.Way</td></tr>
<tr><td>Fracture emergency repair</td><td>Keyman / trackman with valid competency certificate</td></tr>
<tr><td>Protecting track on buckle/fracture/abnormal behaviour</td><td>Patrolman</td></tr></table>`},
{id:"c03-records", para:"353–354, Annex 3/12–3/16", title:"Inspection, records & breathing lengths", body:`
<ul><li>Ballast profile always per Para 212 (pedestrian crossings, curves, LC/P&amp;C/bridge approaches); replenish before summer.</li>
<li>Inspect more often on <b>summer afternoons</b>; look for kinks and check patrols.</li>
<li>USFD never in arrears; replace defective rails/welds quickly.</li>
<li>LWR records in TMS: structure (3/12), annual maintenance &amp; performance (3/13), SEJ movement chart (3/14), central portion movement (3/15). On TMS, left/right rail is looking in direction of increasing km; movement positive in increasing km direction. Conventional SEJ central sleepers c/c must be 700 ± 10 mm.</li>
<li>Indication plate at each SEJ: date of de-stressing, t<sub>d</sub>/t<sub>0</sub>, LWR length.</li>
<li><b>ADEN certifies satisfactory behaviour of all LWRs before summer</b>; DEN/Sr.DEN countersigns and sends to CTE.</li></ul>
<table class="t"><tr><th>Breathing length (m), Annex 3/16</th><th>Density</th><th>60 kg conv.</th><th>52 kg conv.</th><th>60 kg wider</th></tr>
<tr><td rowspan=2>Zone I</td><td>1540</td><td>60</td><td>52</td><td>—</td></tr><tr><td>1660</td><td>58</td><td>50</td><td>44</td></tr>
<tr><td rowspan=2>Zone II</td><td>1540</td><td>69</td><td>59</td><td>—</td></tr><tr><td>1660</td><td>66</td><td>57</td><td>52</td></tr>
<tr><td rowspan=2>Zone III</td><td>1540</td><td>74</td><td>64</td><td>—</td></tr><tr><td>1660</td><td>77</td><td>66</td><td>59</td></tr>
<tr><td rowspan=2>Zone IV</td><td>1540</td><td>82</td><td>71</td><td>—</td></tr><tr><td>1660</td><td>79</td><td>68</td><td>56</td></tr></table>
<p class="small">Indicative; vary with site conditions. Longitudinal ballast resistance used for SEJ gaps: 13.28/13.74 kg/cm/rail/sleeper (1540/1660); Annex 3/9 tables use 11.76/12.98 kg/cm/rail; wider sleepers 12.77.</p>
<p><b>BLT fastening criteria (Annex 3/18):</b> longitudinal restraint ≥15 kN/m/rail; vertical static stiffness ≤52 kN/mm; dynamic/static ratio ≤1.4; clamping force ≥18 kN per rail seat; electrical resistance ≥5 kΩ.</p>`}
],

CH.push({
id:"c04", n:4, title:"Curves & Turnouts", short:"Cant, speed, transitions, P&C",
why:`A train on a curve is pushed outwards by centrifugal force. We fight this by raising the outer rail (<b>cant / super-elevation</b>) and by easing the train into the curve gradually with a <b>transition curve</b>. Turnouts (points &amp; crossings) let trains change tracks — they are the most complex, most inspected and most speed-limiting pieces of track. This chapter gives the formulas for cant, speed and transition length, the method of realigning curves by string-lining, and the rules for laying and maintaining turnouts.`,
sections:[
{id:"c04-radius", para:"401–402", title:"Measuring a curve — radius, degree and versine", body:`
<div class="formula">R = 125 × C² ÷ V</div>
<p>R = radius (m), C = chord length (m), V = versine (mm) — the gap at the middle of a chord stretched on the gauge face of the outer rail.</p>
<ul><li>With the standard <b>20 m chord</b>: R = 50,000 ÷ V. A 10 mm versine = 5000 m radius; 50 mm = 1000 m.</li>
<li><b>Degree of curve</b> = angle at the centre subtended by a 30.5 m chord. <b>1° ≈ 1750 m</b>; so R = 1750 ÷ D. 2° = 875 m, 4° = 437.5 m.</li>
<li>Curves are to be described by <b>radius in metres</b>.</li>
<li>Main line: <b>20 m overlapping chords, stations every 10 m</b>. Turnout and turn-in curves: <b>6 m chords, stations every 3 m</b>.</li>
<li>Cord/wire must touch the gauge point of the rail head.</li>
<li>The <b>inner rail is the reference rail</b> for level; cant is given by raising the outer rail.</li></ul>
<p>Try the <a href="#tool-curve">Curve calculator</a>.</p>`},
{id:"c04-cant", para:"403–404", title:"Cant, cant deficiency, cant excess and safe speed", body:`
<div class="formula">Equilibrium cant C = G·V² ÷ (127·R)</div>
<p>G = dynamic gauge = nominal gauge + rail head width (taken as <b>1750 mm</b> for BG), V in km/h, R in m. So <b>C ≈ 13.78 V²/R</b>. Round the cant to a multiple of <b>5 mm</b>.</p>
<ul><li><b>Cant deficiency (C<sub>d</sub>)</b> — a faster train needs more cant than provided; the shortfall.</li>
<li><b>Cant excess (C<sub>e</sub>)</b> — a slower (goods) train needs less; the extra. Causes heavy wear on the inner rail.</li>
<li><b>Equilibrium speed</b> for designing cant is decided by the Chief Engineer considering speeds of fast and slow trains, stops, junctions, gradients; sections can be split into sub-sections with their own equilibrium speed.</li></ul>
<div class="formula">Max safe speed V = 0.27 √[R × (C<sub>a</sub> + C<sub>d</sub>)]</div>
<table class="t"><tr><th>Limit</th><th>Value</th></tr>
<tr><td>Max design cant — Group A &amp; B routes</td><td><b>185 mm</b> (on existing track case-to-case with CTE approval)</td></tr>
<tr><td>Max design cant — other routes</td><td><b>165 mm</b></td></tr>
<tr><td>Max cant on track with turnouts (all routes)</td><td><b>140 mm</b></td></tr>
<tr><td>Cant deficiency — nominated stock</td><td><b>100 mm / 150 mm</b> (as per RDSO speed certificate after oscillation trial; 150-mm stock limited to 115 mm on turnouts with crossing on outer rail and on expansion devices)</td></tr>
<tr><td>Cant deficiency — other stock</td><td><b>75 mm</b></td></tr>
<tr><td>Cant excess — all stock</td><td><b>75 mm</b> (keep low on goods-heavy sections)</td></tr></table>
<p>Speed on a curve can never exceed the sectional speed. For non-transitioned curves, the change of motion happens over a <b>virtual transition of 14.785 m</b> (bogie-centre distance). Cant once fixed may be changed only with Chief Engineer's approval.</p>`},
{id:"c04-transition", para:"405–406", title:"Transition curves", body:`
<p>A transition gradually increases curvature and cant from zero on the straight to full value on the circle, so the passenger doesn't feel a sudden jerk. Desirable length L (m) is the <b>maximum</b> of:</p>
<div class="formula">L = 0.0056 C<sub>a</sub> V<sub>m</sub> &nbsp;|&nbsp; L = 0.0056 C<sub>d</sub> V<sub>m</sub> &nbsp;|&nbsp; L = 0.72 C<sub>a</sub></div>
<p>The first two keep the rate of change of cant / cant deficiency at <b>50 mm/s</b>; the third keeps the cant gradient at <b>1 in 720</b> (1.4 mm per m). Round up to the next 10 m.</p>
<ul><li><b>Restricted sites (with CTE approval):</b> minimum = greater of 5/6 of (a)/(b) or ½ of (c) — i.e. rate of change up to <b>60 mm/s</b> and cant gradient up to <b>1 in 360</b> (2.8 mm/m).</li>
<li><b>Non-transitioned curve (virtual transition):</b> rate of change 35 mm/s, so L = 0.008 C<sub>a</sub>V<sub>m</sub> and 0.008 C<sub>d</sub>V<sub>m</sub>, cant gradient 1 in 720; exceptionally (CTE) 2/3 of these with 55 mm/s and 1 in 360.</li>
<li>Design future layouts for <b>160 km/h (Group A)</b> and <b>130 km/h (Group B)</b>; if not possible on doubling/new lines, PCE approval.</li>
<li>Where transition is short, choose a lower cant/deficiency to get the best speed over the curve as a whole (worked example: 600 m curve with 40 m transition → C<sub>a</sub> = 95 mm, C<sub>d</sub> = 75 mm, speed 85 km/h).</li></ul>
<p><b>Setting out:</b> transition is a <b>cubic parabola</b>. The circle shifts inward by <b>Shift S = L²/24R</b>. Offset from the straight at distance x: <b>y = x³/6RL</b>. The transition bisects the shift. No change of grade over a transition.</p>
<p><b>Compound curve</b> (same direction): common transition L = 0.0056 (C<sub>a1</sub>−C<sub>a2</sub>) V<sub>m</sub> or with C<sub>d</sub>, whichever greater (used if longer than virtual transition). <b>Reverse curve</b>: L = 0.0056 (C<sub>a1</sub>+C<sub>a2</sub>) V<sub>m</sub> or with C<sub>d</sub>. On Group A/B routes keep a <b>straight of at least 50 m</b> between reverse-curve transitions, else extend transitions to eliminate it; if neither is possible, max <b>130 km/h</b>.</p>
<p><b>Running out cant (406):</b> on transitioned curves, run cant up/out uniformly <b>over the transition only</b>; on non-transitioned curves over the virtual transition. On reverse curves either keep one rail level (Case I) or keep the centre-line level and raise/lower both rails equally (Case II).</p>
<p>Try the <a href="#tool-transition">Transition length calculator</a>.</p>`},
{id:"c04-boards", para:"407", title:"Curve boards, posts and cant marking", body:`
<ul><li><b>Curve board</b> at each tangent point on the outside of curve showing radius, length of curve, transition length and max cant. Separate speed boards for nominated stock and other stock where restricted.</li>
<li><b>Rail posts</b> on the inside of the curve at beginning and end of transitions (painted red and white).</li>
<li><b>Cant value</b> painted on the inside face of web of the <b>inner rail</b> at every versine station, starting with zero at commencement of transition; on long circular curves at intervals ≤250 m.</li></ul>`},
{id:"c04-turnout-speed", para:"408–410", title:"Turnouts on running lines and their speeds", body:`
<p>General Rule 4.10: speed over non-interlocked facing points never above <b>15 km/h</b>; over turnouts and crossovers 15 km/h unless approved special instructions permit higher.</p>
<ul><li>Passenger running lines: <b>1 in 12 curved switch or flatter</b>. 1 in 8.5 curved switch from straight only exceptionally with PCE approval. Trailing-only emergency crossovers between straight double lines may be 1 in 8.5. Snag dead ends: 1 in 8.5 symmetrical split.</li>
<li>Avoid turnouts on curved main line. If unavoidable: 1 in 12 or flatter — resultant lead radius and main line radius not less than <b>350 m</b> (in yard remodelling, from inside of curve down to 290 m with PCE's personal approval); <b>1 in 8.5 never from inside of a curve</b>; 1 in 8.5 from outside of a curve up to 5° exceptionally with PCE approval.</li>
<li>Turn-in curve radius normally ≥ <b>350 m</b>; may go down to <b>220 m</b> if on PSC with main line spacing and full ballast.</li></ul>
<table class="t"><tr><th>Turnout type (curved switches, PSC)</th><th>Permissible speed <span class="acs">ACS-11</span></th></tr>
<tr><td>1 in 8.5 curved switch (overriding &amp; thick web)</td><td>15 km/h</td></tr>
<tr><td>1 in 8.5 thick web on emergency crossover (freight stock not in exception list)</td><td>25 km/h</td></tr>
<tr><td>1 in 8.5 symmetrical split</td><td>30 km/h</td></tr>
<tr><td>1 in 8.5 thick web symmetrical split + Para 408(5)</td><td>40 km/h</td></tr>
<tr><td>1 in 12 curved switch</td><td>30 km/h</td></tr>
<tr><td>1 in 12 thick web curved switch + Para 408(5)</td><td>40 km/h</td></tr></table>
<p><b>Conditions above 15 km/h:</b> PSC sleepers only; curved switches with min 52 kg; joints welded; running loops 52 kg SWP on 1540/km; turn-in curves same rail, PSC at max <b>65 cm</b> c/c, extra <b>150 mm</b> shoulder ballast outside; contiguous stations upgraded together.</p>
<p><b>For 40 km/h (408(5)):</b> thick web switches on PSC; min clean cushion 150 mm; all joints welded (CMS crossing joints may be fish-plated); turn-in/connecting curves with speed potential ≥40 km/h and radius not less than turnout curve; derailing switches preferably replaced (or thick-web derailing switches allowed 40 km/h <span class="acs">ACS-12</span>); loops on PSC ≥1540/km, 250 mm cushion with 150 mm clean; ballastless loops per RDSO CT-31B; check platform clearances.</p>
<p><b>No change of cant</b> from 20 m outside the toe of switch to 20 m beyond the nose of crossing (410). Don't take turnouts off a transition (CTE relaxation only, with uniform cant).</p>`},
{id:"c04-flexure", para:"409, 411–417", title:"Turnouts on curves, crossovers, diamonds, gradients, vertical curves", body:`
<ul><li><b>Similar flexure</b> (turnout curves the same way as main line): max main line cant = equilibrium cant for turnout + permissible cant excess. If not followed by a reverse curve, turnout has the same cant as main line. If followed by a reverse curve, cant may be changed behind the crossing at ≤2.8 mm/m, max turnout cant 65 mm.</li>
<li><b>Contrary flexure</b> (turnout curves the opposite way): main line cant becomes <b>negative cant</b> on the turnout; max main line cant = permissible cant deficiency on turnout − turnout's cant (formula in IRSOD).</li>
<li>Thick Web Switches on curves need <b>pre-curved stock and tongue rails at manufacture</b> and special sleeper spacing (Annex 4/6 contrary, 4/7 similar, 4/8 non-standard similar). Overriding switches: Annex 4/2, 4/2A, 4/9 <span class="acs">ACS-12</span>.</li>
<li><b>Crossovers on double-line curves</b>: speed and cant governed by the inner road (contrary flexure); outer road gets same cant and speed; both roads in the same inclined plane, else no cant + SR.</li>
<li><b>Diamond crossings on curves</b> avoided; if they exist, no cant for 20 m either side, SR decided by CTE but <b>never above 65 km/h</b>. Diamond on straight approach of curve needs ≥50 m straight to heel of acute crossing for unrestricted speed.</li>
<li><b>Extra clearances</b> on curves as per IRSOD.</li>
<li><b>Grade compensation</b> on curves = <b>70/R %</b> (0.04% per degree) wherever gradient + compensation would exceed ruling gradient. Example: ruling 1 in 200 on 583 m curve → 0.5 − 0.12 = 0.38% (1 in 264).</li>
<li><b>Vertical curves</b> where algebraic grade difference ≥ <b>4 mm/m (0.4%)</b>. Minimum radius: Group A <b>4000 m</b>, Group B <b>3000 m</b>, Groups C, D, E <b>2500 m</b>.</li></ul>`},
{id:"c04-stringline", para:"418–420", title:"Realigning curves by string-lining", body:`
<p>Smooth running needs no abrupt change of curvature or cant, and cant appropriate at every point. Versines, cant and gauge are checked per schedule and whenever running is poor; recorded on Annex 4/1 and TMS; SSE (In-charge) or ADEN decides on realignment (criteria in Para 524).</p>
<p><b>Step 1 — Versine survey:</b> on gauge face of outer rail; start marks ≥30 m (3 stations) before the curve; stations every 10 m painted white; versines to 1 mm on 20 m chord; record cant at each station and obstructions limiting slew; on multiple lines record track centres. For reverse curves hold the cord 20 mm clear and subtract.</p>
<p><b>Step 2 — Compute slews.</b> Principles:</p>
<ol><li>Sum of proposed versines = sum of existing versines.</li>
<li>A slew at a station changes the versines of neighbouring stations by half the amount in the opposite direction.</li>
<li><b>Second summation of versine differences = half the slew</b> at each station.</li>
<li>Slew at first and last station must be zero — use <b>correcting couples</b> to close it.</li></ol>
<p>Choose proposed versines with uniform rate of change on transitions and uniform values on the circle. Columns: existing V, proposed V, difference, 1st summation, 2nd summation (half slew), ×2 = full slew. Positive slew = inward. For long curves (&gt;50 stations) work 10 stations at a time. Software may be used.</p>
<p><b>Step 3 — Slew:</b> stake pegs on the inner cess at one gauge distance plus slew from the inner rail (outer cess in tight cuttings/tunnels, verified by versines); slew to pegs; set correct cant and repaint values and posts.</p>
<p>On double/multiple lines, <b>string-line each curve independently</b> — never by keeping uniform track centres from the realigned one.</p>
<p>Try the <a href="#tool-stringline">String-lining solver</a>.</p>`},
{id:"c04-rails-curves", para:"421–425", title:"Rails on curves — cut rails, joints, check rails, wear, lubrication", body:`
<ul><li><b>Cut rails (421):</b> on fish-plated curves the inner rail joint gains on the outer: <b>d = L × G ÷ R</b> (mm; L, R in m; G = gauge + head width). When lead = half the bolt hole pitch, insert a cut rail (shorter by one pitch).</li>
<li>Joints square at beginning and end of curve; on curves sharper than 400 m joints may be staggered.</li>
<li><b>Check rails</b> inside the inner rail on sharp curves — locations decided by DEN considering rolling stock and geometry; clearances per IRSOD.</li>
<li><b>Reduce outer rail wear:</b> gauge-face lubrication, correct geometry and cant, check rails, slack-gauge PSC sleepers.</li>
<li><b>Track-mounted automatic gauge-face lubricators</b> on curves of <b>875 m (2°) and sharper</b>; on rail-grinding routes on curves of <b>1400 m (1.25°) and sharper</b>. Only on rails without gauge corner cracking/head checks. Place on tangent just before transition, in the direction of heaviest traffic on single lines, away from switches/LWR discontinuities.</li>
<li>Rail wear on curves of radius <b>≤600 m</b> (lateral, vertical, total loss of section) recorded during scheduled curve inspections by SSE and JE.</li></ul>`},
{id:"c04-pc", para:"426–428", title:"Points & Crossings — parts and standard drawings", body:`
<p>A <b>turnout</b> = <b>switch assembly</b> (stock rails + tongue rails that move to set the route) + <b>lead</b> (the curve between switch and crossing) + <b>crossing assembly</b> (where one rail crosses the other, with wing rails and nose) + check rails. The <b>turn-in curve</b> connects the turnout beyond the heel of crossing to the adjoining track. The crossing number N (1 in 8½, 1 in 12) is the cotangent of the crossing angle; flatter (larger N) = gentler = faster.</p>
<table class="t"><tr><th>Layout</th><th>Complete</th><th>Switch</th><th>Crossing</th></tr>
<tr><td>52 kg 1 in 8½ PSC</td><td>RT-4865</td><td>RT-4866</td><td>RT-4867</td></tr>
<tr><td>60 kg 1 in 8½ PSC</td><td>RT-4965</td><td>RT-4966</td><td>RT-4967</td></tr>
<tr><td>52 kg 1 in 12 PSC</td><td>RT-4732</td><td>RT-4733</td><td>RT-4734</td></tr>
<tr><td>60 kg 1 in 12 PSC</td><td>RT-4218</td><td>RT-4219</td><td>RT-4220</td></tr>
<tr><td>60 kg 1 in 16 PSC</td><td>RT-5961</td><td>RT-5962</td><td>RT-5963</td></tr>
<tr><td>60 kg 1 in 20 PSC</td><td>RT-5858</td><td>RT-5859</td><td>RT-5860</td></tr>
<tr><td>60 kg 1 in 8½ Thick Web (ZU-1-60)</td><td>RT-6279</td><td>RT-6280</td><td>RT-4967</td></tr>
<tr><td>52 kg 1 in 12 Thick Web (ZU-2-49)</td><td>RT-5268</td><td>RT-5269</td><td>RT-4734</td></tr>
<tr><td>60 kg 1 in 12 Thick Web (ZU-1-60)</td><td>RT-6154</td><td>RT-6155</td><td>RT-4220</td></tr>
<tr><td>52/60 kg 1 in 8½ symmetrical split</td><td>RT-5353</td><td>RT-5354</td><td>RT-4867 / 4967</td></tr>
<tr><td>52/60 kg 1 in 12 symmetrical split</td><td>RT-5553</td><td>RT-5554</td><td>RT-4734 / 4220</td></tr></table>
<p>Turnouts are isolated from LWR/CWR by SEJs on either side; LWR through turnouts per RDSO <b>CT-48</b> <span class="acs">ACS-9</span>.</p>`},
{id:"c04-pcmaint", para:"429", title:"Inspecting and maintaining Points & Crossings", body:`
<p><b>General:</b> no 1 in 20 cant (except canted turnout designs); no junction fishplates at SRJ or heel of crossing; at least one rail each side of the same section; weld stock and lead joints; spherical washers on skew side — always on the <b>left side of switch assembly</b>; tapered washers both sides on crossings; correct sleeper spacing per Annexures; geometry not inferior to the route; keep clearances; packing never loose under switch and crossing; low cess and good drainage; organised maintenance cycles in big yards.</p>
<p><b>Switches:</b></p>
<ul><li>Check curvature of stock and tongue rails before laying (resultant lead radius when taking off from curves).</li>
<li><b>Tongue rail is worn/damaged when</b>: chipped/cracked over lengths aggregating <b>200 mm within 1000 mm of ATS</b> (1 in 8.5) or <b>within 2000 mm</b> (1 in 12, 1 in 16) — chipping = &gt;10 mm deep over a continuous 10 mm (may be reconditioned by welding) <span class="acs">ACS-8</span>; or twisted/bent with a <b>gap of 5 mm or more at toe</b>; stock rail wear per Para 702.</li>
<li>Signal staff remove rods/stretcher bars to allow proper tamping; operate points to check housing and throw; rectify housing jointly with S&amp;T for interlocked points.</li>
<li>Gap between top of <b>leading stretcher bar and bottom of stock rail: 1.5 to 5 mm</b> (maintained jointly with S&amp;T). Insulated stretcher bars only with S&amp;T present.</li>
<li>Lubricate gauge face of tongue rails and slide chairs with grease to RDSO Generic Specification (March 2026) <span class="acs">ACS-12</span>. S&amp;T cleans/lubricates slide chairs with signalling gear (usually up to the 3rd sleeper from toe); P.Way does the rest.</li></ul>
<p><b>Crossings:</b> nose damage → check for tight gauge or excess check-rail clearance. <b>Check-rail clearance 41–45 mm</b> on fan-shaped layouts. Max vertical wear on wing rail or nose: <b>10 mm</b> (<b>8 mm for Weldable CMS</b>). On Rajdhani/Shatabdi routes plan reconditioning at: built-up/welded <b>6 mm</b>, CMS <b>8 mm</b>, WCMS <b>6 mm</b>.</p>
<table class="t"><tr><th>Deduct from measured wear (casting slope)</th><th>Wing rail</th><th>Nose at ANC</th><th>Nose 100 mm behind ANC</th></tr>
<tr><td>Built-up</td><td>0</td><td>6.0</td><td>0</td></tr>
<tr><td>Heat-treated welded</td><td>0</td><td>6.0</td><td>3.5</td></tr>
<tr><td>CMS 52 kg</td><td>2.0</td><td>8.0</td><td>2.0</td></tr>
<tr><td>CMS 60 kg</td><td>2.5</td><td>8.5</td><td>2.5</td></tr>
<tr><td>WCMS 60 kg 1 in 12 / 1 in 8.5</td><td>2.5</td><td>8.5</td><td>6.0 / 5.7</td></tr></table>
<p><b>Lead and turn-in:</b> stations every 3 m; versines on 6 m chord within <b>3 mm of design</b> as good practice; turn-in curves on loops checked at each P&amp;C inspection.</p>
<p><b>Gauge in crossing portion: −3 mm to +1 mm</b> of 1676 mm <span class="acs">ACS-7</span>. Keep adjoining track at the same gauge as the turnout.</p>
<p><b>Inspections:</b> per Tables 1A/1B on Annex 4/3 (detailed) or 4/3A (intermediate); diamonds on 4/4, 4/4A, 4/4B. CTE may increase frequency for similar flexure, forced layouts or fast-deteriorating locations (reviewed yearly) <span class="acs">ACS-7</span>.</p>
<ul><li><b>Alterations:</b> position of P&amp;C changed only with DEN's written authority; <b>CRS sanction</b> needed for insertion/removal/alteration on running lines (not for shifting that doesn't affect signalling).</li>
<li>Before interlocking: correct level and alignment, full ballast and packing, mark rod crossings, correct gauge, clear cess, fit gauge ties. Slewing interlocked points only with signal staff present.</li>
<li>Paint month &amp; year of laying in white on the web ~500 mm from heel of switch and from the lead-side joint of crossing; never obliterate old dates; add reconditioning date.</li></ul>

{id:"c04-recon", para:"430–433", title:"Reconditioning switches and crossings", body:`
<ul><li>Crossings may be reconditioned in-situ or outside track, including by <b>Robotic welding</b> (computer-controlled, gasless coated wire, parameters logged). <b>Switches always outside track</b> (on level cess/depot along with stock rail); manual H3B/H3C electrodes.</li>
<li>Select only P&amp;C in good condition, certified by sectional JE/SSE, within wear limits, USFD-tested with no internal flaws. Reject if cracks &gt;3 mm deep beyond condemning size.</li>
<li>Only trained, certified welders (competency checked by Railway C&amp;M/CTE nominee, or RDSO for non-departmental; OEM certificate accepted).</li>
<li>Electrodes from RDSO-approved vendors: <b>H3B (min life 35 GMT)</b>, <b>H3C (50 GMT)</b>; <b>4 mm</b> diameter only; stored dry; discard cracked flux; dry at <b>130–170°C for 1 hour</b> before use (not needed if pack intact and used within 6 hours).</li>
<li>Reconditioned P&amp;C inspected <b>quarterly</b> — wear at 10 points on crossing (A1, A3, B1, B3, C1–C3, D1–D3) and on tongue rails every 100 mm up to 600 mm from toe.</li>
<li><b>Switch Rail Grinding Machine (SRGM)</b> grinds turnouts, LCs, check-railed curves where main-line RGM can't work.</li></ul>`}
],

CH.push({
id:"c05", n:5, title:"Track Monitoring & Tolerances", short:"TRC, OMS, TQI, maintenance limits",
why:`You can't maintain what you don't measure. Human inspections are subjective; machines give objective numbers. This chapter explains the <b>Track Recording Car (TRC)</b> and <b>Oscillation Monitoring System (OMS)</b>, what they measure, how often, how the results are converted into indices like TQI, and — most important — the three levels of limits (PML, CBML, UML) that decide whether track needs planned tamping, timely attention, or an immediate speed restriction.`,
sections:[
{id:"c05-trc", para:"501–505", title:"Track Recording Car — how it measures", body:`
<p>A TRC measures track geometry <b>under load</b> using the <b>inertial principle</b>: accelerometers on the coach floor/bogie frame record lateral and vertical accelerations; integrating twice gives their path in space. LVDT or laser sensors measure the distance from accelerometer to rail. Combining both (and correcting roll/yaw with gyroscopes) gives the actual rail profile. Gauge is measured directly — <b>contact sensor up to 100 km/h</b>, <b>contactless laser up to 160 km/h</b>.</p>
<ul><li>Quick calibration before every run (daylight only). Run through main lines between major stations.</li>
<li>Geometry recording works above <b>20 km/h</b> (below = "non-recorded"), but run at maximum section/TRC speed to judge ride quality.</li>
<li>Zonal Railways arrange power, crew and path per RDSO's monthly programme. <b>Sr.DEN/DEN, ADEN and SSE/P.Way (In-charge)</b> accompany the run in their section. RDSO gives the soft copy, uploaded to TMS.</li></ul>
<table class="t"><tr><th>Route speed</th><th>TRC frequency (506)</th></tr>
<tr><td>Above 130 km/h</td><td><b>Once in 2 months</b></td></tr>
<tr><td>Above 110 up to 130 km/h</td><td><b>Once in 4 months</b></td></tr>
<tr><td>Up to 110 km/h</td><td><b>Once in 6 months</b></td></tr></table>`},
{id:"c05-params", para:"507–509", title:"What the TRC records and reports", body:`
<ul><li><b>Unevenness</b> (UN) — vertical deviation of each rail, on two chords.</li>
<li><b>Alignment</b> (AL) — lateral deviation of each rail, on two chords.</li>
<li><b>Twist</b> (TW) — change of cross level over a base, mm/m.</li>
<li><b>Gauge</b> variation over 1676 mm; vertical &amp; lateral accelerations; curve details (laser TRC); speed.</li></ul>
<table class="t"><tr><th>Parameter</th><th>Short chord/base</th><th>Long chord/base</th></tr>
<tr><td>Unevenness</td><td>9.0 m (UN-1)</td><td>18.0 m (UN-2)</td></tr>
<tr><td>Alignment</td><td>9.0 m (AL-1)</td><td>15.0 m (AL-2)</td></tr>
<tr><td>Twist</td><td>3.0 m (TW-1)</td><td>15.0 m (TW-2)</td></tr></table>
<p><b>Per 200 m block:</b> SD of UN and AL (both rails, both chords), mean gauge, maintenance instructions for gauge (MI-G vs CBML/UML) and for SD (MI-SD vs PML/CBML), average speed, ride indices, parameter indices, TQI-S, TQI-L, TQI-C <span class="acs">ACS-4</span>.</p>
<p><b>Per km:</b> number of peaks above CBML (UN, AL), above CBML &amp; UML (twist, gauge), above UML (accelerations); 10 highest peaks of each with location (from 50 m blocks); 10 worst UML exceedances. <b>SMS alerts</b> for UML exceedances go through TMS to JE, SSE, ADEN, DEN/Sr.DEN and Sr.DEN/Co.</p>`},
{id:"c05-tqi", para:"510–512", title:"Parameter indices and Track Quality Index (TQI)", body:`
<p>Each SD is turned into an index between 0 and 100 (100 = as good as new track):</p>
<div class="formula">Index = 100 × e<sup>−[(SD<sub>measured</sub> − SD<sub>NTL</sub>) ÷ (1.3 × SD<sub>CBML</sub> − SD<sub>NTL</sub>)]</sup></div>
<p>(NTL = New Track Limit; CBML = Condition Based Maintenance Limit; computed for UNI-1, UNI-2, ALI-1, ALI-2.)</p>
<ul><li><b>TQI-S</b> = (UNI1 + ALI1)/2 — all speeds.</li>
<li><b>TQI-L</b> = (UNI2 + ALI2)/2 — speeds above 100 km/h.</li>
<li><b>TQI-C</b> = (UNI1 + ALI1 + UNI2 + ALI2)/4 — speeds above 100 km/h.</li></ul>
<div class="tip">TQI is only an <b>indicator</b>. Actual maintenance is planned from SD and peak values against the benchmark limits below. After each run, compare with the previous run, identify blocks for planned, need-based and urgent attention, and act per Para 523.</div>`},
{id:"c05-oms", para:"513–516", title:"Oscillation Monitoring System (OMS)", body:`
<p>OMS measures how the <b>vehicle responds</b> (vertical and lateral accelerations) using a portable, preferably GPS-enabled, accelerometer kept on the coach floor near the bogie pivot at the free end of the <b>rearmost coach of the fastest train</b> (or a dedicated last coach). Data uploaded to TMS.</p>
<ul><li>Frequency: <b>once a month on all routes</b>, irrespective of speed <span class="acs">ACS-5</span>.</li>
<li>Peaks of <b>0.15 g or above</b> are counted as defects <span class="acs">ACS-3</span>.</li></ul>
<table class="t"><tr><th>Average peaks per km</th><th>Very good</th><th>Good</th><th>Average</th></tr>
<tr><td>Section speed above 110 km/h</td><td>&lt; 1.0</td><td>1 – 2</td><td>&gt; 2</td></tr>
<tr><td>Others</td><td>&lt; 1.5</td><td>1.5 – 3.0</td><td>&gt; 3</td></tr></table>`},
{id:"c05-new", para:"519–520", title:"New track tolerances (laying standards)", body:`
<p>Measured 3 months after speed is raised to normal.</p>
<table class="t"><tr><th>TRC</th><th>SD ≤100 km/h</th><th>SD &gt;100–160</th><th>Peak ≤100</th><th>Peak &gt;100–160</th></tr>
<tr><td>UN-1</td><td>2.0</td><td>1.4</td><td>6.0</td><td>4.0</td></tr>
<tr><td>UN-2</td><td>—</td><td>1.9</td><td>—</td><td>6.0</td></tr>
<tr><td>AL-1</td><td>1.4</td><td>1.1</td><td>4.0</td><td>3.0</td></tr>
<tr><td>AL-2</td><td>—</td><td>1.3</td><td>—</td><td>4.0</td></tr></table>
<table class="t"><tr><th>Floating condition (manual)</th><th>Tolerance</th></tr>
<tr><td>Gauge — straight &amp; curves ≥350 m</td><td>−5 to +3 mm</td></tr>
<tr><td>Gauge — curves &lt;350 m</td><td>up to +10 mm</td></tr>
<tr><td>Gauge sleeper-to-sleeper variation</td><td>2 mm</td></tr>
<tr><td>Expansion gap (over average of 20 gaps)</td><td>±2 mm</td></tr>
<tr><td>Joints</td><td>No low joints; high joints ≤ +2 mm; squareness on straight ±10 mm</td></tr>
<tr><td>Sleeper spacing</td><td>±20 mm of theoretical</td></tr>
<tr><td>Cross level (every 4th sleeper)</td><td>±3 mm</td></tr>
<tr><td>Alignment on straight (10 m chord)</td><td>±2 mm</td></tr>
<tr><td>Versine variation, 20 m chord — R &gt;600 m / &lt;600 m</td><td>5 mm / 10 mm</td></tr>
<tr><td>Longitudinal level vs approved section</td><td>50 mm</td></tr></table>`},
{id:"c05-limits", para:"521–522", title:"The three maintenance limits — PML, CBML, UML", body:`
<div class="cards3">
<div class="card c-ok"><b>PML</b> — Planned Maintenance Limit<br>SD-based (UN, AL). Guides <b>through tamping</b> of a whole block section/yard by machines. No peak limits.</div>
<div class="card c-warn"><b>CBML</b> — Condition Based Maintenance Limit<br>SD + peaks (UN, AL); peaks (gauge, twist). Attend in reasonable time <b>before</b> it reaches UML.</div>
<div class="card c-bad"><b>UML</b> — Urgent Maintenance Limit<br>Acceleration peaks + gauge &amp; twist peaks. <b>Reduce speed immediately</b>; restore only after attention.</div></div>
<table class="t"><tr><th>Speed band</th><th>UN-1 PML / CBML</th><th>UN-2 PML / CBML</th><th>AL-1 PML / CBML</th><th>AL-2 PML / CBML</th><th>Twist CBML / UML</th><th>Accn UML</th></tr>
<tr><td>≤100 km/h</td><td>SD 5.0 / SD 6.8, pk 20</td><td>—</td><td>SD 3.3 / SD 4.9, pk 15</td><td>—</td><td>5 / 7 mm/m</td><td>0.30 g</td></tr>
<tr><td>&gt;100–110</td><td>3.8 / 5.5, pk 17</td><td>5.4 / 7.5, pk 23</td><td>2.5 / 3.9, pk 12</td><td>4.1 / 6.7, pk 20</td><td>4 / 7</td><td>0.30 g</td></tr>
<tr><td>&gt;110–130</td><td>3.3 / 4.9, pk 15</td><td>5.1 / 7.4, pk 22</td><td>2.5 / 3.6, pk 11</td><td>3.5 / 5.3, pk 16</td><td>4 / 6</td><td>0.25 g</td></tr>
<tr><td>&gt;130–160</td><td>2.9 / 4.4, pk 13</td><td>4.4 / 6.6, pk 20</td><td>1.9 / 3.6, pk 11</td><td>2.5 / 4.9, pk 15</td><td>3.5 / 5</td><td>0.20 g</td></tr></table>
<p class="small">All in mm unless stated. On curves, alignment limits are above average versine.</p>
<table class="t"><tr><th>Gauge (mm) over 1676</th><th colspan=2>≤160 km/h except &gt;130 band<br>CBML / UML</th><th colspan=2>&gt;130–160 km/h<br>CBML / UML</th></tr>
<tr><td>Mean over 200 m — straight</td><td>−8 to +10</td><td>−10 to +12</td><td>−6 to +10</td><td>−8 to +12</td></tr>
<tr><td>Mean — curve R ≥440 m</td><td>−5 to +14</td><td>−7 to +17</td><td>−5 to +13</td><td>−7 to +15</td></tr>
<tr><td>Mean — curve R &lt;440 m</td><td>−5 to +18</td><td>−7 to +20</td><td>−5 to +18</td><td>−7 to +20</td></tr>
<tr><td>Isolated peak — straight</td><td>−10 to +12</td><td>−12 to +15</td><td>−8 to +12</td><td>−10 to +15</td></tr>
<tr><td>Isolated — curve R ≥440 m</td><td>−7 to +17</td><td>−11 to +20</td><td>−6 to +16</td><td>−9 to +20</td></tr>
<tr><td>Isolated — curve R &lt;440 m</td><td>−6 to +22</td><td>−8 to +25</td><td>−6 to +22</td><td>−8 to +25</td></tr></table>
<p>Use the <a href="#tool-trc">TRC limit checker</a> to classify a reading.</p>`},
{id:"c05-action", para:"523", title:"What to do after a TRC run", body:`
<ol><li><b>UML exceeded</b> (TRC or OMS): ADEN/SSE on the car note it and <b>impose speed restriction immediately</b>; relax only after attention.</li>
<li><b>CBML exceeded</b>: identify blocks (SD) and isolated spots (peaks) via offline software/TMS; attend within a reasonable time (depends on defect size, cause, traffic, speed). Also tamp the gap between two CBML locations if ≤ <b>200 m</b>. If a CBML block in a yard includes part of a turnout, <b>tamp the whole turnout</b>.</li>
<li><b>PML — through tamping planning</b>: block section = from block of last SEJ of previous station to block of first SEJ of current station (those SEJ blocks excluded), UP and DN separately. Yard = block with first SEJ to block with last SEJ (CWR yards: 50 m beyond farthest SRJ/back of crossing). Plan through tamping when blocks exceeding PML are <b>&gt;40%</b> (block section) or <b>&gt;50%</b> (yard). Turnouts and passenger loops tamped on condition basis by ADEN while machines are in the yard.</li>
<li><b>No TRC run</b> for more than 2 months beyond schedule, or routes not covered: maintain on OMS and other inspections; Sr.DEN/DEN reviews at least every 6 months and proposes through tamping via Sr.DEN/Co for CTE approval <span class="acs">ACS-4, ACS-12</span>.</li></ol>`},
{id:"c05-curves", para:"524", title:"When to realign a curve", body:`
<table class="t"><tr><th>Speed on curve</th><th>Station-to-station versine variation limit</th></tr>
<tr><td>110 – 160 km/h</td><td><b>10 mm</b> (15 mm at 110 km/h) or 20% of average circular versine, whichever more</td></tr>
<tr><td>50 – below 110 km/h</td><td><b>20 mm</b> or 20% of average versine, whichever more</td></tr>
<tr><td>Below 50 km/h</td><td><b>40 mm</b> or 20% of average versine, whichever more</td></tr></table>
<p>A few exceedances → local adjustment as early as possible. If <b>more than 20% of stations</b> exceed, plan <b>complete realignment within a month</b>.</p>`},
{id:"c05-floating", para:"525–527", title:"Manual (floating) gauge & twist limits, low-speed tracks, derailment note", body:`
<table class="t"><tr><th>Floating condition — guidance</th><th>Limit</th></tr>
<tr><td>Gauge — straight</td><td>−6 to +6 mm</td></tr>
<tr><td>Gauge — curves R ≥440 m</td><td>−6 to +15 mm</td></tr>
<tr><td>Gauge — curves R &lt;440 m</td><td>up to +20 mm</td></tr>
<tr><td>Twist on 3.0 m base — straight &amp; circular curve</td><td>3.5 mm/m</td></tr>
<tr><td>Twist on transition (local, above design)</td><td>2.1 mm/m</td></tr></table>
<p>Exceedance → analyse last TRC/OMS and plan maintenance.</p>
<table class="t"><tr><th>Low-speed track (yards, work sites)</th><th>UN peak (3.6 m chord)</th><th>Twist peak (3.0 m)</th><th>Gauge range</th></tr>
<tr><td>Up to 45 km/h</td><td>22 mm</td><td>18 mm</td><td>−10 to +27 mm</td></tr>
<tr><td>Up to 30 km/h</td><td>24 mm</td><td>21 mm</td><td>−10 to +27 mm</td></tr>
<tr><td>Up to 15 km/h</td><td>33 mm</td><td>25 mm</td><td>−12 to +27 mm</td></tr></table>
<div class="warn"><b>Para 527 — important for accident enquiries:</b> derailment depends on track, vehicle, their maintenance and speed together. IR has <b>no "safety tolerances" for track alone</b>. The tolerances in this manual are for riding comfort; a deviation from them must not by itself be held as the cause of a derailment without examining all evidence.</div>`}
],
