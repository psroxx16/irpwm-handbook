name: Build apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The web uploader flattens folders, so the app source arrives as one zip. Unpack it into the repo (replacing the previous version).
  unpack:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.done.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Unpack the uploaded app source zip
        run: |
          Z=$(ls *app-source*.zip 2>/dev/null | head -1)
          if [ -n "$Z" ]; then
            cp "$Z" /tmp/src.zip
            git rm -r -q --ignore-unmatch www electron assets build android-signing make.py src-install.html capacitor.config.json package.json "$Z"
            unzip -o -q /tmp/src.zip
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -q -m "Unpack app source"
            git push
          fi
      - id: done
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  web:
    needs: unpack
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ needs.unpack.outputs.sha }}" }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: www }
      - id: deploy
        uses: actions/deploy-pages@v4

  android:
    needs: unpack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ needs.unpack.outputs.sha }}" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install --no-audit --no-fund
      - name: Create Android project
        run: |
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#102542' --iconBackgroundColorDark '#102542' --splashBackgroundColor '#102542' --splashBackgroundColorDark '#102542'
          sed -i 's/#3F51B5/#102542/g; s/#303F9F/#102542/g; s/#FF4081/#B98A3E/g' android/app/src/main/res/values/colors.xml || true
          sed -i 's/versionName "1.0"/versionName "2.0.${{ github.run_number }}"/; s/versionCode 1$/versionCode ${{ github.run_number }}/' android/app/build.gradle
          npx cap sync android
      - name: Build APK
        run: |
          mkdir -p ~/.android && cp android-signing/debug.keystore ~/.android/debug.keystore
          cd android && chmod +x gradlew && ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../IRPWM-Android.apk
      - uses: actions/upload-artifact@v4
        with: { name: android, path: IRPWM-Android.apk }

  windows:
    needs: unpack
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ needs.unpack.outputs.sha }}" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npx electron-builder --win --publish never
        env: { CSC_IDENTITY_AUTO_DISCOVERY: "false" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/IRPWM-Windows-Setup.exe
            dist/IRPWM-Windows-Portable.exe

  release:
    needs: [unpack, android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: android, path: out }
      - uses: actions/download-artifact@v4
        with: { name: windows, path: out }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: IRPWM v2.0.${{ github.run_number }} — Indian Railways Permanent Way Manual
          target_commitish: ${{ needs.unpack.outputs.sha }}
          make_latest: true
          body: |
            Indian Railways Permanent Way Manual, 2024 reprint incorporating Advance Correction Slips up to No. 16. Complete text, annexures, correction-slip register, search and bookmarks. Works offline.
            - **Android:** IRPWM-Android.apk. Open it on the phone and allow "Install unknown apps". Installs over the earlier version.
            - **Windows:** IRPWM-Windows-Setup.exe (installer) or IRPWM-Windows-Portable.exe (no installation). If SmartScreen appears: More info, then Run anyway.
            - **iPhone / iPad:** open the web app in Safari, then Share, then Add to Home Screen.
          files: out/*
