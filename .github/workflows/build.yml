name: Build apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # First upload is a single zip (the GitHub web uploader flattens folders). Unpack it into the repo once.
  unpack:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.done.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Unpack app-source.zip (first run only)
        run: |
          if [ -f app-source.zip ]; then
            unzip -o -q app-source.zip
            git rm -q app-source.zip
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -q -m "Unpack app source"
            git push
          fi
      - id: done
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  web:
    needs: unpack
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ needs.unpack.outputs.sha }}" }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: www }
      - id: deploy
        uses: actions/deploy-pages@v4

  android:
    needs: unpack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ needs.unpack.outputs.sha }}" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install --no-audit --no-fund
      - name: Create Android project
        run: |
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#F2C02E' --iconBackgroundColorDark '#F2C02E' --splashBackgroundColor '#17212B' --splashBackgroundColorDark '#17212B'
          sed -i 's/#3F51B5/#17212B/g; s/#303F9F/#17212B/g; s/#FF4081/#F2C02E/g' android/app/src/main/res/values/colors.xml || true
          sed -i 's/versionName "1.0"/versionName "1.0.${{ github.run_number }}"/; s/versionCode 1$/versionCode ${{ github.run_number }}/' android/app/build.gradle
          npx cap sync android
      - name: Build APK (signed with the repo's fixed debug key so updates install over the old version)
        run: |
          mkdir -p ~/.android && cp android-signing/debug.keystore ~/.android/debug.keystore
          cd android && chmod +x gradlew && ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../IRPWM-Handbook.apk
      - uses: actions/upload-artifact@v4
        with: { name: android, path: IRPWM-Handbook.apk }

  windows:
    needs: unpack
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ needs.unpack.outputs.sha }}" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npx electron-builder --win --publish never
        env: { CSC_IDENTITY_AUTO_DISCOVERY: "false" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/IRPWM-Handbook-Setup.exe
            dist/IRPWM-Handbook-Portable.exe

  release:
    needs: [unpack, android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: IRPWM Handbook v1.0.${{ github.run_number }}
          target_commitish: ${{ needs.unpack.outputs.sha }}
          make_latest: true
          body: |
            IRPWM Handbook (IRPWM 2024 reprint, corrected up to ACS-16).
            - **Android:** IRPWM-Handbook.apk — open it on the phone and allow "Install unknown apps".
            - **Windows:** IRPWM-Handbook-Setup.exe (installer) or IRPWM-Handbook-Portable.exe (no install). SmartScreen: More info → Run anyway.
            - **iPhone/iPad:** open the web app in Safari → Share → Add to Home Screen.
          files: out/*
